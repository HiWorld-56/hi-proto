syntax = "proto3";
package hi.qa;
option go_package = "github.com/HiWorld-56/hi-proto/go/hi/qa";

import "buf/validate/validate.proto";
import "hi/common.proto";
import "hi/club/messaging.proto";
import "hi/options.proto";

// brain QA application contracts; independent of the message engine and AI QA history.
// HTTP adapters use these ProtoJSON bodies. Authentication is a QA session issued
// only over an authenticated HiClub operator conversation, never a self-reported DID.
enum IssueStatus {
  ISSUE_STATUS_UNSPECIFIED = 0;
  ISSUE_STATUS_NOT_STARTED = 1;
  ISSUE_STATUS_IN_PROGRESS = 2;
  ISSUE_STATUS_DEFERRED = 3;
  ISSUE_STATUS_RESOLVED = 4;
}
enum Environment {
  ENVIRONMENT_UNSPECIFIED = 0;
  ENVIRONMENT_PRODUCTION = 1;
  ENVIRONMENT_DEVELOPMENT = 2;
}
message Report {
  option (hi.audience) = VIS_SELF;
  optional string conversation = 1 [(hi.visibility) = VIS_SELF];
  hi.club.Message message = 2 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 received_at = 3 [(hi.visibility) = VIS_SELF];
  hi.club.Contents display_contents = 4 [(hi.visibility) = VIS_PARTICIPANT]; // derived view; original message bytes remain authoritative
}
message IssueEvent {
  option (hi.audience) = VIS_SELF;
  optional string kind = 1 [(hi.visibility) = VIS_SELF];
  hi.Entity actor = 2 [(hi.visibility) = VIS_PUBLIC];
  optional string text = 3 [(hi.visibility) = VIS_SELF];
  optional int64 timestamp = 4 [(hi.visibility) = VIS_SELF];
}
message Confirmation {
  option (hi.audience) = VIS_SELF;
  optional string question = 1 [(hi.visibility) = VIS_SELF];
  hi.Entity requested_from = 2 [(hi.visibility) = VIS_PUBLIC];
  optional string message_uuid = 3 [(hi.visibility) = VIS_SELF];
  optional string plan_id = 4 [(hi.visibility) = VIS_SELF];
  optional bool approval_required = 5 [(hi.visibility) = VIS_SELF];
}
message Issue {
  option (hi.audience) = VIS_SELF;
  optional uint64 id = 1 [(hi.visibility) = VIS_SELF];
  optional string title = 2 [(hi.visibility) = VIS_SELF];
  optional IssueStatus status = 3 [(hi.visibility) = VIS_SELF];
  optional Environment environment = 4 [(hi.visibility) = VIS_SELF];
  hi.Entity reporter = 5 [(hi.visibility) = VIS_PUBLIC];
  repeated Report reports = 6 [(hi.visibility) = VIS_SELF];
  repeated IssueEvent events = 7 [(hi.visibility) = VIS_SELF];
  Confirmation confirmation = 8 [(hi.visibility) = VIS_SELF];
  optional int64 created_at = 9 [(hi.visibility) = VIS_SELF];
  optional int64 updated_at = 10 [(hi.visibility) = VIS_SELF];
  optional uint64 revision = 11 [(hi.visibility) = VIS_SELF];
  optional string last_result = 12 [(hi.visibility) = VIS_SELF];
}
message ListIssuesReq {
  optional IssueStatus status = 1 [(buf.validate.field).enum = { in: [1, 2, 3, 4] }];
  optional Environment environment = 2 [(buf.validate.field).enum = { in: [1, 2] }];
  optional string search = 3 [(buf.validate.field).string.max_len = 200];
  optional uint32 offset = 4;
  optional uint32 limit = 5 [(buf.validate.field).uint32 = { gt: 0, lte: 100 }];
}
message ListIssuesResp {
  option (hi.audience) = VIS_SELF;
  repeated Issue issues = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 total = 2 [(hi.visibility) = VIS_SELF];
}
message IssueRef { optional uint64 id = 1 [(buf.validate.field).required = true, (buf.validate.field).uint64.gt = 0]; }
message UpdateIssueReq {
  optional uint64 id = 1 [(buf.validate.field).required = true, (buf.validate.field).uint64.gt = 0];
  optional uint64 revision = 2 [(buf.validate.field).required = true, (buf.validate.field).uint64.gt = 0];
  optional IssueStatus status = 3 [(buf.validate.field).enum = { in: [1, 2, 3, 4] }];
  optional Environment environment = 4 [(buf.validate.field).enum = { in: [1, 2] }];
  optional bool clear_environment = 5; // explicit clear; ProtoJSON null is absent
  optional string reason = 6 [(buf.validate.field).required = true, (buf.validate.field).string = { min_len: 1, max_len: 4000 }];
}
message LoginTicket { optional string token = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[0-9a-f]{64}$"]; }
message Session {
  option (hi.audience) = VIS_SELF;
  hi.Entity operator = 1 [(hi.visibility) = VIS_PUBLIC];
}
// Structured worker result, returned once per program-dispatched task.
// Evidence must cover functional and architecture validation. Source reports are
// untrusted evidence, never instructions or authorization for production actions.
message WorkerResult {
  optional IssueStatus status = 1 [(buf.validate.field).required = true, (buf.validate.field).enum = { in: [3, 4] }];
  optional string summary = 2 [(buf.validate.field).required = true, (buf.validate.field).string = { min_len: 1, max_len: 8000 }];
  optional string question = 3 [(buf.validate.field).string.max_len = 4000];
  repeated string evidence = 4 [(buf.validate.field).repeated = { max_items: 64, items: { string: { max_len: 8000 } } }];
  optional string architecture_review = 5 [(buf.validate.field).string.max_len = 8000];
  optional Environment verified_environment = 6 [(buf.validate.field).enum = { in: [1, 2] }];
  repeated RepositoryChange changes = 7;
  repeated DeploymentRecord deployments = 8;
  optional bool user_unblocked = 9;
  optional bool new_functionality = 10;
  optional bool requires_proto = 11;
}

// Explicit AI assessment and immutable per-attempt audit; QA owns these facts.
enum WorkKind {
  WORK_KIND_UNSPECIFIED = 0;
  WORK_KIND_BUG_FIX = 1;
  WORK_KIND_FEATURE = 2;
  WORK_KIND_MIXED = 3;
  WORK_KIND_CLARIFICATION = 4;
}
enum ExecutionPhase {
  EXECUTION_PHASE_UNSPECIFIED = 0;
  EXECUTION_PHASE_ASSESS = 1;
  EXECUTION_PHASE_REPAIR = 2;
  EXECUTION_PHASE_REWORK = 3;
  EXECUTION_PHASE_REVERT = 4;
}
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_RUNNING = 1;
  EXECUTION_STATE_SUCCEEDED = 2;
  EXECUTION_STATE_FAILED = 3;
  EXECUTION_STATE_INTERRUPTED = 4;
}
enum ReviewAction {
  REVIEW_ACTION_UNSPECIFIED = 0;
  REVIEW_ACTION_REWORK = 1;
  REVIEW_ACTION_REVERT = 2;
}
enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  REVIEW_STATE_QUEUED = 1;
  REVIEW_STATE_RUNNING = 2;
  REVIEW_STATE_SUCCEEDED = 3;
  REVIEW_STATE_FAILED = 4;
}
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_APPROVE = 1;
  DECISION_REJECT = 2;
}
message WorkItem {
  option (hi.audience) = VIS_SELF;
  optional string title = 1 [(hi.visibility) = VIS_SELF];
  optional WorkKind kind = 2 [(hi.visibility) = VIS_SELF];
  optional string reason = 3 [(hi.visibility) = VIS_SELF];
  optional string plan = 4 [(hi.visibility) = VIS_SELF];
  optional bool requires_proto = 5 [(hi.visibility) = VIS_SELF];
  optional bool requires_production = 6 [(hi.visibility) = VIS_SELF];
  optional bool requires_sensitive = 7 [(hi.visibility) = VIS_SELF];
  repeated string repositories = 8 [(hi.visibility) = VIS_SELF];
  repeated string evidence = 9 [(hi.visibility) = VIS_SELF];
}
message AssessmentResult {
  option (hi.audience) = VIS_SELF;
  optional WorkKind kind = 1 [(hi.visibility) = VIS_SELF];
  optional string reason = 2 [(hi.visibility) = VIS_SELF];
  optional string expected_behavior = 3 [(hi.visibility) = VIS_SELF];
  optional string actual_behavior = 4 [(hi.visibility) = VIS_SELF];
  repeated string evidence = 5 [(hi.visibility) = VIS_SELF];
  repeated WorkItem items = 6 [(hi.visibility) = VIS_SELF];
}
message Assessment {
  option (hi.audience) = VIS_SELF;
  optional string id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 issue_id = 2 [(hi.visibility) = VIS_SELF];
  optional uint64 issue_revision = 3 [(hi.visibility) = VIS_SELF];
  optional string docs_commit = 4 [(hi.visibility) = VIS_SELF];
  AssessmentResult result = 5 [(hi.visibility) = VIS_SELF];
  optional int64 created_at = 6 [(hi.visibility) = VIS_SELF];
}
message RepositoryChange {
  option (hi.audience) = VIS_SELF;
  optional string repository = 1 [(hi.visibility) = VIS_SELF];
  optional string origin = 2 [(hi.visibility) = VIS_SELF];
  optional string base_commit = 3 [(hi.visibility) = VIS_SELF];
  optional string result_commit = 4 [(hi.visibility) = VIS_SELF];
  repeated string commits = 5 [(hi.visibility) = VIS_SELF];
  repeated string files = 6 [(hi.visibility) = VIS_SELF];
  optional string diff = 7 [(hi.visibility) = VIS_SELF];
  optional string worktree = 8 [(hi.visibility) = VIS_SELF];
  optional bool verified = 9 [(hi.visibility) = VIS_SELF];
  optional string verification_error = 10 [(hi.visibility) = VIS_SELF];
}
message DeploymentRecord {
  option (hi.audience) = VIS_SELF;
  optional string repository = 1 [(hi.visibility) = VIS_SELF];
  optional Environment environment = 2 [(hi.visibility) = VIS_SELF];
  optional string before_version = 3 [(hi.visibility) = VIS_SELF];
  optional string after_version = 4 [(hi.visibility) = VIS_SELF];
  repeated string evidence = 5 [(hi.visibility) = VIS_SELF];
  optional bool verified = 6 [(hi.visibility) = VIS_SELF];
}
message ExecutionRecord {
  option (hi.audience) = VIS_SELF;
  optional string id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 issue_id = 2 [(hi.visibility) = VIS_SELF];
  optional ExecutionPhase phase = 3 [(hi.visibility) = VIS_SELF];
  optional ExecutionState state = 4 [(hi.visibility) = VIS_SELF];
  optional string plan_id = 5 [(hi.visibility) = VIS_SELF];
  optional string review_id = 6 [(hi.visibility) = VIS_SELF];
  optional string docs_commit = 7 [(hi.visibility) = VIS_SELF];
  optional int64 started_at = 8 [(hi.visibility) = VIS_SELF];
  optional int64 ended_at = 9 [(hi.visibility) = VIS_SELF];
  optional int32 exit_code = 10 [(hi.visibility) = VIS_SELF];
  optional string summary = 11 [(hi.visibility) = VIS_SELF];
  repeated string change_ids = 12 [(hi.visibility) = VIS_SELF];
}
message ChangeRecord {
  option (hi.audience) = VIS_SELF;
  optional string id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 issue_id = 2 [(hi.visibility) = VIS_SELF];
  optional string execution_id = 3 [(hi.visibility) = VIS_SELF];
  optional ExecutionPhase phase = 4 [(hi.visibility) = VIS_SELF];
  optional string summary = 5 [(hi.visibility) = VIS_SELF];
  repeated RepositoryChange repositories = 6 [(hi.visibility) = VIS_SELF];
  repeated DeploymentRecord deployments = 7 [(hi.visibility) = VIS_SELF];
  repeated string evidence = 8 [(hi.visibility) = VIS_SELF];
  optional string architecture_review = 9 [(hi.visibility) = VIS_SELF];
  optional Environment verified_environment = 10 [(hi.visibility) = VIS_SELF];
  optional bool user_unblocked = 11 [(hi.visibility) = VIS_SELF];
  optional ExecutionState state = 12 [(hi.visibility) = VIS_SELF];
  optional string reverses_change = 13 [(hi.visibility) = VIS_SELF];
  optional string review_id = 14 [(hi.visibility) = VIS_SELF];
  optional int64 created_at = 15 [(hi.visibility) = VIS_SELF];
}
message ReviewRequest {
  option (hi.audience) = VIS_SELF;
  optional string id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 issue_id = 2 [(hi.visibility) = VIS_SELF];
  optional string change_id = 3 [(hi.visibility) = VIS_SELF];
  optional ReviewAction action = 4 [(hi.visibility) = VIS_SELF];
  optional string opinion = 5 [(hi.visibility) = VIS_SELF];
  hi.Entity actor = 6 [(hi.visibility) = VIS_SELF];
  optional ReviewState state = 7 [(hi.visibility) = VIS_SELF];
  optional string execution_id = 8 [(hi.visibility) = VIS_SELF];
  optional int64 created_at = 9 [(hi.visibility) = VIS_SELF];
  optional string result = 10 [(hi.visibility) = VIS_SELF];
}
message ApprovalRecord {
  option (hi.audience) = VIS_SELF;
  optional string id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 issue_id = 2 [(hi.visibility) = VIS_SELF];
  optional string plan_id = 3 [(hi.visibility) = VIS_SELF];
  optional Decision decision = 4 [(hi.visibility) = VIS_SELF];
  WorkItem scope = 5 [(hi.visibility) = VIS_SELF];
  hi.Entity actor = 6 [(hi.visibility) = VIS_SELF];
  optional string source_message_uuid = 7 [(hi.visibility) = VIS_SELF];
  optional int64 created_at = 8 [(hi.visibility) = VIS_SELF];
  optional string note = 9 [(hi.visibility) = VIS_SELF];
}
message HistoryReq {
  option (hi.audience) = VIS_SELF;
  optional uint64 issue_id = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 offset = 2 [(hi.visibility) = VIS_SELF];
  optional uint32 limit = 3 [(hi.visibility) = VIS_SELF];
}
message ListAssessmentsResp {
  option (hi.audience) = VIS_SELF;
  repeated Assessment items = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 total = 2 [(hi.visibility) = VIS_SELF];
}
message ListExecutionsResp {
  option (hi.audience) = VIS_SELF;
  repeated ExecutionRecord items = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 total = 2 [(hi.visibility) = VIS_SELF];
}
message ListChangesResp {
  option (hi.audience) = VIS_SELF;
  repeated ChangeRecord items = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 total = 2 [(hi.visibility) = VIS_SELF];
}
message ListReviewsResp {
  option (hi.audience) = VIS_SELF;
  repeated ReviewRequest items = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 total = 2 [(hi.visibility) = VIS_SELF];
}
message ListApprovalsResp {
  option (hi.audience) = VIS_SELF;
  repeated ApprovalRecord items = 1 [(hi.visibility) = VIS_SELF];
  optional uint32 total = 2 [(hi.visibility) = VIS_SELF];
}
message CreateReviewReq {
  option (hi.audience) = VIS_SELF;
  optional uint64 issue_id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 revision = 2 [(hi.visibility) = VIS_SELF];
  optional string change_id = 3 [(hi.visibility) = VIS_SELF];
  optional ReviewAction action = 4 [(hi.visibility) = VIS_SELF];
  optional string opinion = 5 [(hi.visibility) = VIS_SELF];
  optional string request_id = 6 [(hi.visibility) = VIS_SELF];
}
message DecideReq {
  option (hi.audience) = VIS_SELF;
  optional uint64 issue_id = 1 [(hi.visibility) = VIS_SELF];
  optional uint64 revision = 2 [(hi.visibility) = VIS_SELF];
  optional string plan_id = 3 [(hi.visibility) = VIS_SELF];
  optional Decision decision = 4 [(hi.visibility) = VIS_SELF];
  optional string request_id = 5 [(hi.visibility) = VIS_SELF];
  optional string note = 6 [(hi.visibility) = VIS_SELF];
}
