syntax = "proto3";
package hi;
option go_package = "github.com/HiWorld-56/hi-proto/go/hi";
import "hi/options.proto";
import "buf/validate/validate.proto";

// 音频载荷与采集、合成及播放会话独立；位置/长度按每声道样本计，不采用网络到达间隔。
message AudioFormat {
  option (hi.audience) = VIS_SELF;
  enum Encoding {
    ENCODING_UNKNOWN = 0;
    ENCODING_PCM_S16LE = 1;
  }
  optional Encoding encoding = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true, (buf.validate.field).enum.not_in = 0];
  optional uint32 sample_rate = 2 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).uint32.gte = 8000, (buf.validate.field).uint32.lte = 96000];
  optional uint32 channels = 3 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).uint32.gte = 1, (buf.validate.field).uint32.lte = 2];
}
message AudioStreamStart {
  option (hi.audience) = VIS_SELF;
  AudioFormat format = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
}
message AudioStreamChunk {
  option (hi.audience) = VIS_SELF;
  optional uint64 sequence = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
  optional uint64 sample_offset = 2 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
  optional bytes pcm = 3 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).bytes.min_len = 1, (buf.validate.field).bytes.max_len = 65536];
}
message AudioStreamEnd {
  option (hi.audience) = VIS_SELF;
  optional uint64 total_samples = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).uint64.gt = 0];
}
// start -> chunk* -> end；end仅表示采集/生成完成，不表示声卡播完。
// 服务端异常通过gRPC status终止，无end/异常终止均不能视为完整音频。
message AudioStreamEvent {
  option (hi.audience) = VIS_SELF;
  optional string stream_id = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).string.min_len = 1, (buf.validate.field).string.max_len = 128];
  oneof event {
    option (buf.validate.oneof).required = true;
    AudioStreamStart start = 2 [(hi.visibility) = VIS_SELF];
    AudioStreamChunk chunk = 3 [(hi.visibility) = VIS_SELF];
    AudioStreamEnd end = 4 [(hi.visibility) = VIS_SELF];
  }
}

// Device output compatibility only; independent of content playback and microphone policy.
enum AudioKeepAwakeMode {
  AUDIO_KEEP_AWAKE_INHERIT = 0;
  AUDIO_KEEP_AWAKE_ENABLED = 1;
  AUDIO_KEEP_AWAKE_DISABLED = 2;
}
enum AudioKeepAwakeSource {
  AUDIO_KEEP_AWAKE_SOURCE_UNKNOWN = 0;
  AUDIO_KEEP_AWAKE_SOURCE_GLOBAL = 1;
  AUDIO_KEEP_AWAKE_SOURCE_NODE = 2;
  AUDIO_KEEP_AWAKE_SOURCE_OVERRIDE = 3;
}
message AudioKeepAwakePolicy {
  option (hi.audience) = VIS_SELF;
  optional uint64 default_revision = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).uint64.gt = 0];
  optional uint64 device_revision = 2 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
  optional bool default_enabled = 3 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
  optional AudioKeepAwakeMode mode = 4 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
}
// Versions identify the attempted policy. applied=false reports failure, never confirmation.
// enabled/source describe the actual source after the attempt; absent means unknown.
message AudioKeepAwakeState {
  option (hi.audience) = VIS_SELF;
  optional bool applied = 1 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
  optional bool enabled = 2 [(hi.visibility) = VIS_SELF];
  optional AudioKeepAwakeSource source = 3 [(hi.visibility) = VIS_SELF, (buf.validate.field).enum.defined_only = true];
  optional uint64 default_revision = 4 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true, (buf.validate.field).uint64.gt = 0];
  optional uint64 device_revision = 5 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
  optional string error = 6 [(hi.visibility) = VIS_SELF, (buf.validate.field).string.max_len = 512];
  optional uint32 frequency_hz = 7 [(hi.visibility) = VIS_SELF, (buf.validate.field).uint32.gte = 10, (buf.validate.field).uint32.lte = 30];
  optional float level_dbfs = 8 [(hi.visibility) = VIS_SELF, (buf.validate.field).float.gte = -80, (buf.validate.field).float.lte = -40];
}
