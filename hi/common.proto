syntax = "proto3";

package hi;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi";

import "hi/options.proto";

message SignedData {
  bytes data = 1;
  string signature = 2;
}

message DID {
  option (hi.audience) = VIS_PUBLIC; // did 是公开身份标识
  string id = 1 [(hi.visibility) = VIS_PUBLIC];
}

/*
  Entity 是"可寻址节点"的公开门面(did/code + 名字 + 头像 + 类型)。
  type: 实体类型(字符串,便于扩展 —— 新增类型只需在此登记一行)
     人型(好友列表)
       user       人
       robot      硬件机器人(有 DID、具身、行为同用户)
       assistant  软件机器人(对话由后端接管,无私钥、不在 mqtt 上)
       注:硬件机器人用 robot 而非 agent —— agent 已是 ai 的 AI 机器人子系统统称(hi.ai.Agent),避免撞词。
     会话型(会话列表)
       group      群聊
       single     单聊
*/
message Entity {
  option (hi.audience) = VIS_PUBLIC; // 身份门面:名字/头像等,全公开
  string type = 1 [(hi.visibility) = VIS_PUBLIC];
  string did    = 2 [(hi.visibility) = VIS_PUBLIC];
  string name   = 3 [(hi.visibility) = VIS_PUBLIC];
  string avatar = 4 [(hi.visibility) = VIS_PUBLIC];
  int64  update = 5 [(hi.visibility) = VIS_PUBLIC];
}

message MqttCredentials {
  option (hi.audience) = VIS_SELF; // 连接凭证(含 password),只发给本人
  string id       = 1 [(hi.visibility) = VIS_SELF];
  string username = 2 [(hi.visibility) = VIS_SELF];
  string password = 3 [(hi.visibility) = VIS_SELF];
}

message AuthToken {
  option (hi.audience) = VIS_SELF; // 会话/刷新令牌,只发给本人
  string token         = 1 [(hi.visibility) = VIS_SELF];
  string refresh_token = 2 [(hi.visibility) = VIS_SELF];
}

message Nonce {
  string nonce = 1;
}

message RequestId {
  option (hi.audience) = VIS_PUBLIC; // 请求 id,无隐私
  string id = 1 [(hi.visibility) = VIS_PUBLIC];
}

message State {
  bool state = 1;
}

message Number {
  int64 n = 1;
}

message ClientInfo {
  string app = 1; // HiDID、HiAI、HiClub、Third
  string dev = 2; // web、app、pc、embeded
  string mac = 3; // Null / Mac or Static UUID (Preventing being kicked off)
}

message Pagination {
  int32 page = 1;
  int32 limit = 2;
}

// 服务自身版本/环境(所有 Base 服务共用;各服务实现返回自己的 bin 版本与探测到的环境)。
message ServerVersionResp {
  option (hi.audience) = VIS_PUBLIC; // 服务版本+环境,Base.ServerVersion 全 AUTH_NONE 公开
  string version = 1 [(hi.visibility) = VIS_PUBLIC]; // bin 版本(git tag 注入)
  string env = 2 [(hi.visibility) = VIS_PUBLIC]; // 运行环境:dev/prod(echo 探测得出)
}
