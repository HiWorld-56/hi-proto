syntax = "proto3";

package hi.ninja;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ninja";

// hinj_brain 与它的各个子模块之间的**共用约定**。
//
// ## 传输
//
// ZMQ ROUTER（brain 侧）/ DEALER（模块侧），payload 是各模块自己那个 `.proto`
// 定义的 protobuf 二进制单帧。
//
// 传输地址：产品上所有模块都在同一台机器，走 `ipc:///tmp/hinj.sock`；
// 调试时（`--cfg hirpi`）走 `tcp://0.0.0.0:1568`，因为开发服务器上跑不了 face。
//
// ## 注册
//
// 模块连上时发一次**裸字节** `"PING"`（握手），brain 回 `"PONG"`、把这个模块的
// ZMQ identity 加进在线集合并发 Online —— 不进集合，brain 就没法向它发消息。
// 之后每 10 秒发一次裸字节 `"HEARTBEAT"`（心跳），brain 也回 `"PONG"`、只把时间戳往前推，**不发 Online**；
// brain 重启过、认不出这个模块时，心跳按握手处理。模块靠「多久没听到 PONG」判断 brain 死没死。
// （握手与心跳从前是同一个 PING，于是每 10 秒一次 Online → face 每 10 秒重推一遍全量初始化；已分开。）
//
// ## 一个模块一个文件
//
// `ui.proto`（face）、`lua.proto`（lua 执行器）、`updater.proto`（OTA 更新）……
// **判据是「谁跟谁说话」，不是「聊什么」。**
// 混在一个文件里的后果是：加一个模块就要在一堆无关消息中间找地方插，
// 而 `oneof` 的字段号是全局的，谁都可能撞。

// ModuleId 各子模块的 ZMQ identity。**这就是注册时用的那个身份**。
//
// ⚠️ 值必须与模块自己 DEALER socket 上设的 identity 逐字一致 ——
// 对不上的表现是 brain 说"这个模块不在线"，而模块那侧一切正常。
enum ModuleId {
  MODULE_UNKNOWN = 0;
  MODULE_UI      = 1; // hinj_ui（face）
  MODULE_LUA     = 2; // lua 执行器
  MODULE_UPDATER = 3; // hinj_updater（OTA 更新，systemd 直接拉起的独立进程）
}
