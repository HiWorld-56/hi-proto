syntax = "proto3";

package hi.ninja;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ninja";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/club/group.proto";
import "hi/club/messaging.proto";
import "hi/ai/plugin.proto";
import "hi/binance/binance.proto";
import "hi/did/transfer.proto";
import "hi/ninja/updater.proto";

// **hinj_brain ←→ hinj_ui（face）** 这一条线。
//
// 传输与注册那套约定是**所有模块共用的**，写在 `hi/ninja/common.proto` 里，
// 不要在各模块的文件里各抄一份。
//
// ⚠️ 本文件按「谁跟谁说话」划分，不按话题。所以 `PluginProgress` 在这儿 ——
// 它讲的是插件，但它是**给脸上显示的**；插件本身的执行走 `hi/ninja/lua.proto`。

// 二态开关：语音监听开始/结束、音频播放开始/结束等
enum StateToggle {
  STATE_UNKNOWN = 0;
  STATE_START   = 1;
  STATE_END     = 2;
}

// 机器人情绪表达
enum Emotion {
  EMOTION_UNKNOWN   = 0;
  EMOTION_ANGER     = 1;
  EMOTION_LAUGH     = 2;
  EMOTION_FRUSTRATE = 3;
}

// 机器人初始化：自身身份 + 当前所有者
// master 缺省表示尚未绑定所有者
message RobotInit {
  hi.Entity robot  = 1;
  hi.Entity master = 2;
}

// 好友列表（全量，初始化时推送）
message FriendList {
  repeated hi.Entity list = 1;
}

// 群成员列表（全量，初始化时批量推送）
message GroupInfoList {
  repeated hi.club.GroupInfo list = 1;
}

// 所有者变更事件
// trigger: bind（新绑定）/ unbind（解绑，此时 master 缺省）/ update（资料更新，绑定关系不变）
message MasterEvent {
  hi.Entity       master  = 1;
  // 触发源:
  //   bind    绑定了主人(master = 新主人)
  //   unbind  解绑(master 不传)
  //   update  **主人还是那个人,但他改了资料**(master = 主人当前完整的 Entity)
  // ⚠️ update 这档别按 did 判重 —— did 没变正是它的常态,变的是 name/avatar。
  optional string trigger = 2;
}

// AI 文字回复
// uuid 由 brain 在本次对话开始时生成，通过 show_im_request（覆写 Message.uuid）
// 和 show_im_reply / show_voice_reply 两端传递，face 据此将回复路由到对应的对话框。
// value 为 AI 输出的纯文本，不封装为 Message 结构。
message TextReply {
  optional string uuid  = 1;
  optional string value = 2;
}

// TTS 音频播放
// uuid 与对应的 TextReply.uuid 一致，audio 为完整音频文件的原始字节。
message AudioPlay {
  optional string uuid  = 1;
  optional bytes  audio = 2;
}

// 币安接入设置。**密钥不在这里** —— 2026-09-20 起密钥一个字都不出 brain：
// face 不再自己连币安，要数据就发 `BinanceRequest`（见下），brain 替它去。
//
// 于是这条只剩一件事：告诉 face「这台机器人配过币安没有」以及算收益用的基数。
// **收得到这条 = 配过**（没配过 brain 根本不推），face 据此决定显不显示资产面板。
message BinanceSettings {
  // 初始本金。**十进制字符串**，与本仓所有金额字段同口径（免浮点误差）。
  optional string initial_capital = 2;
}

// face -> brain：替我去币安做一次。
//
// ⭐ **机器人到币安只有一条路**，就是 brain 的币安模块（`src/binance/`）。
// face 从前自己签名直连桥，于是同一件事有两条路径：密钥要多存一份、
// 缓存各缓各的、而币安的权重是**按出口 IP** 算的（全网机器人共用桥那一个出口），
// 两条路各查各的等于把配额打两遍。2026-09-20 把 face 那条删了。
//
// 参数为什么是 JSON 字符串：brain 的操作表本来就按 JSON 收参数并**在那里校验**
// （不合法当场拒，还会在报错里给出正确写法）。再定义一遍 proto 参数就是第二套判据。
message BinanceRequest {
  optional string id          = 1; // face 给的流水号，brain 原样带回 `BinanceResult.request`
  optional string op          = 2; // 操作名，如 `usds_futures.account_information_v3`
  optional string params_json = 3; // 参数，一个 JSON 对象；不传 = 没有参数
}

// brain -> face：所有指令通过 oneof 路由
message BrainToFace {
  oneof cmd {
    // 初始化
    RobotInit             init_robot             = 1;  // face 上线时推送，携带机器人和所有者身份

    // 交互状态
    StateToggle           show_listen            = 2;  // 语音监听开始/结束
    Emotion               show_emotion           = 3;  // 情绪表达

    // 对话内容
    hi.club.Message       show_im_request        = 4;  // 收到 IM 消息（单聊/所有者/群聊）
    TextReply             show_im_reply          = 5;  // IM 对话的 AI 回复
    TextReply             show_voice_reply       = 6;  // 语音对话的 AI 回复
    google.protobuf.Empty show_qr_code           = 7;  // 展示机器人 DID 二维码

    // 状态事件
    hi.Entity             event_robot            = 8;  // 机器人自身资料变更
    MasterEvent           event_master           = 9;  // 所有者绑定状态变化
    hi.club.GroupInfo     event_members          = 10; // 群成员列表（全量）
    hi.ai.PluginView      event_plugin           = 11; // 插件加载完成
    PluginProgress        event_plugin_progress  = 20; // 插件下载/安装进度
    hi.did.Transaction    event_transaction      = 12; // 收到转账

    // 媒体：uuid="" 时路由到 dialog_voice，否则按 uuid 路由到对应 IM dialog
    AudioPlay             play_audio             = 13; // TTS 音频播放

    // 好友变更
    FriendList            event_friends          = 15; // 好友列表全量推送（初始化时）
    hi.Entity             event_friend_delete    = 14; // 被对方删除好友，face 从单聊列表移除该成员
    hi.Entity             event_friend_add       = 16; // 新增好友，face 将其加入单聊成员列表

    // 群成员初始化（全量批量，初始化时推送）
    GroupInfoList         members_init           = 17;

    // 系统状态：NTP 时间同步 + 网络连通性（face 上线推送 + 状态变化时推送）
    StatusEvent           event_status           = 18;
    // 固件 OTA 更新的状态。**brain 原样转发 updater 的那份**，不自己攒、不自己改；
    // 定义在 `hi/ninja/updater.proto`（那条线的契约在那儿）。
    UpdateStatus          event_update           = 19;

    // 币安设置同步（**只有初始本金，没有密钥**；仅限本地 face IPC）
    BinanceSettings       event_binance_settings = 21;
    // 币安结果。**与通知那条路回给代理的是同一个消息** —— 同一张操作表、
    // 同一份账户快照，face 不该为"看板"再学一套形状。`request` 是 face 给的流水号。
    hi.binance.BinanceResult binance_result      = 22;
    // **插件没初始化好**(它的 install 跑失败了)。face 照现有警告的样子弹一张卡,
    // 上面带「重试」—— 点了回 `plugin_init_retry`。
    //
    // 为什么要人来点:失败的原因往往在机器人**够不着**的地方(代理的群还没开、
    // 还没绑主人),自动重试多少次都一样;而人知道"什么时候可以再试了"。
    PluginInitFailed      event_plugin_init_failed = 23;

  }
}

// 插件的初始化(install)没成。
//
// ⚠️ **这不是"插件坏了"** —— 插件装好了、方法照常可用,只是它的准备工作没做完
// (典型:交易类插件要加进代理的管理群,而群满了、代理还没开新群)。
// 所以 brain 不会因此卸载它,也不上报后台;要做的只有一件:**让人看见并能重试**。
message PluginInitFailed {
  optional string uuid    = 1; // 插件挂牌 uuid。重试时原样带回来
  optional string name    = 2; // 插件名(给人看的)
  optional string message = 3; // 失败原因,**插件自己给的那句人话**(别在 face 上另编一句)
}

// 人点了「重试」。
message PluginInitRetry {
  optional string uuid = 1; // 要重来的那个插件(来自 PluginInitFailed.uuid)
}

// 系统状态快照
// ntp:  系统时间已同步（时间戳 > 1_750_000_000，即 2025-06 之后）
// wifi: 服务器 TCP 443 可达
message StatusEvent {
  optional bool ntp  = 1;
  optional bool wifi = 2;
  optional bool usb  = 3;
}
// face -> brain
message FaceToBrain {
  oneof cmd {
    StateToggle           voice_state          = 1; // 音频播放开始/结束，brain 据此控制麦克风静音
    // 固件更新：人在 face 上点的那一下（查/装/不看了）。
    UpdateAction          update_action        = 2;
    // face 重启后内存缓存是空的，用它主动要一次（本文件里空请求一律用 Empty，见 show_qr_code）
    google.protobuf.Empty get_binance_settings = 3;
    // 🔴 **模块就绪了，请把初始化数据推给我。** brain 收到才推 RobotInit + 全量关系列表。
    //
    // 为什么由模块主动要，而不是 brain 在「看到它上线」时自己推：
    // **brain 不知道模块准备好了没有。** 上线只说明它的连接建起来了；
    // 而模块可能还在起自己的界面/缓存，这时候推过去的数据它接不住，
    // 而 brain 那侧一切正常 —— 又是一次零报错的丢数据。
    //
    // ⚠️ 这条也是**重连后的恢复口**：brain 重启过、或模块自己重启过，
    // 都由模块在准备好之后再要一次，不必让 brain 去猜「这次是新上来的还是一直都在」。
    google.protobuf.Empty request_init          = 4;
    // 替我去币安做一次（face 自己不连币安，见 BinanceRequest 的说明）
    BinanceRequest        binance_request       = 5;
    // 人在那张「插件没初始化好」的卡上点了重试
    PluginInitRetry       plugin_init_retry     = 6;
  }
}
// 插件下载/安装进度。
//
// NATIVE 插件是**云端交叉编译好的 .so,机器人自己去取** —— 几百 KB 到几 MB,
// 机器人的网可能很差。没有进度的话,用户在市场点了"购买"之后,face 上什么都不会变,
// 直到某一刻插件突然出现;中间那段沉默里,用户只会以为没买成、然后再点一次。
//
// 字段有意与固件更新(`updater.proto` 的 `UpdateStatus`)同形:state / progress / 已下/共多少字节。
// **face 那边不该为"插件"和"固件"学两套进度模型。**
message PluginProgress {
  enum State {
    STATE_UNKNOWN     = 0;
    STATE_DOWNLOADING = 1; // 正在下载
    STATE_INSTALLING  = 2; // 已下完,正在落盘/加载
    STATE_DONE        = 3; // 装好了(已热加载,可以用了)
    STATE_FAILED      = 4; // 这一个失败了 —— **不影响其它插件**
  }
  optional string uuid             = 1;
  optional string title            = 2; // 给用户看的名字;取不到就退回 uuid
  optional State  state            = 3;
  // 0-100。**总长度未知时恒为 0** —— 服务端不给 Content-Length 是有可能的,
  // 那时候宁可不显示百分比,也别编一个会往回跳的数字。
  optional uint32 progress         = 4;
  optional uint64 downloaded_bytes = 5;
  optional uint64 total_bytes      = 6; // **不传 = 未知**(服务端没给 Content-Length);0 是真实取值:空文件
  optional string message          = 7; // 失败原因(state=FAILED 时)
}

// 固件更新：人在 face 上点的那一下。
//
// brain 收到之后转成 `hi/ninja/updater.proto` 的 `BrainToUpdater` 发给 updater；
// **做不做得成由 updater 说了算**，结果照常从 `event_update` 回到 face。
message UpdateAction {
  enum Action {
    ACTION_UNKNOWN = 0;
    // 现在去查有没有新版。→ `Check{trigger: TRIGGER_MANUAL}`
    ACTION_CHECK   = 1;
    // 装。**不可逆**：updater 会停 face 和 brain，face 上的进度到此为止
    // （装完两边都是新起的进程，face 重新 request_init 时会拿到新的状态）。
    ACTION_APPLY   = 2;
    // 不看了。**这一条不发给 updater** —— 它是 brain 自己的事：
    // 把缓着的那份状态丢掉，免得 face 每次 `request_init` 又被推一遍同一个提示。
    // 下次 updater 再推状态（轮询/广播/开机查到新版）照常显示。
    ACTION_DISMISS = 3;
  }

  optional Action action = 1;
}

