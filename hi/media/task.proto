syntax = "proto3";

package hi.media;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

// 任务用途；普通任务和管理试跑共用执行链路。
enum TaskPurpose {
  TASK_PURPOSE_UNSPECIFIED = 0;
  TASK_PURPOSE_NORMAL = 1;
  TASK_PURPOSE_WORKFLOW_TEST = 2;
}

// 用户可见任务状态；内部提交与核对细节使用 status_message 说明。
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  // 等待 FIFO 派发。
  TASK_STATUS_PENDING = 1;
  // 覆盖提交、排队、状态核对和 ComfyUI 执行过程，具体文案见 status_message。
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SAVING = 3;
  TASK_STATUS_CANCELLING = 4;
  TASK_STATUS_SUCCESS = 5;
  // 上游失败、执行超时、输出无效或保存失败都归入 FAILED，由 error_code 区分。
  TASK_STATUS_FAILED = 6;
  TASK_STATUS_CANCELLED = 7;
}

// 资产媒体类型。
enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
}

// 视频分辨率选择，不传某项时使用工作流该项默认值。
message VideoResolution {
  // ResolutionSelector 的完整选项字符串，例如 "16:9 (Widescreen)"，不能只传 "16:9"。
  optional string aspect_ratio = 1 [(buf.validate.field).string.min_len = 1];
  // 十进制字符串，例如 "0.9" 或 "0.98"；客户端不得转为浮点后重新格式化。
  optional string megapixels = 2 [(buf.validate.field).string.min_len = 1];
}

// 创建图生视频任务；工作流必须属于 video.img2vid，图片为本人可用的 JPEG/PNG 资产。
message CreateImageToVideoTaskReq {
  // 本人范围内的幂等键；同一次操作重发复用，新操作使用新值。
  optional string request_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  // 来自对应功能的 Function.Get；服务端验证工作流已启用且属于本 RPC 的功能。
  optional string workflow_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  optional string input_asset_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  optional string prompt = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  // 宽高比和像素量各自独立补齐；不传时使用工作流默认值。
  VideoResolution resolution = 5;
  // 整数秒；不传时使用工作流默认时长。
  optional int32 duration_seconds = 6 [(buf.validate.field).int32.gt = 0];
  // 帧/秒；不传时使用默认或固定值；固定模式显式提交时必须与固定值相同。
  optional int32 frame_rate = 7 [(buf.validate.field).int32.gt = 0];
}

// 创建文生视频任务；工作流必须属于 video.txt2vid，不接受输入图片。
message CreateTextToVideoTaskReq {
  // 本人范围内的幂等键；同一次操作重发复用，新操作使用新值。
  optional string request_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  // 来自对应功能的 Function.Get；服务端验证工作流已启用且属于本 RPC 的功能。
  optional string workflow_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  optional string prompt = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  // 宽高比和像素量各自独立补齐；不传时使用工作流默认值。
  VideoResolution resolution = 4;
  // 整数秒；不传时使用工作流默认时长。
  optional int32 duration_seconds = 5 [(buf.validate.field).int32.gt = 0];
  // 帧/秒；不传时使用默认或固定值；固定模式显式提交时必须与固定值相同。
  optional int32 frame_rate = 6 [(buf.validate.field).int32.gt = 0];
}

// 返回已受理任务的 ID；同一 request_id 重发返回原任务，不比较重发参数。
message CreateTaskResp {
  option (hi.audience) = VIS_SELF;
  // 成功响应必有；响应字段不使用 buf.validate 约束。
  optional string task_id = 1 [(hi.visibility) = VIS_SELF];
}

// 图生视频实际参数，包含创建时补齐的默认值或固定值。
message ImageToVideoTaskParams {
  option (hi.audience) = VIS_SELF;
  optional string input_asset_id = 1 [(hi.visibility) = VIS_SELF];
  optional string prompt = 2 [(hi.visibility) = VIS_SELF];
  optional string aspect_ratio = 3 [(hi.visibility) = VIS_SELF];
  optional string megapixels = 4 [(hi.visibility) = VIS_SELF];
  // 创建时确定的实际时长，单位为整数秒。
  optional int32 duration_seconds = 5 [(hi.visibility) = VIS_SELF];
  // 创建时确定的实际帧率，单位为帧/秒。
  optional int32 frame_rate = 6 [(hi.visibility) = VIS_SELF];
}

// 文生视频实际参数，包含创建时补齐的默认值或固定值。
message TextToVideoTaskParams {
  option (hi.audience) = VIS_SELF;
  optional string prompt = 1 [(hi.visibility) = VIS_SELF];
  optional string aspect_ratio = 2 [(hi.visibility) = VIS_SELF];
  optional string megapixels = 3 [(hi.visibility) = VIS_SELF];
  // 创建时确定的实际时长，单位为整数秒。
  optional int32 duration_seconds = 4 [(hi.visibility) = VIS_SELF];
  // 创建时确定的实际帧率，单位为帧/秒。
  optional int32 frame_rate = 5 [(hi.visibility) = VIS_SELF];
}

// 唯一主产物；size_bytes 为字节，duration_ms 为毫秒，访问地址通过 File.GetAccessUrls 获取。
// Task.List 的 tasks[].output 与 Task.Get 的 task.summary.output 共用此结构。
// 实际宽高直接供前端布局使用，无需逐条查询详情或加载视频；尚无产物时不提供宽高。
message TaskOutput {
  option (hi.audience) = VIS_SELF;
  optional string asset_id = 1 [(hi.visibility) = VIS_SELF];
  optional string filename = 2 [(hi.visibility) = VIS_SELF];
  optional MediaType media_type = 3 [(hi.visibility) = VIS_SELF];
  optional string mime_type = 4 [(hi.visibility) = VIS_SELF];
  optional uint64 size_bytes = 5 [(hi.visibility) = VIS_SELF];
  optional int64 duration_ms = 6 [(hi.visibility) = VIS_SELF];
  // 资产删除后任务仍可保持成功，但该值为 false 且不能播放。
  optional bool available = 7 [(hi.visibility) = VIS_SELF];
  // 实际产物宽度，单位像素；读取已保存的视频探测结果，不根据生成参数推算。
  optional uint32 width = 8 [(hi.visibility) = VIS_SELF];
  // 实际产物高度，单位像素；与 width 一同返回，查询时不重新探测视频。
  optional uint32 height = 9 [(hi.visibility) = VIS_SELF];
}

// 任务摘要，不暴露模型真实名、工作流对象键或上游 prompt_id。
message TaskSummary {
  option (hi.audience) = VIS_SELF;
  optional string task_id = 1 [(hi.visibility) = VIS_SELF];
  optional TaskPurpose purpose = 2 [(hi.visibility) = VIS_SELF];
  // 任务受理时确定的功能 ID：video.img2vid 或 video.txt2vid。
  optional string function_id = 3 [(hi.visibility) = VIS_SELF];
  // 从当前功能记录读取的用户可见名称。
  optional string function_display_name = 4 [(hi.visibility) = VIS_SELF];
  optional string model_id = 5 [(hi.visibility) = VIS_SELF];
  // 从当前模型记录读取，不是 ComfyUI 真实文件名。
  optional string model_display_name = 6 [(hi.visibility) = VIS_SELF];
  // 任务受理时选择的工作流；不返回对象键或完整工作流图。
  optional string workflow_id = 7 [(hi.visibility) = VIS_SELF];
  optional TaskStatus status = 8 [(hi.visibility) = VIS_SELF];
  // 面向用户的脱敏状态说明；前端应优先展示该字段。
  optional string status_message = 9 [(hi.visibility) = VIS_SELF];
  // 稳定异步错误码：QUEUE_TIMEOUT、WORKFLOW_FILE_NOT_FOUND、WORKFLOW_FILE_UNAVAILABLE、
  // WORKFLOW_FILE_INVALID、INPUT_UPLOAD_FAILED、UPSTREAM_SUBMISSION_FAILED、
  // UPSTREAM_SUBMISSION_UNKNOWN、UPSTREAM_EXECUTION_FAILED、EXECUTION_TIMEOUT、
  // OUTPUT_INVALID、OUTPUT_SAVE_FAILED、OUTPUT_SAVE_UNCERTAIN、SAVE_RECOVERY_FAILED。
  optional string error_code = 10 [(hi.visibility) = VIS_SELF];
  // 仅在任务已经产生主资产时存在。
  TaskOutput output = 11 [(hi.visibility) = VIS_SELF];
  optional bool can_cancel = 12 [(hi.visibility) = VIS_SELF];
  // 前端只能依据该字段决定是否显示唯一一次“恢复保存”入口。
  optional bool can_recover_save = 13 [(hi.visibility) = VIS_SELF];
  // Unix 秒；首次可恢复保存失败时确定的截止时间，达到该时刻后不可恢复。
  optional int64 save_recovery_expires_at = 14 [(hi.visibility) = VIS_SELF];
  // Unix 秒；恢复保存不会改写 created_at 或 started_at。
  optional int64 created_at = 15 [(hi.visibility) = VIS_SELF];
  // Unix 秒；首次确认 ComfyUI 真正开始执行时写入，提交和排队期间不写入。
  optional int64 started_at = 16 [(hi.visibility) = VIS_SELF];
  // Unix 秒；恢复受理时清空，恢复得到最终结果时重新写入。
  optional int64 completed_at = 17 [(hi.visibility) = VIS_SELF];
  // 从 created_at 到当前时间或 completed_at 的墙钟秒数。
  optional int64 elapsed_seconds = 18 [(hi.visibility) = VIS_SELF];
  // 图生视频的原始输入图片资产 ID，列表和详情摘要均返回；文生视频不返回。
  // 前端通过 File.GetAccessUrls 申请 PREVIEW 地址作为视频封面，不是视频 output.asset_id。
  // 原图删除后仍保留该历史 ID；无法获取预览时显示占位图，不延长原图保留期。
  optional string input_asset_id = 19 [(hi.visibility) = VIS_SELF];
  // 创建任务时保存的实际业务参数 JSON 字符串，包含已补齐的默认值或固定值。
  // 列表、详情摘要和管理试跑列表均返回，不随工作流配置修改而变化。
  // HTTP 字段为 effectiveParamsJson；解析字符串后，内部键使用 snake_case：
  // prompt、aspect_ratio、megapixels（字符串）、duration_seconds、frame_rate（整数），
  // 图生视频另含 input_asset_id；不包含工作流图、节点绑定或管理员负向提示词。
  optional string effective_params_json = 20 [(hi.visibility) = VIS_SELF];
}

// 任务详情及其实际业务参数；重新生成需重新查询 Function.Get 并使用新 request_id。
message TaskDetail {
  option (hi.audience) = VIS_SELF;
  TaskSummary summary = 1 [(hi.visibility) = VIS_SELF];
  oneof effective_params {
    ImageToVideoTaskParams image_to_video = 2 [(hi.visibility) = VIS_SELF];
    TextToVideoTaskParams text_to_video = 3 [(hi.visibility) = VIS_SELF];
  }
}

// 查询本人任务。
message GetTaskReq {
  optional string task_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

// 返回本人任务详情。
message GetTaskResp {
  option (hi.audience) = VIS_SELF;
  TaskDetail task = 1 [(hi.visibility) = VIS_SELF];
}

// 分页查询本人任务，可按功能与状态过滤。
message ListTasksReq {
  hi.Pagination pagination = 1;
  // 不传表示不过滤；传入 Function.List 返回的功能 ID。
  optional string function_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated TaskStatus statuses = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

// 返回符合条件的任务总数和当前分页。
message ListTasksResp {
  option (hi.audience) = VIS_SELF;
  optional int32 total = 1 [(hi.visibility) = VIS_SELF];
  repeated TaskSummary tasks = 2 [(hi.visibility) = VIS_SELF];
}

// 取消本人可取消的任务。
message CancelTaskReq {
  optional string task_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

// 返回取消受理后的当前任务状态，不保证同步终止上游执行。
message CancelTaskResp {
  option (hi.audience) = VIS_SELF;
  optional string task_id = 1 [(hi.visibility) = VIS_SELF];
  optional TaskStatus status = 2 [(hi.visibility) = VIS_SELF];
  optional string status_message = 3 [(hi.visibility) = VIS_SELF];
}

// 从本人任务历史中删除一个已经失败的普通生成任务。
message DeleteTaskReq {
  optional string task_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

// 恢复本人 can_recover_save=true 的普通任务；每个任务最多受理一次，不重新执行 GPU。
message RecoverSaveTaskReq {
  // 本人范围内的幂等键；同一次操作重发复用，新操作使用新值。
  optional string request_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  optional string task_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

// 返回原任务 ID 和当前状态；相同恢复 request_id 重发幂等。
message RecoverSaveTaskResp {
  option (hi.audience) = VIS_SELF;
  optional string task_id = 1 [(hi.visibility) = VIS_SELF];
  optional TaskStatus status = 2 [(hi.visibility) = VIS_SELF];
  optional string status_message = 3 [(hi.visibility) = VIS_SELF];
}

// 普通用户视频任务创建、查询、取消和一次性恢复保存。
service Task {
  // 创建图生视频任务；只提交 workflow_id 与业务参数，不组合功能或模型 ID。
  rpc CreateImageToVideo(CreateImageToVideoTaskReq) returns (CreateTaskResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 创建文生视频任务；只提交 workflow_id 与业务参数。
  rpc CreateTextToVideo(CreateTextToVideoTaskReq) returns (CreateTaskResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 查询本人任务详情及产物资产 ID。
  rpc Get(GetTaskReq) returns (GetTaskResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 分页查询本人任务。
  rpc List(ListTasksReq) returns (ListTasksResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 按 can_cancel 取消任务；相同任务重复请求返回当前状态。
  rpc Cancel(CancelTaskReq) returns (CancelTaskResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 仅允许删除本人已经失败的普通生成任务；重复删除幂等成功。
  rpc Delete(DeleteTaskReq) returns (google.protobuf.Empty) {
    option (hi.auth) = AUTH_USER;
  }
  // 恢复保存复用原任务，不检查存储额度或未完成任务上限，只受保存并发限制。
  rpc RecoverSave(RecoverSaveTaskReq) returns (RecoverSaveTaskResp) {
    option (hi.auth) = AUTH_USER;
  }
}
