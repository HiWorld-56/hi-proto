syntax = "proto3";

package hi.media;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

// 文本长度约束；服务端按 Unicode 码点计数。
message TextLimit {
  option (hi.audience) = VIS_PUBLIC;
  // 按 Unicode 码点计算的正向提示词最大长度。
  optional uint32 max_length = 1 [
    (buf.validate.field).uint32.gt = 0,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 像素量选项，使用规范十进制字符串，默认值必须在允许集合内。
message DecimalOptionConfig {
  option (hi.audience) = VIS_PUBLIC;
  option (buf.validate.message).cel = {
    id: "decimal_option.default_value"
    message: "default_value must be one of allowed_values"
    expression: "this.allowed_values.exists(value, value == this.default_value)"
  };

  // 规范十进制字符串，例如 "0.9"；客户端必须原样提交，不转为浮点重新格式化。
  repeated string allowed_values = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: {
        string: {min_len: 1}
      }
    },
    (hi.visibility) = VIS_PUBLIC
  ];
  optional string default_value = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 字符串选项，保存并传递工作流节点接受的完整值。
message StringOptionConfig {
  option (hi.audience) = VIS_PUBLIC;
  option (buf.validate.message).cel = {
    id: "string_option.default_value"
    message: "default_value must be one of allowed_values"
    expression: "this.allowed_values.exists(value, value == this.default_value)"
  };

  repeated string allowed_values = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: {
        string: {min_len: 1}
      }
    },
    (hi.visibility) = VIS_PUBLIC
  ];
  optional string default_value = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 正整数范围，最小值和最大值均包含在允许范围内。
message IntRangeConfig {
  option (hi.audience) = VIS_PUBLIC;
  option (buf.validate.message).cel = {
    id: "int_range.bounds"
    message: "min_value must not exceed max_value and default_value must be within the range"
    expression: "this.min_value <= this.max_value && this.default_value >= this.min_value && this.default_value <= this.max_value"
  };

  // 含边界最小值。
  optional int32 min_value = 1 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
  // 含边界最大值。
  optional int32 max_value = 2 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
  // 用户省略参数时采用的值。
  optional int32 default_value = 3 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 帧率（帧/秒）的可选范围或固定值，两种模式必须选择其一。
message FrameRateConfig {
  option (hi.audience) = VIS_PUBLIC;
  oneof mode {
    option (buf.validate.oneof).required = true;

    // 用户可以在工作流配置的整数范围内选择帧率。
    IntRangeConfig selectable = 1 [(hi.visibility) = VIS_PUBLIC];
    // 工作流没有帧率绑定；前端只读展示该值，创建时可以省略帧率。
    int32 fixed_value = 2 [
      (buf.validate.field).int32.gt = 0,
      (hi.visibility) = VIS_PUBLIC
    ];
  }
}

// 输入图片数量，含 min/max 边界；多图列表始终有序，不另设 ordered 字段。
message InputImagesConfig {
  option (hi.audience) = VIS_PUBLIC;
  option (buf.validate.message).cel = {
    id: "input_images.bounds"
    message: "min must not exceed max"
    expression: "this.min <= this.max"
  };
  // 单图修改与角色生成为 1；多图修改按工作流配置，当前最少 2 张。
  optional uint32 min = 1 [
    (buf.validate.field).uint32.gt = 0,
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
  // FLUX 多图为 2，Qwen 多图最多 4；创建时由后端强校验。
  optional uint32 max = 2 [
    (buf.validate.field).uint32 = {
      gt: 0
      lte: 4
    },
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 文生图宽高范围与默认值，单位像素；min/max/default 均须为 16 的倍数。
message ImageDimensionsConfig {
  option (hi.audience) = VIS_PUBLIC;
  option (buf.validate.message).cel = {
    id: "image_dimensions.alignment"
    message: "width and height bounds and defaults must be multiples of 16"
    expression: "this.width.min_value % 16 == 0 && this.width.max_value % 16 == 0 && this.width.default_value % 16 == 0 && this.height.min_value % 16 == 0 && this.height.max_value % 16 == 0 && this.height.default_value % 16 == 0"
  };
  IntRangeConfig width = 1 [
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
  IntRangeConfig height = 2 [
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 文生图的 ResolutionSelector 参数，宽高比传完整选项，像素量传十进制字符串。
message ImageResolutionConfig {
  option (hi.audience) = VIS_PUBLIC;
  StringOptionConfig aspect_ratio = 1 [
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
  DecimalOptionConfig megapixels = 2 [
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PUBLIC
  ];
}

// 工作流向普通用户开放的参数，不包含节点或管理员固定输入。
// 为兼容已发布协议保留历史消息名；字段 1～5 是视频参数，图片扩展追加字段。
message VideoParameterConfig {
  option (hi.audience) = VIS_PUBLIC;
  TextLimit prompt = 1 [(hi.visibility) = VIS_PUBLIC];
  StringOptionConfig aspect_ratio = 2 [(hi.visibility) = VIS_PUBLIC];
  DecimalOptionConfig megapixels = 3 [(hi.visibility) = VIS_PUBLIC];
  IntRangeConfig duration_seconds = 4 [(hi.visibility) = VIS_PUBLIC];
  FrameRateConfig frame_rate = 5 [(hi.visibility) = VIS_PUBLIC];
  // 单图修改、角色生成及多图修改提供；文生图省略。提交顺序即图片接入顺序。
  InputImagesConfig input_images = 6 [(hi.visibility) = VIS_PUBLIC];
  // 仅文生图提供一种尺寸模式；图片修改与角色生成的尺寸由工作流决定。
  oneof image_size {
    ImageDimensionsConfig image_dimensions = 7 [(hi.visibility) = VIS_PUBLIC];
    ImageResolutionConfig image_resolution = 8 [(hi.visibility) = VIS_PUBLIC];
  }
}

// 系统初始化的功能，包括已实现和开发中的入口；客户端从 Function.List 获取 ID。
message FunctionSummary {
  option (hi.audience) = VIS_PUBLIC;
  // 固定值：video.img2vid（图生视频）、video.txt2vid（文生视频）。
  // 图片增量：image.txt2img（文生图）、image.edit_single（单图修改）、
  // image.edit_multiple（多图修改）、image.character（角色生成）。
  // 开发中：video.first_last_frame（首尾帧生成）、video.motion_transfer（模仿生成）、
  // video.continuation（引导生成）、video.reference（参考生成）、
  // video.advanced_replace（高级替换）；登记入口不代表已实现生成接口。
  optional string function_id = 1 [(hi.visibility) = VIS_PUBLIC];
  optional string display_name = 2 [(hi.visibility) = VIS_PUBLIC];
  // 管理员控制的开放开关；false 仍展示入口，但普通用户不能创建新任务。
  // 与工作流 ENABLED 状态独立，不影响已受理任务或管理员试跑。
  optional bool enabled = 3 [(hi.visibility) = VIS_PUBLIC];
}

// 返回全部登记功能，不按开放开关或工作流数量过滤。
message ListFunctionsResp {
  option (hi.audience) = VIS_PUBLIC;
  repeated FunctionSummary functions = 1 [(hi.visibility) = VIS_PUBLIC];
}

// 查询登记功能；关闭时正常返回功能信息，workflows 为空。
message GetFunctionReq {
  // 必须来自 Function.List；功能 ID 的支持值及中文用途见 FunctionSummary.function_id。
  optional string function_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

// 普通用户可见的模型信息，不含 ComfyUI 真实文件名。
message WorkflowModelOption {
  option (hi.audience) = VIS_PUBLIC;
  // 关联模型 ID；创建任务时无需回传。
  optional string model_id = 1 [(hi.visibility) = VIS_PUBLIC];
  optional string display_name = 2 [(hi.visibility) = VIS_PUBLIC];
}

// 功能页的一项可用工作流；用户选择后按该项参数配置填写表单。
message WorkflowOption {
  option (hi.audience) = VIS_PUBLIC;
  // 创建任务时提交的唯一工作流 ID，由服务端生成；客户端不计算 hash。
  optional string workflow_id = 1 [(hi.visibility) = VIS_PUBLIC];
  WorkflowModelOption model = 2 [(hi.visibility) = VIS_PUBLIC];
  // 管理员显式指定；同一功能最多一项为 true，也可以没有默认项。
  optional bool is_default = 3 [(hi.visibility) = VIS_PUBLIC];
  // 管理员编写的 Markdown 说明；客户端应使用安全 Markdown 渲染。
  optional string description = 4 [(hi.visibility) = VIS_PUBLIC];
  // 该工作流的范围、完整允许值与默认值，不能按模型名称硬编码。
  VideoParameterConfig parameter_config = 5 [(hi.visibility) = VIS_PUBLIC];
}

// 一次返回功能页所需的全部可用工作流配置，不暴露节点、依赖或文件对象键。
message GetFunctionResp {
  option (hi.audience) = VIS_PUBLIC;
  FunctionSummary function = 1 [(hi.visibility) = VIS_PUBLIC];
  // 功能关闭时为空；开放时只包含 ENABLED 工作流，按管理员顺序及稳定次序排列。
  // enabled=false 提示开发中；enabled=true 且列表为空提示暂无可用工作流。
  repeated WorkflowOption workflows = 2 [(hi.visibility) = VIS_PUBLIC];
}

// 普通用户的功能选择入口。
service Function {
  // 返回全部登记功能的 ID、显示名及开放开关，管理员页面也复用此列表。
  rpc List(google.protobuf.Empty) returns (ListFunctionsResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 返回指定功能；仅开放时返回全部已启用工作流及用户参数配置。
  rpc Get(GetFunctionReq) returns (GetFunctionResp) {
    option (hi.auth) = AUTH_USER;
  }
}

// 修改功能开放开关；function_id 与 enabled 必须显式提供，包括 enabled=false。
message SetFunctionEnabledReq {
  optional string function_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  // true 允许普通用户创建新任务；开启不要求已有工作流，不自动启用工作流。
  optional bool enabled = 2 [(buf.validate.field).required = true];
}

// 管理员只调整功能开放开关；功能 ID 和显示名称随开发初始化。
service FunctionManage {
  // 关闭只阻止新建普通任务，不取消已有任务，也不限制管理员配置、校验和试跑。
  // 目标功能不存在返回 NotFound；重复设置同一值仍成功。
  rpc SetEnabled(SetFunctionEnabledReq) returns (google.protobuf.Empty) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
}
