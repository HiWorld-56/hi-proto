syntax = "proto3";

package hi.media;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

// 本人所属的服务调用凭据；明文保存，创建及列表均返回完整值，不应写入日志或交给模型。
message ApiKeyInfo {
  option (hi.audience) = VIS_SELF;
  optional string value = 1 [(hi.visibility) = VIS_SELF]; // 完整 Key，业务调用通过 ApiKey 请求头传入。
  optional string did = 2 [(hi.visibility) = VIS_SELF]; // 所属 HiMedia 账号，素材和产物归此账号。
  optional string note = 3 [(hi.visibility) = VIS_SELF]; // 本人填写的备注。
  optional int64 created_at = 4 [(hi.visibility) = VIS_SELF]; // 创建时间，Unix 秒。
}

message CreateApiKeyResp {
  option (hi.audience) = VIS_SELF;
  ApiKeyInfo info = 1 [(hi.visibility) = VIS_SELF];
}

message EditApiKeyReq {
  optional string api_key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 80,
    (buf.validate.field).required = true
  ];
  // 必填，空字符串清空备注；不改变凭据值或所属账号。
  optional string note = 2 [
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).required = true
  ];
}

message ListApiKeysResp {
  option (hi.audience) = VIS_SELF;
  optional int32 total = 1 [(hi.visibility) = VIS_SELF];
  repeated ApiKeyInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

message DeleteApiKeyReq {
  optional string api_key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 80,
    (buf.validate.field).required = true
  ];
}

// 只能使用本人登录态管理 Key，不能用 API Key 管理自身或继承管理员权限。
// 业务 Key 仅用于图片上传、上传结果、三类图片创建、任务详情及资产访问地址；
// 不开放视频创建或上传、角色生成、删除资源或管理接口，不限定具体模型。
service ApiKey {
  rpc Create(google.protobuf.Empty) returns (CreateApiKeyResp) {
    option (hi.auth) = AUTH_USER;
  }
  rpc Edit(EditApiKeyReq) returns (google.protobuf.Empty) {
    option (hi.auth) = AUTH_USER;
  }
  rpc List(hi.Pagination) returns (ListApiKeysResp) {
    option (hi.auth) = AUTH_USER;
  }
  // 删除后新请求立即拒绝；已经受理的生成任务不因此取消。
  rpc Delete(DeleteApiKeyReq) returns (google.protobuf.Empty) {
    option (hi.auth) = AUTH_USER;
  }
}
