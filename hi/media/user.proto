syntax = "proto3";

package hi.media;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";

message UserInfo {
  hi.Entity base = 1;
  string    note = 2;
}

message ListUserReq {
  string        did        = 1;
  hi.Pagination pagination = 2;
}

message ListUserResp {
  int32             total = 1;
  repeated UserInfo list  = 2;
}

message EditUserReq {
  string did  = 1[(buf.validate.field).string.pattern="^\\S+$"];
  string note = 2;
}

message DeleteUserReq {
  string did = 1[(buf.validate.field).string.pattern="^\\S+$"];
}

// Token鉴权
service User {
  rpc List (ListUserReq) returns (ListUserResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc Edit (EditUserReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }
  rpc Delete (DeleteUserReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }
}