syntax = "proto3";

package hi.media;

import "google/protobuf/empty.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

// 本人存储额度；不包含预占，所有数值单位为字节，JSON 使用十进制字符串。
message GetQuotaResp {
  option (hi.audience) = VIS_SELF;
  // 用户存储总上限。
  optional uint64 total_bytes = 1 [(hi.visibility) = VIS_SELF];
  // 已确认的实际占用，已受理任务保存后允许超过 total_bytes。
  optional uint64 used_bytes = 2 [(hi.visibility) = VIS_SELF];
  // max(total_bytes - used_bytes, 0)，不会因超额变为负数。
  optional uint64 available_bytes = 3 [(hi.visibility) = VIS_SELF];
}

// 用户存储总额度查询；新任务在实际占用达到上限时拒绝受理。
service Quota {
  // 返回当前用户的总上限、实际占用和可用量。
  rpc Get(google.protobuf.Empty) returns (GetQuotaResp) {
    option (hi.auth) = AUTH_USER;
  }
}
