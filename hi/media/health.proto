syntax = "proto3";

package hi.media;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

import "google/protobuf/empty.proto";
import "hi/options.proto";

service Health {
  rpc Check (google.protobuf.Empty) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; } // 不鉴权
}
