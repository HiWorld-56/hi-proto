syntax = "proto3";

package hi.media;

import "buf/validate/validate.proto";
import "hi/common.proto";
import "hi/media/feature.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

message ModelMapping {
  option (hi.audience) = VIS_SELF;
  optional string model_mapping_id = 1 [(hi.visibility) = VIS_SELF];
  optional FeatureKey feature_key = 2 [(hi.visibility) = VIS_SELF];
  optional string model_id = 3 [(hi.visibility) = VIS_SELF];
  optional string workflow_version_id = 4 [(hi.visibility) = VIS_SELF];
  optional bool enabled = 5 [(hi.visibility) = VIS_SELF];
  optional bool is_default = 6 [(hi.visibility) = VIS_SELF];
  optional int32 sort_order = 7 [(hi.visibility) = VIS_SELF];
  optional int64 created_at = 8 [(hi.visibility) = VIS_SELF];
  optional int64 updated_at = 9 [(hi.visibility) = VIS_SELF];
  optional int64 disabled_at = 10 [(hi.visibility) = VIS_SELF];
}

message CreateModelMappingReq {
  optional FeatureKey feature_key = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (buf.validate.field).required = true
  ];
  optional string model_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  optional string workflow_version_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  optional bool is_default = 4;
  optional int32 sort_order = 5;
}

message CreateModelMappingResp {
  option (hi.audience) = VIS_SELF;
  ModelMapping mapping = 1 [(hi.visibility) = VIS_SELF];
}

message DisableModelMappingReq {
  optional string model_mapping_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
  // 停用默认映射且仍有其他启用映射时必填，并且必须属于同一功能。
  optional string replacement_default_mapping_id = 2 [(buf.validate.field).string.min_len = 1];
}

message DisableModelMappingResp {
  option (hi.audience) = VIS_SELF;
  ModelMapping mapping = 1 [(hi.visibility) = VIS_SELF];
}

message SetDefaultModelMappingReq {
  optional string model_mapping_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

message SetDefaultModelMappingResp {
  option (hi.audience) = VIS_SELF;
  ModelMapping mapping = 1 [(hi.visibility) = VIS_SELF];
}

message UpdateModelMappingSortOrderReq {
  // 同一功能下全部启用映射的完整顺序，不能只提交发生移动的部分。
  repeated string model_mapping_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

message UpdateModelMappingSortOrderResp {
  option (hi.audience) = VIS_SELF;
  repeated ModelMapping mappings = 1 [(hi.visibility) = VIS_SELF];
}

message GetModelMappingReq {
  optional string model_mapping_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).required = true
  ];
}

message GetModelMappingResp {
  option (hi.audience) = VIS_SELF;
  ModelMapping mapping = 1 [(hi.visibility) = VIS_SELF];
}

message ListModelMappingsReq {
  hi.Pagination pagination = 1;
  optional FeatureKey feature_key = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional bool enabled = 3;
}

message ListModelMappingsResp {
  option (hi.audience) = VIS_SELF;
  optional int32 total = 1 [(hi.visibility) = VIS_SELF];
  repeated ModelMapping mappings = 2 [(hi.visibility) = VIS_SELF];
}

service ModelMappingManage {
  rpc Create(CreateModelMappingReq) returns (CreateModelMappingResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
  rpc Disable(DisableModelMappingReq) returns (DisableModelMappingResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
  rpc SetDefault(SetDefaultModelMappingReq) returns (SetDefaultModelMappingResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
  rpc UpdateSortOrder(UpdateModelMappingSortOrderReq) returns (UpdateModelMappingSortOrderResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
  rpc List(ListModelMappingsReq) returns (ListModelMappingsResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
  rpc Get(GetModelMappingReq) returns (GetModelMappingResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
}
