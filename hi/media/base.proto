syntax = "proto3";

package hi.media;

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

service Base {
  rpc ServerVersion (google.protobuf.Empty) returns (hi.ServerVersionResp) { option (hi.auth) = AUTH_NONE; }
}
