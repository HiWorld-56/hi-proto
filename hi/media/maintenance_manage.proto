syntax = "proto3";

package hi.media;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/media";

message MaintenanceState {
  option (hi.audience) = VIS_SELF;
  optional bool enabled = 1 [(hi.visibility) = VIS_SELF];
  optional string reason = 2 [(hi.visibility) = VIS_SELF];
  optional int64 started_at = 3 [(hi.visibility) = VIS_SELF];
  optional string updated_by = 4 [(hi.visibility) = VIS_SELF];
  optional int64 updated_at = 5 [(hi.visibility) = VIS_SELF];
}

message GetMaintenanceResp {
  option (hi.audience) = VIS_SELF;
  MaintenanceState state = 1 [(hi.visibility) = VIS_SELF];
}

message SetMaintenanceReq {
  // 必须显式提交。维护模式只暂停向 ComfyUI 派发新任务，不禁用查询和管理接口。
  optional bool enabled = 1 [(buf.validate.field).required = true];
  optional string reason = 2 [(buf.validate.field).string.max_len = 512];
}

message SetMaintenanceResp {
  option (hi.audience) = VIS_SELF;
  MaintenanceState state = 1 [(hi.visibility) = VIS_SELF];
}

service MaintenanceManage {
  rpc Get(google.protobuf.Empty) returns (GetMaintenanceResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
  rpc Set(SetMaintenanceReq) returns (SetMaintenanceResp) {
    option (hi.auth) = AUTH_SUPERADMIN;
  }
}
