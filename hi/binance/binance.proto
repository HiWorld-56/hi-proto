// 合约账户在一个时间窗里的**盈亏**。**不是币安的一个接口**,是机器人用流水与账户算出来的
// (`usds_futures.income` 翻页取全 + `usds_futures.account_information_v3`),口径照币安「PnL 分析」:
//
//   盈亏 = 窗内**非划转**流水之和(已实现盈亏 + 手续费 + 资金费 + 其它)
//          = 期末钱包余额 − 期初钱包余额 − 净流入
//   期初钱包余额 = 现在的钱包余额(totalWalletBalance)− 窗内全部流水
//   比率 = 盈亏 ÷ (期初钱包余额 + 净流入);分母不大于 0 时没有比率
//
// 只算 USDT 流水(用 BNB 抵扣的手续费那类流水是 BNB 的个数,不能当 USDT 加)。
//
// 窗口(`window`):
//   · `today`:币安时间 UTC 0 点到现在。**不含**未实现盈亏(开仓以来的浮盈不是今天的)。
//   · `90d`:近 90 天到现在(币安流水只保留三个月),**加上**现在持仓的未实现盈亏(totalUnrealizedProfit)。
//
// 结果在 `BinanceResult.body` 里,是**机器人写的 JSON**(不是币安原文),金额一律十进制字符串:
//
//   window           "today" / "90d"
//   start_ms end_ms  窗口(毫秒,币安时间)
//   pnl              盈亏
//   pct              比率(百分数,如 "-31.23";分母不大于 0 时为 null)
//   base             比率的分母(期初钱包余额 + 净流入)
//   wallet_start wallet_now  期初 / 现在的钱包余额
//   net_inflow       窗内划转净额(转入为正)
//   realized_pnl commission funding_fee other  盈亏的构成(各自的流水之和,带正负)
//   unrealized       现在的未实现盈亏;unrealized_included 表示 pnl 里加没加它
//   commission_paid funding_fee_paid  窗内付出去的手续费 / 资金费(只算负流水,取正数)
//   complete         流水取全没有(一页 1000 条、最多 5 页;没取全时 pnl 偏小)
//   rows             用到的流水条数
message BinanceFuturesPnl {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string window = 1 [
    (buf.validate.field).string = {in: ["today", "90d"]},
    (buf.validate.field).required = true,
    (hi.visibility) = VIS_PARTICIPANT
  ];
}

// 签 **TradFi 永续合约协议**。`POST /fapi/v1/stock/contract`
//
// 股票、商品、外汇这类永续(`contractType == TRADIFI_PERPETUAL`)**要先签才能交易**;查询不用签。
// 每个币安账户签一次,重复签币安照样回成功。**没有参数**。
//
// 现在由币安插件在 install 时**静默**签(有密钥才签得了,见插件);以后给用户一个「同意」页面,
// 发的也是这个对象。它是**法律动作**,不该由 AI 自己决定去做 —— 插件没把它开放成插件方法。
message BinanceFuturesSignTradfiContract {
  option (hi.audience) = VIS_PARTICIPANT;
}

// ════════════════════════════ 钱包 ════════════════════════════

// 各钱包的余额(现货、资金、合约、理财…,每个钱包带逐币明细)。`GET /sapi/v1/asset/wallet/balance`
//
// **没有参数**:明细(`needBalanceDetail=true`)由机器人一律带上 —— 不带就只有每个钱包折成 BTC 的总额,
// 看不出里面有什么币,而这个接口要回答的正是"钱在哪个钱包、有多少"。
// 美股的买入扣款与卖出回款(USDC)都在这里看,美股模块本身没有查余额的接口。
message BinanceWalletBalance {
  option (hi.audience) = VIS_PARTICIPANT;
}

// ════════════════════════════ 结果 ════════════════════════════

// 一次币安操作的结果。装在**消息**里回到指令来的那个会话:
// `Content.type = "binance"`、`Content.kind = binance`。
//
// ## 为什么 `body` 是一串原始 JSON,而不是结构化的字段
//
// 币安返回什么是**币安的契约**,我们再抄一份进 proto 就是同一件事存两份 —— 它一改就漂,
// 而漂了不报错。这里只保证"原样带回来",怎么显示是端上的事。
//
// ## 三种结局,靠字段区分
//
//   · 发出去了,币安回了 2xx  → `http_status` = 200,`body` = 它的 JSON
//   · 发出去了,币安拒了      → `http_status` = 4xx/5xx,`body` = `{"code":-1121,"msg":"Invalid symbol."}`
//   · **根本没发出去**       → 没有 `http_status`,`error` 写人话
//     (没配凭据、指令过期、系统时钟不可信、不认发令人、没装币安插件……)
message BinanceResult {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string request     = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 指令那条消息的 uuid,配对用
  optional string op          = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 操作名(「模块.方法」)
  optional uint32 http_status = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 币安的 HTTP 状态码;没发出去就不带
  optional string body        = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 币安返回的原始 JSON,一个字不改
  optional string error       = 5 [(hi.visibility) = VIS_PARTICIPANT]; // 没发出去时的原因(人话);发出去了就不带
  // 回这条结果时,这台机器人**手里已有的**持有情况(见 `BinanceHoldings`)。
  // **不带 = 这条结果没有报告持有情况**(指令被拒 / 过期 / 没装插件,或机器人版本还没有这个字段) ——
  // 不是「没持仓」,也不是「不知道」,读方应沿用这台之前报告过的那一份。
  optional BinanceHoldings held = 6 [(hi.visibility) = VIS_PARTICIPANT];
}

// 一台机器人**最近一次知道的**持有情况,按产品线分开。随 `BinanceResult` 顺带回来,好让发令方在下单前
// 按「谁持有这个币」挑机器人。
//
// ## 不实时,但不说假话
//
// · 取自机器人本地的账户快照(后台轮询的合约账户、最近一次查到的现货账户),**不为它另打币安**;
//   主人在 hi 之外(币安 App、网页)做的改动,要等下一次查询才反映出来。
// · 经 hi 下过单 / 撤过单 / 改过杠杆 / 换过密钥,机器人当场把两条线都作废(与它的账户快照同一个时刻)——
//   之后**不带**,直到再取到为止(合约那条有后台轮询,通常十来秒就回来;现货那条要等下一次查现货账户)。
//   所以**某条线不带 = 不知道**(没查过、或刚动过账户还没再取),**带着空列表 = 确实没有持有**。两者不许混。
// · 查持仓失败照常从 `http_status` / `error` 报出来;这里只放成功取到过的那一份。
message BinanceHoldings {
  option (hi.audience) = VIS_PARTICIPANT;
  optional BinanceHeld futures = 1 [(hi.visibility) = VIS_PARTICIPANT]; // U 本位合约(含 TradFi 永续):仓位不为 0 的交易对,如 BNBUSDT
  optional BinanceHeld spot    = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 现货(含 bStocks):余额(可用 + 冻结)不为 0 的币,如 BNB、USDT
}

// 一条产品线上持有的东西,以及这份数据有多旧。
message BinanceHeld {
  option (hi.audience) = VIS_PARTICIPANT;
  // 从币安取到这份数据,到机器人回这条结果,过了多少**秒**。
  // 用时长不用时刻:机器人的钟不一定准(开机那会儿可能是 1970),时长只靠它自己的单调计时。
  optional uint32 age   = 1 [(hi.visibility) = VIS_PARTICIPANT];
  repeated string names = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 合约是交易对,现货是币;按字典序
}
