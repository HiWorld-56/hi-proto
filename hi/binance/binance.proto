syntax = "proto3";

package hi.binance;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/binance";

import "buf/validate/validate.proto";
import "hi/options.proto";

// **机器人替人操作币安**的载荷定义。
//
// 两条触发路径,都先到**币安插件**(谁能让这台机器人交易由插件判:主人或插件配置的代理),
// 再由插件调 sdk 方法 `binance_call`,落到 brain 里**同一个执行器**:
//
//   ① 主人说话 → 模型 → 插件方法(参数是 JSON)
//   ② 一条**指令消息**(`Content.kind = binance_cmd`,`BinanceCommand`,见 hi/binance/command.proto)
//      → brain 以信封上的 `from` 为发令人、**不经过模型**,调插件的协议方法 —— 本文件的对象就是这条路的载荷
//
// 指令就是一条普通消息:发到哪个会话、@ 谁,与聊天完全一样(2026-09-25 定,取代原来那条
// 「后端代发 binance 通知」的路)。口径全在 hi/binance/command.proto。
//
// | 操作名                              | 对象                                    |
// |-------------------------------------|-----------------------------------------|
// | `spot.new_order`                    | `BinanceSpotNewOrder`          |
// | `spot.cancel_order`                 | `BinanceSpotCancelOrder`       |
// | `spot.cancel_all_open_orders`       | `BinanceSpotCancelAllOrders`   |
// | `spot.get_open_orders`              | `BinanceSpotOpenOrders`        |
// | `spot.account_information`          | `BinanceSpotAccount`           |
// | `spot.get_order`                    | `BinanceSpotGetOrder`          |
// | `spot.get_open_order_lists`         | `BinanceSpotOpenOrderLists`    |
// | `spot.ticker_24h`                   | `BinanceSpotTicker24h`         |
// | `spot.order_list_oco`               | `BinanceSpotOrderListOco`      |
// | `spot.order_list_oto`               | `BinanceSpotOrderListOto`      |
// | `spot.order_list_otoco`             | `BinanceSpotOrderListOtoco`    |
// | `spot.order_list_opo`               | `BinanceSpotOrderListOpo`      |
// | `spot.order_list_opoco`             | `BinanceSpotOrderListOpoco`    |
// | `spot.delete_order_list`            | `BinanceSpotCancelOrderList`   |
// | `spot.get_order_list`               | `BinanceSpotGetOrderList`      |
// | `spot.all_order_list`               | `BinanceSpotAllOrderLists`     |
// | `usds_futures.new_order`            | `BinanceFuturesNewOrder`       |
// | `usds_futures.ticker_24h`           | `BinanceFuturesTicker24h`      |
// | `spot.klines`                       | `BinanceSpotKlines`            |
// | `usds_futures.klines`               | `BinanceFuturesKlines`         |
// | `usds_futures.cancel_order`         | `BinanceFuturesCancelOrder`    |
// | `usds_futures.cancel_all_open_orders` | `BinanceFuturesCancelAllOrders` |
// | `usds_futures.change_initial_leverage` | `BinanceFuturesLeverage`    |
// | `usds_futures.position_information_v3` | `BinanceFuturesPositions`   |
// | `usds_futures.account_information_v3`  | `BinanceFuturesAccount`     |
// | `usds_futures.current_all_open_orders` | `BinanceFuturesOpenOrders`  |
// | `usds_futures.open_algo_orders`     | `BinanceFuturesOpenAlgoOrders` |
// | `usds_futures.new_algo_order`       | `BinanceFuturesNewAlgoOrder`   |
// | `usds_futures.cancel_algo_order`    | `BinanceFuturesCancelAlgoOrder` |
// | `usds_futures.cancel_all_algo_open_orders` | `BinanceFuturesCancelAllAlgoOrders` |
// | `usds_futures.query_algo_order`     | `BinanceFuturesGetAlgoOrder`   |
// | `usds_futures.query_all_algo_orders` | `BinanceFuturesAllAlgoOrders` |
// | `usds_futures.income`               | `BinanceFuturesIncome`         |
// | `usds_futures.pnl`(机器人算的)    | `BinanceFuturesPnl`            |
// | `usds_futures.sign_tradfi_contract` | `BinanceFuturesSignTradfiContract` |
// | `wallet.query_user_wallet_balance`  | `BinanceWalletBalance`         |
//
// **美股**(`stocks.*`)是币安单独的一个模块,对象在 hi/binance/stocks.proto。
// 操作名就是币安官方 SDK 的「模块.方法」。
//
// ## 结果回到来路那个会话
//
// 机器人用一条消息回:`Content.type = "binance"`、`Content.kind = binance(BinanceResult)`。
// 群里来的回那个群,单聊来的回单聊;**暗语等级沿用指令那条**。

// ## 金额一律字符串
//
// 价格与数量**不用浮点**。币安收的就是字符串,浮点会在精度上静默出错 ——
// 这是钱,不是显示。

// 买卖方向。
enum BinanceOrderSide {
  BINANCE_ORDER_SIDE_UNSPECIFIED = 0;
  BINANCE_ORDER_SIDE_BUY         = 1;
  BINANCE_ORDER_SIDE_SELL        = 2;
}

// **合约普通单**的类型。只有这两种 —— 合约的止盈止损、跟踪止损是**策略委托**,
// 走另一个接口(`BinanceFuturesNewAlgoOrder`):币安 2025-12-09 起把它们从 `/fapi/v1/order` 迁走,
// 再往普通下单接口发会回 `-4120 STOP_ORDER_SWITCH_ALGO`。
// 现货的单型更多,是另一个枚举(`BinanceSpotOrderType`)—— 两边能下的单不一样,合用一个枚举就能写出币安必拒的组合。
enum BinanceOrderType {
  BINANCE_ORDER_TYPE_UNSPECIFIED = 0;
  BINANCE_ORDER_TYPE_LIMIT       = 1; // 限价:必须给 price 与 time_in_force
  BINANCE_ORDER_TYPE_MARKET      = 2; // 市价:不给 price
}

// **现货**的订单类型(`POST /api/v3/order` 的 `type`)。1、2 与 `BinanceOrderType` 同值(拆枚举之前的存量指令照样解得出来)。
//
// | 类型 | 还要给 |
// |---|---|
// | LIMIT | price、time_in_force、quantity |
// | MARKET | quantity 或 quote_order_qty |
// | STOP_LOSS | quantity,stop_price 或 trailing_delta —— 触发后按**市价**成交(止损) |
// | STOP_LOSS_LIMIT | price、time_in_force、quantity,stop_price 或 trailing_delta —— 触发后挂**限价**单 |
// | TAKE_PROFIT | quantity,stop_price 或 trailing_delta —— 触发后按市价成交(止盈) |
// | TAKE_PROFIT_LIMIT | price、time_in_force、quantity,stop_price 或 trailing_delta |
// | LIMIT_MAKER | price、quantity —— 只做挂单方,会立即成交就被拒 |
enum BinanceSpotOrderType {
  BINANCE_SPOT_ORDER_TYPE_UNSPECIFIED       = 0;
  BINANCE_SPOT_ORDER_TYPE_LIMIT             = 1;
  BINANCE_SPOT_ORDER_TYPE_MARKET            = 2;
  BINANCE_SPOT_ORDER_TYPE_STOP_LOSS         = 3;
  BINANCE_SPOT_ORDER_TYPE_STOP_LOSS_LIMIT   = 4;
  BINANCE_SPOT_ORDER_TYPE_TAKE_PROFIT       = 5;
  BINANCE_SPOT_ORDER_TYPE_TAKE_PROFIT_LIMIT = 6;
  BINANCE_SPOT_ORDER_TYPE_LIMIT_MAKER       = 7;
}

// **合约策略委托**的类型(`POST /fapi/v1/algoOrder`,`algoType = CONDITIONAL`)。
//
// | 类型 | 还要给 |
// |---|---|
// | STOP | quantity、price、trigger_price —— 触发后挂限价单(止损) |
// | TAKE_PROFIT | quantity、price、trigger_price —— 触发后挂限价单(止盈) |
// | STOP_MARKET | trigger_price,quantity 或 close_position —— 触发后市价(止损) |
// | TAKE_PROFIT_MARKET | trigger_price,quantity 或 close_position —— 触发后市价(止盈) |
// | TRAILING_STOP_MARKET | quantity、callback_rate,可选 activate_price —— 跟踪止损 |
enum BinanceFuturesAlgoOrderType {
  BINANCE_FUTURES_ALGO_ORDER_TYPE_UNSPECIFIED          = 0;
  BINANCE_FUTURES_ALGO_ORDER_TYPE_STOP                 = 1;
  BINANCE_FUTURES_ALGO_ORDER_TYPE_STOP_MARKET          = 2;
  BINANCE_FUTURES_ALGO_ORDER_TYPE_TAKE_PROFIT          = 3;
  BINANCE_FUTURES_ALGO_ORDER_TYPE_TAKE_PROFIT_MARKET   = 4;
  BINANCE_FUTURES_ALGO_ORDER_TYPE_TRAILING_STOP_MARKET = 5;
}

// 合约触发价按哪个价格比。不传 = 币安默认 CONTRACT_PRICE(最新成交价)。
enum BinanceWorkingType {
  BINANCE_WORKING_TYPE_UNSPECIFIED    = 0;
  BINANCE_WORKING_TYPE_MARK_PRICE     = 1; // 标记价格 —— 不容易被一笔插针打穿
  BINANCE_WORKING_TYPE_CONTRACT_PRICE = 2; // 最新成交价
}

// 订单有效方式(限价单才用得上)。
enum BinanceTimeInForce {
  BINANCE_TIME_IN_FORCE_UNSPECIFIED = 0;
  BINANCE_TIME_IN_FORCE_GTC         = 1; // 成交为止
  BINANCE_TIME_IN_FORCE_IOC         = 2; // 立即成交,剩余撤销
  BINANCE_TIME_IN_FORCE_FOK         = 3; // 全部成交,否则撤销
  // 只做挂单(币安 App 的「只做 Maker」):会立刻成交的单直接被拒,不会误吃单。**只有合约普通限价单收**;
  // 现货的只做挂单是单型 BINANCE_SPOT_ORDER_TYPE_LIMIT_MAKER,不是有效期。
  BINANCE_TIME_IN_FORCE_GTX         = 4;
}

// 持仓方向(合约)。单向持仓模式下只有 BOTH;双向持仓才用 LONG / SHORT。
enum BinancePositionSide {
  BINANCE_POSITION_SIDE_UNSPECIFIED = 0;
  BINANCE_POSITION_SIDE_BOTH        = 1;
  BINANCE_POSITION_SIDE_LONG        = 2;
  BINANCE_POSITION_SIDE_SHORT       = 3;
}

// ════════════════════════════ 现货 ════════════════════════════

// 现货下单。`POST /api/v3/order`
message BinanceSpotNewOrder {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string             symbol           = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ]; // 交易对,如 BNBUSDT
  optional BinanceOrderSide   side             = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceSpotOrderType type           = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceTimeInForce time_in_force    = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 限价单必给;市价单不传
  optional string             quantity         = 5 [(hi.visibility) = VIS_PARTICIPANT]; // 按**标的数量**下单
  // 按**金额**下单(市价单专用,如"买 100 USDT 的 BNB")。与 quantity 二选一,
  // 两个都给或都不给由币安报错 —— 我们不替它判,也不替它猜。
  optional string             quote_order_qty  = 6 [(hi.visibility) = VIS_PARTICIPANT];
  optional string             price            = 7 [(hi.visibility) = VIS_PARTICIPANT]; // 限价单必给
  // **按百分比**下单(十进制字符串,0 < p ≤ 100,如 "25")。与 quantity / quote_order_qty 三选一。
  //
  // 由**机器人**换算成数量 —— 下指令的一方不知道每台的余额,一条群指令里各台余额也不同:
  //   · 买(BUY):可用的**计价币**(如 USDT)× p%
  //   · 卖(SELL):可用的**标的币**(如 BNB)× p% —— 基数是持币,不是账户金额
  // 换算后按交易对的步长**向下取整**;不够最小下单量就不下,回一句为什么。
  optional string             percent          = 8 [(hi.visibility) = VIS_PARTICIPANT];
  // 触发价(STOP_LOSS / STOP_LOSS_LIMIT / TAKE_PROFIT / TAKE_PROFIT_LIMIT)。与 trailing_delta 至少给一个。
  optional string             stop_price       = 9 [(hi.visibility) = VIS_PARTICIPANT];
  // 跟踪止损的回撤幅度,单位 **BIPS**(万分之一,100 = 1%)。给了就是跟踪单;与 stop_price 同给时,到了 stop_price 才开始跟踪。
  optional uint32             trailing_delta   = 10 [(hi.visibility) = VIS_PARTICIPANT];
}

// 现货撤单。`DELETE /api/v3/order`
// `order_id` 与 `orig_client_order_id` 给一个即可(都不给由币安报错)。
message BinanceSpotCancelOrder {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string symbol                = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  optional int64  order_id              = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 币安的订单号
  optional string orig_client_order_id  = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 下单时那条指令消息的 uuid
}

// 现货撤掉某个交易对的全部挂单。`DELETE /api/v3/openOrders`
// ⚠️ **symbol 必填** —— 币安这个接口本来就要求指定交易对,不存在"一把全撤"。
message BinanceSpotCancelAllOrders {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string symbol = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
}

// 现货当前挂单。`GET /api/v3/openOrders`
message BinanceSpotOpenOrders {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string symbol = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 不传 = 全部交易对(权重高,币安会降速)
}

// 现货账户。`GET /api/v3/account`
message BinanceSpotAccount {
  option (hi.audience) = VIS_PARTICIPANT;
  optional bool omit_zero_balances = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 不传 = 连零余额一起回(几百条)
}

// 查一张现货订单。`GET /api/v3/order`
// `order_id` 与 `orig_client_order_id` 给一个即可(都不给由币安报错)。
message BinanceSpotGetOrder {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string symbol               = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  optional int64  order_id             = 2 [(hi.visibility) = VIS_PARTICIPANT];
  optional string orig_client_order_id = 3 [(hi.visibility) = VIS_PARTICIPANT];
}

// 现货的 OCO 挂单组。`GET /api/v3/openOrderList`
// **没有参数**:它回的是整个账户的挂单组。
message BinanceSpotOpenOrderLists {
  option (hi.audience) = VIS_PARTICIPANT;
}

// 现货 24 小时行情。`GET /api/v3/ticker/24hr`
// ⚠️ **这是公开接口,不签名** —— 但照样走桥(机器人连不上币安)。
// 不传 symbol 会把全市场一次回来,权重很高,面板上只该按需要的交易对问。
message BinanceSpotTicker24h {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string symbol = 1 [(hi.visibility) = VIS_PARTICIPANT];
}

// ──────────────── 现货组合单(Order list) ────────────────
//
// 一次提交几张彼此牵连的单(币安叫 order list)。五种:
//
// | 操作 | 意思 |
// |---|---|
// | OCO | 两张单**成交一张、撤掉另一张** —— 止盈和止损一起挂,就是它 |
// | OTO | 先挂一张(working),**它成交后**才挂上第二张(pending)—— 买入成交后自动挂止损 |
// | OTOCO | 先挂一张,成交后挂上一对 OCO —— 买入成交后同时挂止盈止损 |
// | OPO | 同 OTO,但第二张的数量**跟第一张实际成交的量走**(不单独给) |
// | OPOCO | 同 OTOCO,数量跟第一张实际成交的量走 |
//
// 撤单是撤整组(`spot.delete_order_list`);挂着的组合单用 `spot.get_open_order_lists` 查。
// 组合单**不支持按百分比**:几张单共用一个数量又各有价格,换算口径说不清 —— 数量照实给。

// OCO 里的一张(上方 / 下方),或 OTOCO / OPO / OPOCO 里后挂的那张。方向与数量在组合单那一层给。
//
// 上方(above)能用:STOP_LOSS_LIMIT / STOP_LOSS / LIMIT_MAKER / TAKE_PROFIT / TAKE_PROFIT_LIMIT;
// 下方(below)能用:STOP_LOSS / STOP_LOSS_LIMIT / TAKE_PROFIT / TAKE_PROFIT_LIMIT。
// OPO 的后一张另外还能用 LIMIT / MARKET。取值不对由币安拒,我们不替它判。
message BinanceSpotListLeg {
  option (hi.audience) = VIS_PARTICIPANT;
  optional BinanceSpotOrderType type           = 1 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional string               price          = 2 [(hi.visibility) = VIS_PARTICIPANT]; // *_LIMIT / LIMIT_MAKER 的限价
  optional string               stop_price     = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 触发价
  optional uint32               trailing_delta = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 跟踪幅度(BIPS)
  optional BinanceTimeInForce   time_in_force  = 5 [(hi.visibility) = VIS_PARTICIPANT]; // *_LIMIT 必给
}

// OTO / OTOCO / OPO / OPOCO 里**先挂的那张**(working)。只能是 LIMIT 或 LIMIT_MAKER,要给 price 与 quantity。
message BinanceSpotWorkingOrder {
  option (hi.audience) = VIS_PARTICIPANT;
  optional BinanceSpotOrderType type          = 1 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide     side          = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional string               price         = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional string               quantity      = 4 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceTimeInForce   time_in_force = 5 [(hi.visibility) = VIS_PARTICIPANT];
}

// OCO:止盈止损一起挂。`POST /api/v3/orderList/oco`
// 卖出:上方 = 止盈(LIMIT_MAKER / TAKE_PROFIT*)价高于现价,下方 = 止损(STOP_LOSS*)触发价低于现价。
message BinanceSpotOrderListOco {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string             symbol   = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide   side     = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional string             quantity = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ]; // 两张单共用
  BinanceSpotListLeg          above    = 4 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  BinanceSpotListLeg          below    = 5 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
}

// OTO:先挂一张,成交后挂上第二张。`POST /api/v3/orderList/oto`
message BinanceSpotOrderListOto {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string          symbol           = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  BinanceSpotWorkingOrder  working          = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide pending_side    = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional string          pending_quantity = 4 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  BinanceSpotListLeg       pending          = 5 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
}

// OTOCO:先挂一张,成交后挂上一对 OCO。`POST /api/v3/orderList/otoco`
message BinanceSpotOrderListOtoco {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string          symbol           = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  BinanceSpotWorkingOrder  working          = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide pending_side    = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional string          pending_quantity = 4 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  BinanceSpotListLeg       pending_above    = 5 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  BinanceSpotListLeg       pending_below    = 6 [(hi.visibility) = VIS_PARTICIPANT]; // 币安这里标的是可选
}

// OPO:同 OTO,第二张的数量跟第一张实际成交的量走。`POST /api/v3/orderList/opo`
message BinanceSpotOrderListOpo {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string          symbol       = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  BinanceSpotWorkingOrder  working      = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide pending_side = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  BinanceSpotListLeg       pending      = 4 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
}

