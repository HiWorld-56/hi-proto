// **与普通挂单是两张表** —— 只查 `openOrders` 的话,面板上会缺掉全部止盈止损单。
message BinanceFuturesOpenAlgoOrders {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string symbol = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 不传 = 全部
}

// 合约**策略委托**下单(止盈、止损、跟踪止损)。`POST /fapi/v1/algoOrder`,`algoType` 固定 CONDITIONAL(brain 填)。
// 类型与各自要给的字段见 `BinanceFuturesAlgoOrderType`。
//
// ⚠️ 这是**条件单**:下单成功只是挂上了,**触发时**才真正下出去;挂着的在 `open_algo_orders` 里查,不在普通挂单里。
message BinanceFuturesNewAlgoOrder {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string                      symbol         = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide            side           = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceFuturesAlgoOrderType type           = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinancePositionSide         position_side  = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 不传 = BOTH
  optional BinanceTimeInForce          time_in_force  = 5 [(hi.visibility) = VIS_PARTICIPANT]; // STOP / TAKE_PROFIT(限价)用
  optional string                      quantity       = 6 [(hi.visibility) = VIS_PARTICIPANT]; // 与 close_position 不能同给
  optional string                      price          = 7 [(hi.visibility) = VIS_PARTICIPANT]; // STOP / TAKE_PROFIT 触发后的限价
  optional string                      trigger_price  = 8 [(hi.visibility) = VIS_PARTICIPANT]; // 触发价
  optional BinanceWorkingType          working_type   = 9 [(hi.visibility) = VIS_PARTICIPANT];
  // 触发时**平掉这个方向的全部仓位**(只用于 STOP_MARKET / TAKE_PROFIT_MARKET)。给了就不能给 quantity。
  optional bool                        close_position = 10 [(hi.visibility) = VIS_PARTICIPANT];
  // 价格保护:触发时标记价与最新价偏离过大就不触发。
  optional bool                        price_protect  = 11 [(hi.visibility) = VIS_PARTICIPANT];
  // 只减仓(双向持仓模式下币安不收)。止盈止损单一般都该带上,免得触发时反向开出新仓。
  optional bool                        reduce_only    = 12 [(hi.visibility) = VIS_PARTICIPANT];
  optional string                      activate_price = 13 [(hi.visibility) = VIS_PARTICIPANT]; // 跟踪止损的激活价
  optional string                      callback_rate  = 14 [(hi.visibility) = VIS_PARTICIPANT]; // 跟踪止损的回调比例(%),0.1–10
  // **按百分比**(十进制字符串,0 < p ≤ 100)。与 quantity / close_position 三选一;口径同 `BinanceFuturesNewOrder.percent`,
  // 换算用的价格:有 price 用 price,否则用 trigger_price,都没有用标记价格。
  optional string                      percent        = 15 [(hi.visibility) = VIS_PARTICIPANT];
  // 杠杆(倍数),含义同 BinanceFuturesNewOrder.leverage:给了就先设好这个交易对的杠杆,再挂这张条件单。
  optional uint32                      leverage       = 16 [(hi.visibility) = VIS_PARTICIPANT];
}

