// ════════════════════ U 本位合约(USDⓈ-M) ════════════════════

// 合约下单。`POST /fapi/v1/order`
//
// ⚠️ **平仓不是一个单独的接口** —— 它就是一张 `reduce_only = true` 的反向市价单。
//    桌面版的「一键平仓」= 先查持仓,再逐个下这样的单。
message BinanceFuturesNewOrder {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string              symbol        = 1 [
    (buf.validate.field).string.pattern = "^[A-Z0-9]+$",
    (buf.validate.field).required       = true,
    (hi.visibility)                     = VIS_PARTICIPANT
  ];
  optional BinanceOrderSide    side          = 2 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinanceOrderType    type          = 3 [
    (buf.validate.field).required = true,
    (hi.visibility)               = VIS_PARTICIPANT
  ];
  optional BinancePositionSide position_side = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 不传 = BOTH(单向持仓)
  optional BinanceTimeInForce  time_in_force = 5 [(hi.visibility) = VIS_PARTICIPANT]; // 限价单必给
  optional string              quantity      = 6 [(hi.visibility) = VIS_PARTICIPANT];
  optional string              price         = 7 [(hi.visibility) = VIS_PARTICIPANT]; // 限价单必给
  // 只减仓:这张单只能让持仓变小,不会反向开出新仓。**平仓就靠它**。
  // ⚠️ 双向持仓模式(position_side = LONG / SHORT)下币安不收这个参数,给了会报错。
  optional bool                reduce_only   = 8 [(hi.visibility) = VIS_PARTICIPANT];
  // **按百分比**下单(十进制字符串,0 < p ≤ 100,如 "25")。与 quantity 二选一。
  //
  // 由**机器人**换算成数量(下指令的一方不知道每台的余额):
  //   · 开仓:可用保证金 × p% **当保证金**,仓位 = 它 × 当前杠杆,再按价格折成数量
  //     (限价单用给的 price,市价单用标记价格)
  //   · 平仓(reduce_only,或双向持仓里 LONG+SELL / SHORT+BUY):**当前持仓数量** × p%
  // 换算后按交易对的步长**向下取整**;不够最小下单量就不下,回一句为什么。
  optional string              percent       = 9 [(hi.visibility) = VIS_PARTICIPANT];
  // 杠杆(倍数)。给了:机器人**先把这个交易对的杠杆设成它,再下单**(按比例开仓也按新杠杆换算)。
  // 币安的杠杆是按交易对分别设的,原来「设杠杆」和「下单」是两个动作,漏点一个就按旧杠杆开仓(2026-09-27 用户反馈)。
  optional uint32              leverage      = 10 [(hi.visibility) = VIS_PARTICIPANT];
}

