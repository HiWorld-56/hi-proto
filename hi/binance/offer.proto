syntax = "proto3";

package hi.binance;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/binance";

import "hi/common.proto";
import "hi/binance/binance.proto";
import "hi/binance/signal.proto";
import "hi/options.proto";

// **开单卡**:跟单方机器人收到一笔开单信号(`BinanceSignal` 里的 `BinanceOpen`)后算出的一张卡 ——
// 信号源开了什么 + 我们打算开什么。人点「确认」才下单。卡在机器人本地落库,**从收到那一刻起只留 15 分钟**。
//
// 同一张卡出现在两处,状态只在机器人那一份:
//   · 机器人屏幕:`hi.ninja.BrainToFace.binance_offers`(全量列表),人点了回 `FaceToBrain.binance_offer_reply`。
//   · 主人的 app:机器人给**主人**发单聊消息 `Content.binance_offer`(新卡、状态变了、主人要求转发时都发一条);
//     主人点了回一条 `Content.binance_offer_reply`。**只认主人**(信封 from;判据在币安插件),不经过模型。
//
// app 按 `id` 把同一张卡的几条消息叠成一张,**状态只升不降**:
// PENDING < EXECUTING < (DONE | CANCELED | EXPIRED);已过 `expires_at` 还是 PENDING 的,自己显示已过期。
//
// ## 两种卡(2026-10-23)
//
// · **开单卡**(`open` 有值):信号源市价开了一笔仓(压过 5 分钟、还赚),我们按比例市价开。DONE = 下完了。
// · **跟挂卡**(`pending` 有值):信号源挂了一张开仓挂单(限价 / 条件单),我们按比例挂同价、同条件的单。
//   DONE = **挂上了**(不是成交了);之后成交、被信号源撤单自动撤掉,都不改这张卡(卡 15 分钟就过期了),另给主人发一句话。
//   信号源在我们确认之前撤了单 → 这张卡 CANCELED(屏幕上拿掉,主人的聊天卡片显示已取消)。

message BinanceOffer {
  option (hi.audience) = VIS_PARTICIPANT;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING     = 1; // 等人点
    STATE_EXECUTING   = 2; // 点了确认,正在下单
    STATE_DONE        = 3; // 下完了,结果在 result(成败看 result.http_status / error);留在屏幕列表里给人看,
                           // 人点「关闭」(face 发 BinanceOfferReply confirm=false)就从屏幕列表里拿掉(brain 落库,重启后也不再推),
                           // 没点就到期一起拿掉
    STATE_CANCELED    = 4; // 人点了取消(屏幕或主人的 app)。只出现在聊天卡片里 —— 屏幕列表里取消的直接拿掉
    STATE_EXPIRED     = 5; // 15 分钟没人处理,放弃了。同上,只出现在聊天卡片里
  }
  optional string            id          = 1 [(hi.visibility) = VIS_PARTICIPANT]; // brain 给的卡号;回复时原样带回
  optional hi.Entity         source      = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 信号源机器人(did + 名字)
  optional BinanceOpen open   = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 开单卡:信号源开了什么(与 `pending` 二选一)
  optional BinanceOfferPlan  plan        = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 我们打算开什么
  optional int64             received_at = 5 [(hi.visibility) = VIS_PARTICIPANT]; // 本机收到的时刻,绝对微秒
  optional int64             expires_at  = 6 [(hi.visibility) = VIS_PARTICIPANT]; // = received_at + 15 分钟,绝对微秒;face / app 按它倒计时,过了自己显示已过期
  optional State             state       = 7 [(hi.visibility) = VIS_PARTICIPANT];
  optional BinanceResult result = 8 [(hi.visibility) = VIS_PARTICIPANT]; // STATE_DONE 时带:下单的原样结果
  // STATE_DONE 且开仓成功时带:自动止盈止损做了什么。不带 = 这张卡没走到这一步(开仓失败,或机器人版本还没有这个功能)。
  optional BinanceOfferTpsl tpsl = 9 [(hi.visibility) = VIS_PARTICIPANT];
  optional BinancePending pending = 10 [(hi.visibility) = VIS_PARTICIPANT]; // 跟挂卡:信号源挂了什么(与 `open` 二选一)
}

// 我们打算开的那一单。保证金 / 数量 / 参考价由 brain 在收到时按**与下单同一条换算**算出(按交易对的
// 步长、价格精度取整,下单时也就是这个数);点确认时 brain 按当时的价格与余额重算再下,行情不动就是同一个数。
message BinanceOfferPlan {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string op       = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 操作名,如 `usds_futures.new_order`
  optional string symbol   = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 实际下单的交易对(现货 = 币 + USDT)
  optional BinanceOrderSide    side          = 3 [(hi.visibility) = VIS_PARTICIPANT];
  optional BinancePositionSide position_side = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 合约:LONG / SHORT
  optional uint32 leverage = 5 [(hi.visibility) = VIS_PARTICIPANT]; // 合约
  optional string ratio    = 6 [(hi.visibility) = VIS_PARTICIPANT]; // 占本机总资金的比例(十进制小数)
  optional string margin   = 7 [(hi.visibility) = VIS_PARTICIPANT]; // 保证金(合约 = 数量 × 参考价 ÷ 杠杆)/ 金额(现货),计价币,两位小数
  optional string quantity = 8 [(hi.visibility) = VIS_PARTICIPANT]; // 数量,按步长向下取整、写到步长那一位;现货市价买按金额下,这是按参考价折的
  optional string price    = 9 [(hi.visibility) = VIS_PARTICIPANT]; // 参考价(合约标记价、现货最新价),写到价格精度那一位
  optional string shortfall = 10 [(hi.visibility) = VIS_PARTICIPANT]; // 按本机资金下不了这一单的原因(一句话);带了 face 就不给确认按钮,只能取消

  // ── 自动止盈止损(2026-10-23 用户定;开单卡上一个**默认勾选**的「自动设置止盈止损」)──
  //
  // 口径(只在币安插件出计划单那一处):R = 主人设的风险承受率(`BinanceRoi.risk_tolerance`)。
  //   · 止损 = 这一笔亏到它保证金的 R%:合约按收益率 −R%(价格反向 R% ÷ 杠杆);现货按价格下跌 R%。
  //   · 止盈 = 盈亏比 2:1:合约收益率 +2R%;现货价格上涨 2R%。
  // 合约挂的是**整仓**止盈止损(同币安 App 持仓上的「止盈止损」),触发价按**成交后的开仓均价**现算;
  // 开单前这个方向已有仓位就不挂(整仓单会盖到原有仓位)。现货在市价买入成交后,按实际买到的数量挂一对 OCO 卖单
  // (涨到止盈价限价卖、跌到止损价止损卖),只管这次买到的,不碰原有的币。
  //
  // **能不能自动设只看 `tpsl_unavailable`**:带了就不能(face / app 把勾选框置灰、写这句话),带 auto_tpsl 也不设。
  // 没设风险承受率时两个百分比都不带;这个方向已有仓位时百分比照带(给人看),但 `tpsl_unavailable` 也带。
  optional string stop_loss_pct     = 11 [(hi.visibility) = VIS_PARTICIPANT]; // 十进制,不带 %(如 "30")
  optional string take_profit_pct   = 12 [(hi.visibility) = VIS_PARTICIPANT];
  // 估算的触发价:按 `price`(参考价)算、对齐价格精度。真正挂的按成交后的开仓均价(现货:成交均价)重算,行情动了会差一点。
  optional string stop_loss_price   = 13 [(hi.visibility) = VIS_PARTICIPANT];
  optional string take_profit_price = 14 [(hi.visibility) = VIS_PARTICIPANT];
  optional string tpsl_unavailable  = 15 [(hi.visibility) = VIS_PARTICIPANT]; // 不能自动设的原因(一句话):没设风险承受率 / 这个方向已有仓位

  // ── 跟挂卡(2026-10-23)── 我们打算挂的那一单;开单卡(市价)不带这几个。
  // 跟挂卡上的自动止盈止损:**成交后**才挂(跟单方轮询自己挂的那张单),估算价按挂单价(没有就按触发价)算。
  optional string order_type    = 16 [(hi.visibility) = VIS_PARTICIPANT]; // 币安的单型原名,如 LIMIT、STOP_MARKET、TAKE_PROFIT_LIMIT、TRAILING_STOP_MARKET
  optional string limit_price   = 17 [(hi.visibility) = VIS_PARTICIPANT]; // 限价(限价单、*_LIMIT、STOP / TAKE_PROFIT);市价触发的不带
  optional string trigger_price = 18 [(hi.visibility) = VIS_PARTICIPANT]; // 触发价(条件单);限价单不带
  optional string callback_rate = 19 [(hi.visibility) = VIS_PARTICIPANT]; // 跟踪止损的回调幅度(%);只有 TRAILING_STOP_MARKET 带
}

// 自动止盈止损的结果(`BinanceOffer.tpsl`)。
message BinanceOfferTpsl {
  option (hi.audience) = VIS_PARTICIPANT;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_SET         = 1; // 止盈、止损都挂上了(价格在下面两个字段)
    STATE_OFF         = 2; // 人没勾「自动设置止盈止损」
    STATE_SKIPPED     = 3; // 没挂:没设风险承受率 / 这个方向开单前已有仓位(原因在 reason)
    STATE_FAILED      = 4; // 仓开成了,止盈止损没挂上或只挂上一条(原因在 reason)—— **这个仓位可能没有止损**,界面要显眼
    STATE_WAITING     = 5; // 跟挂卡:单挂上了、还没成交。之后有了下文(成交后挂上 / 没挂上、没成交就没了、信号源撤单自动撤掉),机器人把这张卡的 tpsl 改成 SET / FAILED / SKIPPED 再推一次,并另给主人发一句话
  }
  optional State  state             = 1 [(hi.visibility) = VIS_PARTICIPANT];
  optional string stop_loss_price   = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 实际挂上的止损触发价
  optional string take_profit_price = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 实际挂上的止盈价(合约:触发价;现货:限价)
  optional string reason            = 4 [(hi.visibility) = VIS_PARTICIPANT]; // SKIPPED / FAILED 时的原因,一句话
  optional string warning           = 5 [(hi.visibility) = VIS_PARTICIPANT]; // 挂上了但要提醒的(如止损价在爆仓价之外,可能先爆仓)
}

message BinanceOfferReply {
  option (hi.audience) = VIS_PARTICIPANT;
  optional string id      = 1 [(hi.visibility) = VIS_PARTICIPANT]; // BinanceOffer.id
  // **必传**。true = 确认开单(只认 STATE_PENDING)。
  // false = 这张卡我不要了:STATE_PENDING → 取消(不下单);STATE_DONE → 从列表里拿掉(落库,重启后也不再推);
  // STATE_EXECUTING → 不理(正在下的单收不回来,下完照常变 STATE_DONE 给人看)
  optional bool   confirm = 2 [(hi.visibility) = VIS_PARTICIPANT];
  // 只在 confirm = true 时看:开仓后要不要自动设置止盈止损。**不带 = 要**(卡上默认勾选;老版本 app 回复里没有这一项)。
  // 计划单带了 `tpsl_unavailable` 时,带 true 也不设(结果 STATE_SKIPPED)。
  optional bool   auto_tpsl = 3 [(hi.visibility) = VIS_PARTICIPANT];
}
