syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/club/messaging.proto";
import "hi/club/group.proto";
import "hi/options.proto";

message UserInfo {
  option (hi.audience) = VIS_SELF; // 本人视图:含 permissions/verify_policy 私有字段,故 SELF
  hi.Entity       base          = 1 [(hi.visibility) = VIS_PUBLIC];      // 名片 name/avatar
  repeated string permissions   = 2 [(hi.visibility) = VIS_SELF];        // 我的权限列表(SELF)
  optional string verify_policy = 3 [(hi.visibility) = VIS_SELF];        // 加好友校验方式(私有,SELF)
  optional string moment        = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 用户动态(关系可见)
}

// 我的单聊通知历史,按时间线增量拉(用法照 `Group.ListMessages`)。
//
// ⚠️ **后端不判断"新不新"、不按状态或类型筛** —— 30 天内的全部通知按时间顺序原样返回,
// 新不新、要不要处理由端上自己判断(见 hi/club/messaging.proto 里 status 那段)。
// 这里原来是 `ListSystemMessages`:后端写死只返回好友/入群邀请两种、还替端上算 `has_new`
// (读一次就改掉,多台设备谁先拉谁把"新"吃掉),于是离线期间的 friend-add 永远补不回来。
message ListNoticesReq {
  optional string last_uuid = 1; // 上一页最后一条的 uuid;不传 = 从最早一条开始
}

message ListNoticesResp {
  option (hi.audience) = VIS_SELF; // 我的通知
  repeated Notice list = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 按时间正序;空 = 已经拉到头
}

// 按 uuid 查这几条通知**现在**的状态。端上把本地没处理完的那些发上来(定期 + 下拉刷新),
// 别的设备处理过、或者已经过期的,在这里拿到新状态。
message ListNoticeStatusesReq {
  repeated string uuids = 1;
}

message NoticeStatus {
  option (hi.audience) = VIS_SELF;
  optional string uuid   = 1 [(hi.visibility) = VIS_SELF];
  optional string status = 2 [(hi.visibility) = VIS_SELF]; // 取值见 hi/club/messaging.proto 里 status 那段
}

message ListNoticeStatusesResp {
  option (hi.audience) = VIS_SELF;
  repeated NoticeStatus list = 1 [(hi.visibility) = VIS_SELF]; // 查不到的 uuid(不是我的 / 超过 30 天)不返回
}

// 对邀请(好友 / 入群)做决定。uuid 就是那条邀请通知的 uuid。
message HandleNoticeReq {
  optional string uuid   = 1 [(buf.validate.field).required = true];
  optional bool   accept = 2 [(buf.validate.field).required = true]; // true = 同意,false = 拒绝
}

// 通知回执:**我处理完这条通知了**。与 HandleNotice 不是一回事 ——
// 后者是"我对邀请做决定"(accept/reject,带真加好友/真入群的副作用),
// 这里只是"这条我消费过了",没有任何业务副作用,对**任何**需要端上处理的通知都适用。
// 以通知 uuid 为唯一标识,所以不用按类型各写一个接口。
message MarkNoticeProcessedReq {
  optional string uuid = 1;
}

message RelationInfo {
  option (hi.audience) = VIS_SELF; // 我的关系视图:含仅本人可见的 remark,故 SELF(见 report)
  hi.Entity       base   = 1 [(hi.visibility) = VIS_PUBLIC];      // 名片
  optional string remark = 2 [(hi.visibility) = VIS_SELF];        // 备注名(仅设置者本人可见)
  optional string moment = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 用户动态(关系可见)
}

// 一次拿全我的关系:好友 + 仆从 + 我的主人。
// (已删按关系拆开的 ListFriends/ListServitors —— 它们重叠,而且各打一次同一个 rpc。)
message ListRelationsResp {
  option (hi.audience) = VIS_SELF; // 我的好友+仆从列表(RelationInfo=SELF,含私有备注)
  repeated RelationInfo friend   = 1 [(hi.visibility) = VIS_SELF]; // 好友(friend 关系)
  repeated RelationInfo servitor = 2 [(hi.visibility) = VIS_SELF]; // 仆从(master 关系,人或 agent)
  // 🔴 **我的主人。至多一个**(`hi_chat_relation` 每对实体只有一行,kind 要么 friend
  //    要么 master),没有就不带这个字段。人通常没有主人,机器人有。
  //
  //    为什么单独一个字段、而不是塞进上面两半:那两半是「我的好友」和「我的**仆从**」,
  //    主人哪一半都不是 —— 漏掉它的后果是实打实的:消费方(core)判单聊"关系还在不在"
  //    用的就是这两半,于是**机器人的主人那个聊天窗每次刷新都被标成"关系已解除"**,
  //    再往下就是"两周后自动清掉和主人的全部聊天记录"(2026-09-12 在 .66 实测到)。
  optional RelationInfo master = 3 [(hi.visibility) = VIS_SELF];
}

message AddFriendReq {
  string          did  = 1;
  optional string type = 2;
}

// AddFriend 的结果。**五种都是"关系现在处于什么状态",不是"调用出了问题"** ——
// 所以它们一律走 status,不走 error。
//
// 🔴 `ALREADY_FRIEND` / `PENDING_EXISTS` 原来是以 error 形式回的(而且 service 层还用
//    裸 `fmt.Errorf` 把哨兵丢了,最终落成 `Internal: 添加好友失败`)。那是错的:
//    "早就是好友了"和"上次申请还没被处理"都是**本来就会发生**的正常结果,调用方要据此
//    决定下一步(直接发消息 / 继续等),而不是把它当故障重试或报给用户。
//    错误留给真正的非预期:对方不存在、库挂了、没权限。
enum FriendRequestStatus {
  FRIEND_REQUEST_STATUS_UNSPECIFIED    = 0; // 未设置
  FRIEND_REQUEST_STATUS_REJECTED       = 1; // 对方设了自动拒绝,这次申请当场被拒
  FRIEND_REQUEST_STATUS_SENT           = 2; // 申请已发出,等对方处理
  FRIEND_REQUEST_STATUS_ADDED          = 3; // 已是好友(对方自动同意 / 软件机器人免验证)
  FRIEND_REQUEST_STATUS_ALREADY_FRIEND = 4; // 早就是好友了(含主从关系),什么都没做
  FRIEND_REQUEST_STATUS_PENDING_EXISTS = 5; // 上一次的申请还没被处理,这次不重复发
}

message AddFriendResp {
  option (hi.audience) = VIS_PARTICIPANT; // 好友申请结果(关系状态)
  optional FriendRequestStatus status = 1 [(hi.visibility) = VIS_PARTICIPANT];
}

message DeleteFriendReq {
  string did = 1;
}

message ListGroupsResp {
  option (hi.audience) = VIS_SELF; // "我加入了哪些群"是跨群的本人成员身份聚合,仅本人可枚举
  repeated GroupBase list = 1 [(hi.visibility) = VIS_PUBLIC]; // 每个 GroupBase 本身公开(GroupBase=PUBLIC)
}

message GetUserReq {
  string did = 1;
}

// 改自己的资料。**不收 hi.Entity 整体** —— Entity 带 did/type/update,
// 而"改谁"永远取自 token,type/update 是服务端产物。入参只放调用方真正该给的。
message UpdateUserReq {
  optional string name          = 1; // 昵称
  optional string avatar        = 4; // 头像 url
  // auto_reject-自动拒绝
  // manual_accept-手动同意
  // auto_accept-自动同意
  optional string verify_policy = 2; // 添加好友校验方式
  optional string moment        = 3; // 用户动态
}

message SetRemarkReq {
  optional string user   = 1; // 被备注的用户did
  optional string remark = 2; // 备注名
}

message ListOnlineUsersReq {
  repeated string users = 1; // 用户did列表
}

message ListOnlineUsersResp {
  option (hi.audience) = VIS_PUBLIC; // 在线用户目录(公开,Entity 名片)
  repeated hi.Entity list = 1 [(hi.visibility) = VIS_PUBLIC]; // 在线的用户列表(Entity=PUBLIC)
}

service User {
  // 头像与日志的上传口都已搬到 `Source`(UploadAvatar / UploadLog),此处不再有。
  rpc GetCurrent (google.protobuf.Empty) returns (UserInfo) { option (hi.auth) = AUTH_USER; } // 当前用户信息(原 GetCurrentUser 去 stutter)
  // 更新用户信息。**返回更新后的完整资料**(原先返 Empty)。
  //
  // 为什么要回:`base.update` 是资料传播的唯一依据 —— 我发消息时 message.from 带着它,
  // 收信方按它比时间戳决定要不要刷本地缓存(惰性传播,见 hi/club/messaging.proto)。
  // 这个时间戳的权威在服务端;客户端自己造一个,与服务端那份就是两个时钟,会**倒退**
  // (实测差 0.6s:客户端微秒 vs 服务端整秒)。写完顺手回权威值,调用方不必再多一次
  // GetCurrent,也避免中间被自己的另一个端插一手、拿回不一致的资料。
  rpc Update (UpdateUserReq) returns (UserInfo) { option (hi.auth) = AUTH_USER; } // 更新用户信息(原 UpdateUser 去 stutter)
  // 通知是历史记录:后端只记录、不删,也不替端上算未读 —— 所以没有删除接口、没有未读计数接口,
  // 清理本地通知是端上(core)自己的事。
  rpc ListNotices (ListNoticesReq) returns (ListNoticesResp) { option (hi.auth) = AUTH_USER; } // 我的通知历史(增量)
  rpc ListNoticeStatuses (ListNoticeStatusesReq) returns (ListNoticeStatusesResp) { option (hi.auth) = AUTH_USER; } // 按 uuid 查通知的最新状态
  rpc HandleNotice (HandleNoticeReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 对邀请做决定(同意/拒绝);已过期的一律拒绝
  rpc MarkNoticeProcessed (MarkNoticeProcessedReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 通知回执:这条我处理完了(通用,按 uuid)
  rpc ListRelations (google.protobuf.Empty) returns (ListRelationsResp) { option (hi.auth) = AUTH_USER; } // 一次拿好友+仆从(同表;原 ListFriends/ListServitors 已合并进来)
  rpc AddFriend (AddFriendReq) returns (AddFriendResp) { option (hi.auth) = AUTH_USER; } // 添加好友
  rpc DeleteFriend (DeleteFriendReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 删除好友
  rpc ListGroups (google.protobuf.Empty) returns (ListGroupsResp) { option (hi.auth) = AUTH_USER; } // 当前用户所在的群列表
  rpc GetOther (GetUserReq) returns (hi.Entity) { option (hi.auth) = AUTH_USER; } // 根据DID获取用户基本信息
  rpc SetRemark (SetRemarkReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }
}

// 在线用户目录(**公开**)。与 User(用户自服务)主体不同,故拆 service ——
// User 里每个方法都是"我对我自己"(改我的资料、我的好友、我的系统消息),
// 而这里是"查一批 did 谁在线",跟调用者是谁毫无关系,实现里也用不到调用者身份。
//
// 对称范式:机器人那侧早就是 AgentDirectory.ListOnline(AUTH_NONE)。
// 原先它挂在 User 下、标 AUTH_USER,而返回体的 audience 一直写着 VIS_PUBLIC、
// 注释也写着"公开" —— 档位与数据定级自相矛盾。presence 本就是公开信息。
service UserDirectory {
  rpc ListOnline (ListOnlineUsersReq) returns (ListOnlineUsersResp) { option (hi.auth) = AUTH_NONE; } // 公开:在线用户(传 did 列表,返在线的那些)
}
