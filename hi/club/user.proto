syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/club/messaging.proto";
import "hi/club/group.proto";
import "hi/options.proto";

message UserInfo {
  option (hi.audience) = VIS_SELF; // 本人视图:含 permissions/verify_policy 私有字段,故 SELF
  hi.Entity       base          = 1 [(hi.visibility) = VIS_PUBLIC];      // 名片 name/avatar
  repeated string permissions   = 2 [(hi.visibility) = VIS_SELF];        // 我的权限列表(SELF)
  string          verify_policy = 3 [(hi.visibility) = VIS_SELF];        // 加好友校验方式(私有,SELF)
  string          moment        = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 用户动态(关系可见)
}

message ListSystemMessagesReq {
  string        status     = 1;
  hi.Pagination pagination = 2;
}

message SystemMessages {
  option (hi.audience) = VIS_SELF; // 我的系统消息
  bool            has_new = 1 [(hi.visibility) = VIS_SELF];
  int32           total   = 2 [(hi.visibility) = VIS_SELF];
  repeated Notice list    = 3 [(hi.visibility) = VIS_PARTICIPANT]; // Notice(messaging)为通知型,关系/群级
}

message DeleteSystemMessageReq {
  string uuid = 1;
}

message HandleSystemMessageReq {
  string uuid   = 1;
  string status = 2;
}

message RelationInfo {
  option (hi.audience) = VIS_SELF; // 我的关系视图:含仅本人可见的 remark,故 SELF(见 report)
  hi.Entity base   = 1 [(hi.visibility) = VIS_PUBLIC];      // 名片
  string    remark = 2 [(hi.visibility) = VIS_SELF];        // 备注名(仅设置者本人可见)
  string    moment = 3 [(hi.visibility) = VIS_PARTICIPANT]; // 用户动态(关系可见)
}

// 一次拿好友+仆从(同表,一次调用拿全);已删按关系拆开的 ListFriends/ListServitors(重叠)。
message ListRelationsResp {
  option (hi.audience) = VIS_SELF; // 我的好友+仆从列表(RelationInfo=SELF,含私有备注)
  repeated RelationInfo friend   = 1 [(hi.visibility) = VIS_SELF]; // 好友(friend 关系)
  repeated RelationInfo servitor = 2 [(hi.visibility) = VIS_SELF]; // 仆从(master 关系,人或 agent)
}

message AddFriendReq {
  string did  = 1;
  string type = 2;
}

enum FriendRequestStatus {
  FRIEND_REQUEST_STATUS_UNSPECIFIED = 0; // 未设置
  FRIEND_REQUEST_STATUS_REJECTED    = 1; // 好友申请拒绝
  FRIEND_REQUEST_STATUS_SENT        = 2; // 好友申请已发送
  FRIEND_REQUEST_STATUS_ADDED       = 3; // 好友添加成功
}

message AddFriendResp {
  option (hi.audience) = VIS_PARTICIPANT; // 好友申请结果(关系状态)
  FriendRequestStatus status = 1 [(hi.visibility) = VIS_PARTICIPANT];
}

message DeleteFriendReq {
  string did = 1;
}

message ListGroupsResp {
  option (hi.audience) = VIS_SELF; // "我加入了哪些群"是跨群的本人成员身份聚合,仅本人可枚举
  repeated GroupBase list = 1 [(hi.visibility) = VIS_PUBLIC]; // 每个 GroupBase 本身公开(GroupBase=PUBLIC)
}

message GetUserReq {
  string did = 1;
}

message UnprocessedSysMsgCountResp {
  option (hi.audience) = VIS_SELF; // 我的未读数
  int32 count = 1 [(hi.visibility) = VIS_SELF];
}

// 改自己的资料。**不收 hi.Entity 整体** —— Entity 带 did/type/update,
// 而"改谁"永远取自 token,type/update 是服务端产物。入参只放调用方真正该给的。
message UpdateUserReq {
  string name   = 1; // 昵称
  string avatar = 4; // 头像 url
  // auto_reject-自动拒绝
  // manual_accept-手动同意
  // auto_accept-自动同意
  string          verify_policy = 2; // 添加好友校验方式
  optional string moment        = 3; // 用户动态
}

message SetRemarkReq {
  string user   = 1; // 被备注的用户did
  string remark = 2; // 备注名
}

message ListOnlineUsersReq {
  repeated string users = 1; // 用户did列表
}

message ListOnlineUsersResp {
  option (hi.audience) = VIS_PUBLIC; // 在线用户目录(公开,Entity 名片)
  repeated hi.Entity list = 1 [(hi.visibility) = VIS_PUBLIC]; // 在线的用户列表(Entity=PUBLIC)
}

service User {
  // 头像与日志的上传口都已搬到 `Source`(UploadAvatar / UploadLog),此处不再有。
  rpc GetCurrent (google.protobuf.Empty) returns (UserInfo) { option (hi.auth) = AUTH_USER; } // 当前用户信息(原 GetCurrentUser 去 stutter)
  // 更新用户信息。**返回更新后的完整资料**(原先返 Empty)。
  //
  // 为什么要回:`base.update` 是资料传播的唯一依据 —— 我发消息时 message.from 带着它,
  // 收信方按它比时间戳决定要不要刷本地缓存(惰性传播,见 hi/club/messaging.proto)。
  // 这个时间戳的权威在服务端;客户端自己造一个,与服务端那份就是两个时钟,会**倒退**
  // (实测差 0.6s:客户端微秒 vs 服务端整秒)。写完顺手回权威值,调用方不必再多一次
  // GetCurrent,也避免中间被自己的另一个端插一手、拿回不一致的资料。
  rpc Update (UpdateUserReq) returns (UserInfo) { option (hi.auth) = AUTH_USER; } // 更新用户信息(原 UpdateUser 去 stutter)
  rpc ListSystemMessages (ListSystemMessagesReq) returns (SystemMessages) { option (hi.auth) = AUTH_USER; } // 系统消息列表
  rpc DeleteSystemMessage (DeleteSystemMessageReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 删除系统消息
  rpc DeleteAllSystemMessage (google.protobuf.Empty) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 删除所有系统消息
  rpc HandleSystemMessage (HandleSystemMessageReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 处理系统消息
  rpc ListRelations (google.protobuf.Empty) returns (ListRelationsResp) { option (hi.auth) = AUTH_USER; } // 一次拿好友+仆从(同表;原 ListFriends/ListServitors 已合并进来)
  rpc AddFriend (AddFriendReq) returns (AddFriendResp) { option (hi.auth) = AUTH_USER; } // 添加好友
  rpc DeleteFriend (DeleteFriendReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 删除好友
  rpc ListGroups (google.protobuf.Empty) returns (ListGroupsResp) { option (hi.auth) = AUTH_USER; } // 当前用户所在的群列表
  rpc GetOther (GetUserReq) returns (hi.Entity) { option (hi.auth) = AUTH_USER; } // 根据DID获取用户基本信息
  rpc UnprocessedSysMsgCount (google.protobuf.Empty) returns (UnprocessedSysMsgCountResp) { option (hi.auth) = AUTH_USER; }
  rpc SetRemark (SetRemarkReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }
}

// 在线用户目录(**公开**)。与 User(用户自服务)主体不同,故拆 service ——
// User 里每个方法都是"我对我自己"(改我的资料、我的好友、我的系统消息),
// 而这里是"查一批 did 谁在线",跟调用者是谁毫无关系,实现里也用不到调用者身份。
//
// 对称范式:机器人那侧早就是 AgentDirectory.ListOnline(AUTH_NONE)。
// 原先它挂在 User 下、标 AUTH_USER,而返回体的 audience 一直写着 VIS_PUBLIC、
// 注释也写着"公开" —— 档位与数据定级自相矛盾。presence 本就是公开信息。
service UserDirectory {
  rpc ListOnline (ListOnlineUsersReq) returns (ListOnlineUsersResp) { option (hi.auth) = AUTH_NONE; } // 公开:在线用户(传 did 列表,返在线的那些)
}
