syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// ── apikey(裁决 #6:apikey 是 hiclub 的东西,已从 did 迁来原生拥有)──────────────
// hiclub 给每个用户(人/软bot/硬bot)设 apikey,供外部**以该用户身份**调 hiclub 的**受限方法子集**。
// 与 token 的区别:apikey 能调的方法有限。用户 token 档 —— 用户管理自己(及自己名下 agent)的 apikey。
// (apikey→归属用户 的反查由 club 拦截器直接读库,不再走 RPC;原 did.ApiKey.Get 已随迁移删除。)

// apikey 是用户机密(value 可鉴权),只发给归属用户本人。
message ApiKeyInfo {
  option (hi.audience) = VIS_SELF;
  string user       = 1 [(hi.visibility) = VIS_SELF]; // 归属用户 did(人/软bot/硬bot)
  string value      = 2 [(hi.visibility) = VIS_SELF];
  string note       = 3 [(hi.visibility) = VIS_SELF];
  int64  created_at = 4 [(hi.visibility) = VIS_SELF];
}

message CreateApiKeyReq {
  string user = 1; // 给谁建(自己 / 自己名下的 agent;后端校验归属)
}

message CreateApiKeyResp {
  option (hi.audience) = VIS_SELF;
  ApiKeyInfo info = 1 [(hi.visibility) = VIS_SELF];
}

message EditApiKeyReq {
  string api_key = 1;
  string note    = 2;
}

message EditApiKeyResp {
  option (hi.audience) = VIS_SELF;
  ApiKeyInfo info = 1 [(hi.visibility) = VIS_SELF];
}

message ListApiKeysReq {
  string        user       = 1; // 列谁的(自己 / 自己名下的 agent)
  hi.Pagination pagination = 2;
}

message ListApiKeysResp {
  option (hi.audience) = VIS_SELF;
  int32               total = 1 [(hi.visibility) = VIS_SELF];
  repeated ApiKeyInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

message DeleteApiKeyReq {
  string api_key = 1;
}

service ApiKey {
  rpc Create (CreateApiKeyReq) returns (CreateApiKeyResp) { option (hi.auth) = AUTH_USER; }      // 给某用户/agent 生成 apikey
  rpc Edit (EditApiKeyReq) returns (EditApiKeyResp) { option (hi.auth) = AUTH_USER; }            // 改 apikey 备注
  rpc List (ListApiKeysReq) returns (ListApiKeysResp) { option (hi.auth) = AUTH_USER; }          // 列 apikey
  rpc Delete (DeleteApiKeyReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 删 apikey
}
