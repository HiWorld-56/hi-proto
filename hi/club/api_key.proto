syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/ai/api_key.proto";
import "hi/options.proto";

// ── apikey(裁决 #6:apikey 是 hiclub 的东西,已从 did 迁来原生拥有)──────────────
// hiclub 给每个用户(人/软bot/硬bot)设 apikey,供外部**以该用户身份**调 hiclub 的**受限方法子集**。
// 与 token 的区别:apikey 能调的方法有限。用户 token 档 —— 用户管理自己(及自己名下 agent)的 apikey。
// (apikey→归属用户 的反查由 club 拦截器直接读库,不再走 RPC;原 did.ApiKey.Get 已随迁移删除。)

// apikey 是用户机密(value 可鉴权),只发给归属用户本人。
message ApiKeyInfo {
  option (hi.audience) = VIS_SELF;
  optional string user       = 1 [(hi.visibility) = VIS_SELF]; // 归属用户 did(人/软bot/硬bot)
  optional string value      = 2 [(hi.visibility) = VIS_SELF];
  optional string note       = 3 [(hi.visibility) = VIS_SELF];
  optional int64  created_at = 4 [(hi.visibility) = VIS_SELF];
}

// ⚠️ **只有机器人能持 apikey** —— 原先设计里"人也能设 apikey",没必要,已废。
// 故这里是**机器人 did**。
//
// ⚠️ **归属校验一律走 CheckAgentAccess(机器人自己 / master / 超管),不是"只有 master"。**
// 这把 key 就是**机器人自己的身份**(插件拿它以机器人身份调 club),
// 而 hiclub 的理念里人和机器人对等 —— 机器人能自己建插件、自己买插件,
// 却建不了自己的身份凭据,说不通。
// 而且绝大多数硬件机器人**无主**,"只有 master 能建"对它们等于这条路不存在。
// (原先废掉 caller==target 的理由是"人不需要 key",顺手把机器人自己也挡了。)
message CreateApiKeyReq {
  optional string agent = 1; // 机器人 did;机器人自己 / 它的 master / 超管都能建
}

message CreateApiKeyResp {
  option (hi.audience) = VIS_SELF;
  ApiKeyInfo info = 1 [(hi.visibility) = VIS_SELF];
}

message EditApiKeyResp {
  option (hi.audience) = VIS_SELF;
  ApiKeyInfo info = 1 [(hi.visibility) = VIS_SELF];
}

message ListApiKeysReq {
  optional string agent      = 1; // 机器人 did;能查的只有它的 master
  hi.Pagination   pagination = 2;
}

message ListApiKeysResp {
  option (hi.audience) = VIS_SELF;
  optional int32      total = 1 [(hi.visibility) = VIS_SELF];
  repeated ApiKeyInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

message DeleteApiKeyReq {
  optional string api_key = 1;
}

// ⚠️ 入参 `EditApiKeyReq` **复用 hi.ai 的**(字段完全一致,club 只是门面)。
//    但 `ApiKeyInfo` / `ListApiKeysResp` **不复用** —— club 那份有意收窄
//    (不吐 rate_limit / is_active),形状看着像、内容不是一回事。
service ApiKey {
  rpc Create (CreateApiKeyReq) returns (CreateApiKeyResp) { option (hi.auth) = AUTH_USER; }      // 给自己名下的机器人生成 apikey(**只有机器人能持 apikey**,见文件头)
  // Edit/Delete 按 api_key 定位,**必须校验归属** —— 只有该机器人的 master 能改/删。
  // 已落地(handler 里 isMasterOf(调用者, apikey.user));新增同类方法要带同样的守卫。
  rpc Edit (hi.ai.EditApiKeyReq) returns (EditApiKeyResp) { option (hi.auth) = AUTH_USER; }            // 改 apikey 备注
  rpc List (ListApiKeysReq) returns (ListApiKeysResp) { option (hi.auth) = AUTH_USER; }          // 列 apikey
  rpc Delete (DeleteApiKeyReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 删 apikey
}
