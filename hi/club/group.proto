syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/club/messaging.proto";
import "hi/options.proto";

// 群信息。群类型(单聊/群)在 base.type;public/private 见 private 字段。
message GroupBase {
  hi.Entity base       = 1;
  string    background = 2;
  bool      private    = 3; // true=私密群(只能被邀请加入);false=公开群(可凭群 code 直接申请加入)
  bool      dnd        = 4; // **调用者自己**对该群的免打扰(新消息不震动),用户自设(SetDnd)
  int64     created_at = 5;
  int64     updated_at = 6;
}

message GroupMember {
  hi.Entity base  = 1;
  string    role  = 2; // owner / admin / member
  bool      muted = 3; // 是否被禁言(群主/管理员设;去写权限留读权限)
}

message GroupInfo {
  GroupBase            base = 1;
  repeated GroupMember list = 2;
}

message GetGroupReq {
  string code = 1;
}

// 创建群聊
message CreateGroupReq {
  string name = 1;
}

// 创建单聊
message CreateSingleReq {
  string did = 1;
}

// 组聊天消息列表参数
message ListGroupMessageReq {
  string last_uuid = 1;
  string code      = 2; // 群/单聊 code;群类型由后端按 code 查 GroupModel.group_type
}

message ListGroupMessageResp {
  repeated Packet list = 1;
}

message ListGroupMemberReq {
  string        code       = 1;
  hi.Pagination pagination = 2;
}

message GetGroupMemberTotalReq {
  string code = 1;
}

message GetGroupMemberTotalResp {
  int32 total = 1;
}

message InviteGroupReq {
  string          code    = 1;
  repeated string members = 2;
}

message JoinGroupReq {
  string code = 1; // 凭群 code 申请加入(仅公开群;私密群只能被邀请)
}

message QuitGroupReq {
  string code = 1;
}

message RemoveGroupReq {
  string          code    = 1;
  repeated string members = 2;
}

message SetRoleReq {
  string          code    = 1;
  repeated string members = 2;
  string          role    = 3; // admin=添加管理员 / member=取消管理员
}

message GetRoleReq {
  string code = 1;
}

message GetRoleResp {
  string role = 1;
}

// 免打扰(调用者自己):新消息不震动手机。用户自设,非管理操作。
message SetDndReq {
  string code = 1;
  bool   dnd  = 2;
}

// 禁言/解禁成员(群主/管理员):被禁言者去写权限、留读权限(后端移 group:wracl、加 group:racl)。
message MuteMembersReq {
  string          code    = 1;
  repeated string members = 2;
  bool            muted   = 3; // true=禁言,false=解禁
}

// 群(主体=群)。用户 token 档。
// 成员权限矩阵(后端强制,只允许高级别对低级别操作:owner>admin>member):
//   owner   : 全允许(含解散群、加管理员)
//   admin   : 拉/踢人、拉/踢机器人、禁言、改群信息、设群类型;不可解散群、不可加管理员;不可操作 owner/admin
//   member(公开群): 仅可拉人;其余禁止
//   member(私密群): 全禁止(只能被邀请)
service Group {
  rpc Get (GetGroupReq) returns (GroupBase) { option (hi.auth) = AUTH_USER; }                                       // 群信息
  rpc Create (CreateGroupReq) returns (GroupBase) { option (hi.auth) = AUTH_USER; }                                 // 创建群
  rpc CreateSingle (CreateSingleReq) returns (GroupBase) { option (hi.auth) = AUTH_USER; }                          // 创建单聊群
  rpc Update (GroupBase) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                          // 改群信息/群类型(private)
  rpc ListMembers (ListGroupMemberReq) returns (GroupInfo) { option (hi.auth) = AUTH_USER; }                        // 群成员列表
  rpc GetMemberTotal (GetGroupMemberTotalReq) returns (GetGroupMemberTotalResp) { option (hi.auth) = AUTH_USER; }   // 群成员总数
  rpc Invite (InviteGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                     // 拉人/拉机器人入群
  rpc Join (JoinGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                         // 凭 code 申请加入(公开群直进)
  rpc Quit (QuitGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                         // 主动退群;owner 退=解散群
  rpc Remove (RemoveGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                     // 踢人/踢机器人
  rpc ListMessages (ListGroupMessageReq) returns (ListGroupMessageResp) { option (hi.auth) = AUTH_USER; }           // 群消息列表
  rpc SetRole (SetRoleReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                        // 加/取消管理员
  rpc GetRole (GetRoleReq) returns (GetRoleResp) { option (hi.auth) = AUTH_USER; }                                  // 获取自己在群里的角色
  rpc SetDnd (SetDndReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                          // 自己:设/取消免打扰(原 Mute)
  rpc MuteMembers (MuteMembersReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                // 群主/管理员:禁言/解禁成员
}
