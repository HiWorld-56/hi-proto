syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/club/messaging.proto";
import "hi/options.proto";

// ── 群信息按两个维度组织(未来扩展各归各位)──────────────────────────────
//   · 公共(所有成员一致)→ GroupBase:新增公共字段往这里加。
//   · 成员相关          → GroupMemberAttr:新增成员相关字段往这里加。
//   · dnd 是**严格私有**(只有本人能看到自己的免打扰),故不进 GroupMemberAttr,
//     单独挂在 GroupMemberView 顶层 —— 结构上就不会随成员列表泄漏给别人。

// 群公共信息(所有成员一致)。群类型(单聊/群)在 base.type;public/private 见 private 字段。
// base.update 供前端判断缓存新鲜度。
message GroupBase {
  option (hi.audience) = VIS_PUBLIC; // 群公共信息,所有成员一致
  hi.Entity base       = 1 [(hi.visibility) = VIS_PUBLIC];
  string    background = 2 [(hi.visibility) = VIS_PUBLIC];
  bool      private    = 3 [(hi.visibility) = VIS_PUBLIC]; // true=私密群(只能被邀请加入);false=公开群
}

// 成员相关属性(**对外可见**:成员列表里人人可见谁是什么角色、谁被禁言)。
message GroupMemberAttr {
  option (hi.audience) = VIS_PARTICIPANT; // 成员可见
  string role  = 1 [(hi.visibility) = VIS_PARTICIPANT]; // owner / admin / member
  bool   muted = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 是否被禁言(群主/管理员设;去写留读)
  // ⚠️ dnd 不许加到这里:它是 VIS_SELF,而本消息 audience=VIS_PARTICIPANT,加了 check_auth 直接挂。dnd 放 GroupMemberView。
}

message GroupMember {
  option (hi.audience) = VIS_PARTICIPANT; // 成员列表项,成员可见
  hi.Entity       base = 1 [(hi.visibility) = VIS_PUBLIC];
  GroupMemberAttr attr = 2 [(hi.visibility) = VIS_PARTICIPANT];
}

message GroupInfo {
  option (hi.audience) = VIS_PARTICIPANT; // 成员列表,成员可见
  GroupBase            base = 1 [(hi.visibility) = VIS_PUBLIC];
  repeated GroupMember list = 2 [(hi.visibility) = VIS_PARTICIPANT];
}

// 某成员(调用者本人)视角的群信息 = 群公共 + 我的成员属性 + 我的免打扰(私有)。
// 群信息页一次拉全,前端直接展示。
message GroupMemberView {
  option (hi.audience) = VIS_SELF; // 只当"我的视角"返回给本人
  GroupBase       base = 1 [(hi.visibility) = VIS_PUBLIC];
  GroupMemberAttr attr = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 我的 role/muted
  bool            dnd  = 3 [(hi.visibility) = VIS_SELF]; // **仅本人可见**的免打扰(SELF,故 audience 必须是 SELF)
}

message GetGroupReq {
  string code = 1;
}

// 创建群聊
message CreateGroupReq {
  string name = 1;
}

// 创建单聊
message CreateSingleReq {
  string did = 1;
}

// 组聊天消息列表参数
message ListGroupMessageReq {
  string last_uuid = 1;
  string code      = 2; // 群/单聊 code;群类型由后端按 code 查 GroupModel.group_type
}

message ListGroupMessageResp {
  option (hi.audience) = VIS_PARTICIPANT; // 群消息列表,成员可见
  repeated Packet list = 1 [(hi.visibility) = VIS_PARTICIPANT]; // Packet=PARTICIPANT
}

message ListGroupMemberReq {
  string        code       = 1;
  hi.Pagination pagination = 2;
}

message GetGroupMemberTotalReq {
  string code = 1;
}

message GetGroupMemberTotalResp {
  option (hi.audience) = VIS_PARTICIPANT; // 群成员数,成员可见
  int32 total = 1 [(hi.visibility) = VIS_PARTICIPANT];
}

message InviteGroupReq {
  string          code    = 1;
  repeated string members = 2;
}

message JoinGroupReq {
  string code = 1; // 凭群 code 申请加入(仅公开群;私密群只能被邀请)
}

message QuitGroupReq {
  string code = 1;
}

message RemoveGroupReq {
  string          code    = 1;
  repeated string members = 2;
}

message SetRoleReq {
  string          code    = 1;
  repeated string members = 2;
  string          role    = 3; // admin=添加管理员 / member=取消管理员
}

message GetRoleReq {
  string code = 1;
}

message GetRoleResp {
  option (hi.audience) = VIS_PARTICIPANT; // 我在群里的角色,成员级
  string role = 1 [(hi.visibility) = VIS_PARTICIPANT];
}

// 免打扰(调用者自己):新消息不震动手机。用户自设,非管理操作。
message SetDndReq {
  string code = 1;
  bool   dnd  = 2;
}

// 禁言/解禁成员(群主/管理员):被禁言者去写权限、留读权限(后端移 group:wracl、加 group:racl)。
message MuteMembersReq {
  string          code    = 1;
  repeated string members = 2;
  bool            muted   = 3; // true=禁言,false=解禁
}

// 群(主体=群)。用户 token 档(AUTH_USER=必须登录用户)。
// ⚠️ 群角色(owner/admin/member)是**每个群各自的角色**,不是全局身份,拦截器无从判断 ——
//    故「仅群主/管理员」这类校验**由 handler 按请求里的 code 查群成员表强制**(不进 hi.auth 档)。
// 成员权限矩阵(后端强制,只允许高级别对低级别操作:owner>admin>member):
//   owner   : 全允许(含解散群、加管理员)
//   admin   : 拉/踢人、拉/踢机器人、禁言、改群信息、设群类型;不可解散群、不可加管理员;不可操作 owner/admin
//   member(公开群): 仅可拉人;其余禁止
//   member(私密群): 全禁止(只能被邀请)
service Group {
  // 群资源 → hiclub bucket(avatar/ 与 background/)。只回 url;写进群信息仍走 Update。
  rpc UploadAvatar (hi.UploadReq) returns (hi.UploadResp) { option (hi.auth) = AUTH_USER; }     // 【owner/admin】传群头像
  rpc UploadBackground (hi.UploadReq) returns (hi.UploadResp) { option (hi.auth) = AUTH_USER; } // 【owner/admin】传群背景
  rpc Get (GetGroupReq) returns (GroupMemberView) { option (hi.auth) = AUTH_USER; }                                 // 群信息(公共 base + 我的 attr + 我的 dnd)
  rpc Create (CreateGroupReq) returns (GroupBase) { option (hi.auth) = AUTH_USER; }                                 // 创建群
  rpc CreateSingle (CreateSingleReq) returns (GroupBase) { option (hi.auth) = AUTH_USER; }                          // 创建单聊群
  rpc Update (GroupBase) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                          // 【owner/admin】改群信息/群类型(private)
  rpc ListMembers (ListGroupMemberReq) returns (GroupInfo) { option (hi.auth) = AUTH_USER; }                        // 群成员列表
  rpc GetMemberTotal (GetGroupMemberTotalReq) returns (GetGroupMemberTotalResp) { option (hi.auth) = AUTH_USER; }   // 群成员总数
  rpc Invite (InviteGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                     // 拉人/拉机器人入群(公开群 member 也可;私密群仅 owner/admin)
  rpc Join (JoinGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                         // 凭 code 申请加入(公开群直进)
  rpc Quit (QuitGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                         // 主动退群;owner 退=解散群
  rpc Remove (RemoveGroupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                     // 【owner/admin】踢人/踢机器人(只能踢比自己低级别)
  rpc ListMessages (ListGroupMessageReq) returns (ListGroupMessageResp) { option (hi.auth) = AUTH_USER; }           // 群消息列表
  rpc SetRole (SetRoleReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                        // 【仅 owner】加/取消管理员
  rpc GetRole (GetRoleReq) returns (GetRoleResp) { option (hi.auth) = AUTH_USER; }                                  // 获取自己在群里的角色
  rpc SetDnd (SetDndReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                          // 自己:设/取消免打扰(原 Mute)
  rpc MuteMembers (MuteMembersReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                // 【owner/admin】禁言/解禁成员(只能操作比自己低级别)
}
