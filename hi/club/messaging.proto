syntax = "proto3";

package hi.club;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "hi/club/trade.proto";
import "hi/common.proto";
import "hi/did/transfer.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

message Packet {
  oneof kind {
    Notice notice = 1;
    Message message = 2;
  }
}

/*
   type: 主类型
      群通知（topic: hiclub/v1/group/<群Id>）
      group-dissolve      群已解散                               / hi.club.GroupBase
      member-join         成员加入群（主动加入 / 接受邀请）          / hi.club.Member
      member-exit         成员主动退群                            / hi.club.Member
      member-update       成员资料更新（头像、名字等）               / hi.club.GroupMember
      group-update        群基础信息更新（名称、头像等）             / hi.club.GroupBase

      单聊通知（topic: hiclub/v1/single/<用户Did>）
      friend-invite         收到好友邀请（自动 accept）
      friend-invite-accept  我发出的好友邀请已被对方接受，双方已成为好友
      friend-invite-reject  我发出的好友邀请已被对方拒绝（无需响应）
      friend-delete         我已被对方删除好友
      group-invite          收到入群邀请（自动 accept）              / hi.club.Member
      group-invite-reject   我邀请他人入群已被对方拒绝（无需响应）
      group-kick            我已被踢出群聊                          / hi.club.MemberExit
      q3-sync               Q3 数据同步
      hwbot-bind            hwbot 绑定完成
      hwbot-unbind          hwbot 解绑完成
      hwbot-update          hwbot 资料更新                        / hi.Entity
      plugin-load           插件/脚本加载完成                      / hi.ai.PluginItem

   ex_type: 附加类型
      扩充主类型，避免主类型产生过多分支。
      通知示例：
      type: member-update + ex_type: role                   群成员角色更新
      type: member-update + ex_type: base.name              群成员名字更新
      type: member-update + ex_type: base.avatar            群成员头像更新
      type: group-update  + ex_type: background             群背景更新
      type: group-update  + ex_type: base.avatar            群头像更新
      type: group-update  + ex_type: base.name;private      群名字与私有性更新
      ...
*/
message Notice {
  string uuid = 1;
  string type = 2;
  hi.Entity from = 3;
  int64 timestamp = 4;
  int64 expiration = 5;
  string status = 6;
  google.protobuf.Any extra = 7;
  string ex_type = 8;
}

message Prompt {
  string custom = 1;
  string state = 2;
}

/*
   Message.type
   ----------------------------------------------------------------------------------------------------
   常规消息: chat
   example
   A >>> Message
   type = chat
   from = A
   ghost = null
   ----------------------------------------------------------------------------------------------------
   草稿消息: draft
   A创建原始消息，需要B修改确认后，作为一条新消息，由B发送出去，发送者显示为A。
   example:
   A >>> Message_1
   type = draft
   from = A
   ghost = B
   B >>> Message_2
   type = chat
   from = A
   ghost = B
   ----------------------------------------------------------------------------------------------------
   代笔消息: chat
   B创建的消息，由B发出，发送者显示为A。
   example:
   B >>> Message
   type = chat
   from = A
   ghost = B
   非法消息: invalid
   未通过安全验证的消息
   ----------------------------------------------------------------------------------------------------
   任意聊天中:
   type != chat 时: 一律不显示
   type == chat 时: 发送者显示为 from
*/
message Message {
  string uuid = 1;
  string type = 2;
  hi.Entity from = 3;
  repeated Content conts = 4;
  int64 timestamp = 5;
  google.protobuf.Any extra = 6;
  string ex_type = 7;
  hi.Entity ghost = 8;
  Prompt prompt = 9;
}

message Mention {
  hi.Entity group = 1;
  bool all = 2;
  repeated hi.Entity list = 3;
}

message Member {
  hi.Entity group = 1;
  hi.Entity user = 2;
}

message MemberExit {
  Member member = 1;
  string type = 2;
}

message Content {
  message Chat {
    string content = 1;
    optional string name = 2;
    optional uint32 size = 3;
    optional uint32 duration = 4;
  }

  string type = 1;
  oneof kind {
    Chat chat = 2;
    hi.did.Transaction trans = 3;
    TradeBase trade = 4;
  }
}

message PublishReq {
  string topic = 1;
  Packet payload = 2;
}

service Publisher {
  rpc Publish (PublishReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; } // Token鉴权
}
