syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/ai/agent.proto";
import "hi/options.proto";

// ── 说明:本文件里的智能体方法多数是 hi.ai 的门面 ──────────────────────────
// club **自己没有 AI 功能**,这些方法就是击穿到 hi.ai 拿结果;club 是 hi.ai 的一个商户,
// 用自己的 apikey 调 hiai。**入参/返回直接复用 hi.ai 的类型,是有意为之**:
//   - 防止两边定义不同步(各自复制一份必然漂移);
//   - 少一堆重复定义。
// 所以 **hi.ai 的类型/方法一改,这里必须跟着改** —— 这是继承关系,不是耦合。
// club 自有的部分(绑主人、在线状态)不走 ai,用 club 自己的类型。

message BindMasterReq {
  string master = 1;
  string agent  = 2;
}

message UnbindMasterReq {
  string master = 1;
  string agent  = 2;
}

message BindStatusReq {
  string agent = 1;
}

message BindStatusResp {
  option (hi.audience) = VIS_PUBLIC; // 仅含 master 名片,与公开 AgentDirectory.GetAgentMaster 同数据
  hi.Entity master = 1 [(hi.visibility) = VIS_PUBLIC]; // None / master(Entity=PUBLIC)
}

// 转让机器人 = **换 master**。club 侧不存在"机器人创建者"的概念。
//
// ⚠️ 不再转发 ai.Agent.Transfer —— 那个已从 ai 删除(它自称"转 apikey+agent",实际只改 creator,
//    还会把目标非超级用户的 agent 模型顺手降级)。这个概念本就该在 club 实现,故用 club 自己的类型。
// 它与 BindMaster/UnbindMaster 是同一件事(换绑主人),故同处 Agent。
message TransferReq {
  string agent = 1; // 要转让的机器人 did
  string to    = 2; // 新 master 的用户 did
}

// 在线 agent 列表(club 本地 presence,非转发 ai)。合并原 ListOnlineAgent(按用户)+ ListAllOnlineAgent(全量)。
message ListOnlineReq {
  string        owner_did  = 1; // 可选:只看该用户的在线 agent;空=全部在线
  hi.Pagination pagination = 2;
}

message ListOnlineResp {
  option (hi.audience) = VIS_PUBLIC; // 在线机器人目录(AgentDirectory.ListOnline 免鉴权 AUTH_NONE)
  // ⚠️ 只吐机器人**公开身份**(Entity:name/avatar/did),不复用 hi.ai.AgentInfo ——
  //    后者含 AgentConfig(prompt/模型/记忆)是 owner 私密配置(VIS_SELF),放进公开目录=泄漏。
  //    此前误用 AgentInfo,由可见性 lint 反向校验查出并收窄为 Entity。
  int32              total = 1 [(hi.visibility) = VIS_PUBLIC];
  repeated hi.Entity infos = 2 [(hi.visibility) = VIS_PUBLIC];
}

message GetAgentMasterReq {
  string agent = 1;
}

message GetAgentMasterResp {
  option (hi.audience) = VIS_PUBLIC; // 查机器人主人(AgentDirectory.GetAgentMaster 免鉴权 AUTH_NONE)
  hi.Entity master = 1 [(hi.visibility) = VIS_PUBLIC];
}

// 智能体(主体=智能体)。**用户 token 档**,全档一致。
// 免鉴权的那几个(列表/在线/查主人)已拆去 AgentDirectory。
// 列我的机器人。**没有"查谁"的参数** —— 主体永远是 token 里的人。
message ListMyAgentsReq {
  hi.Pagination pagination = 1;
}

// 超管按用户搜机器人。users 是**过滤条件**(空=不过滤,即全部)——
// 与"空=换一种语义"不同,这里两种情况是同一根轴上的"筛/不筛"。
message ListAgentsByUsersReq {
  repeated string users      = 1; // 用户 did;空=全部
  hi.Pagination   pagination = 2;
}

// 机器人列表:**只吐身份(Entity)**。prompt/模型是 owner 的私密配置,要看走 ai 的 Agent 接口。
// Agent.List(我的)与 AgentManage.List(超管按用户搜)共用 —— 返回形状本就该一样。
message ListAgentsResp {
  option (hi.audience) = VIS_SELF;
  int32              total  = 1 [(hi.visibility) = VIS_SELF];
  repeated hi.Entity agents = 2 [(hi.visibility) = VIS_PUBLIC]; // assistant(软件)+ robot(硬件)
}

service Agent {
  // 列我的机器人。归属**只看 club 自己的 relation(master 关系)** —— club 的机器人关系
  // 由 club 自己管理,与 hiai 无关(hiai 那边所有 club 机器人的 creator 都是 club 商户,
  // 根本表达不了"谁的机器人")。did 取自 token,不接受入参指定;
  // 将来若要开放"查别人的机器人列表",那是**另一个方法**,不是把这个的档位放开。
  rpc List (ListMyAgentsReq) returns (ListAgentsResp) { option (hi.auth) = AUTH_USER; } // 列我名下的机器人
  // ── hi.ai 门面(跟 ai 定稿改名)──
  rpc CreateAssistant (hi.ai.CreateAssistantReq) returns (hi.ai.CreateAgentResp) { option (hi.auth) = AUTH_USER; }  // 原 CreateAgent
  rpc Edit (hi.ai.EditAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }      // 原 EditAgent
  rpc Delete (hi.ai.DeleteAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }  // 原 DeleteAgent
  rpc Get (hi.ai.GetAgentReq) returns (hi.ai.GetAgentResp) { option (hi.auth) = AUTH_USER; }           // 原 FindAgent
  rpc GetUsage (hi.ai.AgentUsageReq) returns (hi.ai.AgentUsageResp) { option (hi.auth) = AUTH_USER; }  // 原 FindAgentCount(消息数+token,不是"count")
  rpc GetDefaultConfig (google.protobuf.Empty) returns (hi.ai.DefaultConfigResp) { option (hi.auth) = AUTH_USER; } // 全局默认配置(原 DefaultConfig,补动词跟 ai)
  // ── club 自有:换绑主人 ──
  rpc BindMaster (BindMasterReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }     // 绑定主人
  rpc UnbindMaster (UnbindMasterReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 解绑主人
  rpc BindStatus (BindStatusReq) returns (BindStatusResp) { option (hi.auth) = AUTH_USER; }            // 绑定状态
  rpc Transfer (TransferReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }         // 转让机器人=换 master(club 自实现)
}

// 智能体目录(公开)。从 Agent 拆出 —— 原来这三个免鉴权方法混在 token 档的 Agent 里(混档)。
// 供三方看板/未登录页面列机器人、查在线与主人。
// 公开目录。**只放真正该公开的东西。**
//
// ⚠️ 这里曾有 List 与 GetAgentMaster,都已**删除**:
//   · List 转发 ai.Agent.List 且用 club 自己的 apikey —— 它查的是**hiai 里挂在 club 商户
//     名下的 agent**,与"club 用户的机器人列表"毫无关系(club 的机器人归属由 club 自己的
//     relation 管,不在 hiai)。而 hiai 里所有 club 机器人的 creator 都是 club 商户,
//     所以匿名调用者传空参数就能把**全部** club 机器人连同 AgentConfig 的 prompt/模型
//     一起拿走。这个方法从设计上就不成立,直接删,不是"改档位"能救的。
//   · GetAgentMaster 让任何人都能反查某机器人的主人 —— 不该随便让人找到。
//
// (Agent.List 是**另起**的用户自服务方法,数据取自 club 自己的 relation,与上面这个无继承关系。)
service AgentDirectory {
  rpc ListOnline (ListOnlineReq) returns (ListOnlineResp) { option (hi.auth) = AUTH_NONE; }             // 公开:在线机器人(club 本地 presence);owner_did 空=全部
}

// 机器人管理(**超管**)。与 Agent(用户自服务)**主体不同,故拆 service** ——
// 范式见 DApp/DAppAdmin、Merchant/MerchantManage。
//
// Mark/ListMarks 原先挂在 Agent 下、标 AUTH_USER,但它们本就是 hiclub web 的超管功能
// (给机器人打标记让它显示靠前)—— 普通用户不该能改别人机器人的排序权重。
service AgentManage {
  rpc List (ListAgentsByUsersReq) returns (ListAgentsResp) { option (hi.auth) = AUTH_SUPERADMIN; }        // 按用户搜机器人
  rpc Mark (hi.ai.MarkAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }   // 打标记(显示靠前),不是收藏
  rpc ListMarks (hi.ai.ListMarksReq) returns (hi.ai.ListAgentResp) { option (hi.auth) = AUTH_SUPERADMIN; } // 列已打标记的
}
