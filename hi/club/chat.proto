syntax = "proto3";

package hi.club;

import "google/protobuf/empty.proto";
import "hi/ai/chat.proto";
import "hi/club/messaging.proto";
import "hi/options.proto";
import "hi/common.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

// ── 说明:Chat 是 hi.ai.Chat 的门面,但**入参不能直接复用 ai 的** ──────────────
// club 的 `Content`(messaging.proto)是**富消息**:oneof{Chat|Transaction|币安…};
// ai 的 `Content` 只是 {type, content} 一个带类型的字符串。二者是真实差异,不是重复定义,
// 故带 Content 的入参用 club 自己的类型(后端负责转换成 ai 的);
// 纯透传的返回(ChatResp/ConverseStreamResp/…)继续直接复用 hi.ai 的类型,防止两边漂移。
// **对话只有一条路**,与 ai 对齐:Converse/ConverseStream 跑一个循环,只在"轮到客户端执行工具"时
// 中途返回,客户端执行完调 Resume/ResumeStream 进同一个循环(详见 hi/ai/chat.proto 的 service 注释)。

message QA {
  option (hi.audience) = VIS_SELF; // 我与机器人的私有对话
  repeated Content q = 1 [(hi.visibility) = VIS_PARTICIPANT]; // User(club Content=PARTICIPANT)
  optional string  a = 2 [(hi.visibility) = VIS_SELF];        // assistant
}

message GetContextResp {
  option (hi.audience) = VIS_SELF; // 我与机器人的上下文
  repeated QA list = 1 [(hi.visibility) = VIS_SELF]; // QA=SELF
}

// ── 上下文(context)的三个入参:club 自己的类型,**不复用 hi.ai 的** ────────────────────
//
// hi.ai 的同名入参多了 `caller` / `master` —— 那是**商户替用户说的话**,只能由服务端填。
// 这里若直接复用 hi.ai 的类型,客户端就能自己填 caller 冒充机器人或主人(与 ChatReq 故意不带 master 同理)。
//
// 谁能碰哪个 cid(与 Converse* / Resume* 同一条规则,判据见 hi/ai/chat.proto 那段):
//   · 机器人格式的 cid(`hiclub:embedded|single|group:...:<机器人>`,最后一段是机器人)
//     → 调用者是该机器人本人,或是它的主人;
//   · 其它 cid(NewSession 发的 uuid)→ hi-ai 记「第一个用它的人」,此后只认他。
//   · 不满足 → NotFound「会话不存在」。
//
// ⚠️ 上下文 ≠ 聊天记录:上下文是 hi-ai 喂给模型的问答对;聊天记录在 club 的消息时间线
//    (`Group.ListMessages` / `Group.ListRecentMessages`)。club **不另存一套上下文**。
message GetContextReq {
  optional string cid = 1;
}

message ClearContextReq {
  optional string cid = 1;
}

// 补一对问答进上下文(见 hi/ai/chat.proto 的 AppendContextReq)。
message AppendContextReq {
  optional string cid       = 1;
  optional string user      = 2;
  optional string assistant = 3;
}

// 对话入参(模态由 conts+style 决定;合原 TextToText/SpeechToText/SpeechToSpeech 与原 CompleteReq)。
//
// ⚠️ **`tools` 是「我这边能执行哪些工具」,不是「这轮可用的全部工具」** ——
//    ai 会把该 agent 的插件工具追加在它后面一起喂模型,返回后按名字分流。
//    不上报(app / hiclub web)= 全部由服务端跑完 = 一次调用拿到最终答复。
message ChatReq {
  optional string           agent           = 1;
  optional string           cid             = 2;
  repeated Content          conts           = 3;
  repeated hi.ai.ToolSupply tools           = 4; // **客户端自己能执行的工具**;空 = 全交服务端跑完
  optional string           tool_choice     = 5;
  optional string           custom          = 6;
  optional string           state           = 7;
  optional string           style           = 8; // 语音出音色等;纯文本不传
  // ── 过程回显开关(**只管输出,不管行为**)──────────────────────────────────────
  // 与 hi.ai.ChatReq 的同名字段一一对应,club 原样透传。**仅流式有意义。**
  // ⚠️ 别读成"要不要调插件":**调不调是模型决定的**(标准 function call);这几个只决定
  //    过程数据要不要一并流出去。
  //
  // ⚠️ 旧名 `return_plugin_use` / `return_training_data` / `return_context` 已随 ai 一并改名
  //    (`return_` 像"要不要返回结果",而回的是**过程**;`plugin_use` 回的是 function call,
  //     不是"插件用量")。
  //
  // ⚠️ 这几个字段原属已删除的 `CompleteReq`。与 ai 侧同因同源:dev45 迁移
  //    (Stream→CompleteStream)时从请求里漏掉过,而且 club 这层是**双层丢** ——
  //    自己没有字段,转发给 ai 时自然也带不上,于是经 club 进来的调用方(app / hiclub web)
  //    即便 ai 修好了也永远拿不到回显帧。搬家时别再漏第二次。
  optional bool             echo_tool_calls = 9;  // 发 type="echoToolCalls" 帧:模型调了哪个函数、传了什么参数、工具返回什么
  optional bool             echo_memory     = 10; // 发 type="echoMemory" 帧:本轮命中的记忆片段(旧名 return_training_data)
  optional bool             echo_context    = 11; // 发 type="echoContext" 帧:这次真正喂给模型的那份上下文(系统提示词含【插件】段 + 截出的历史;**不含本轮提问**)
  // ── 这句话是谁说的 ─────────────────────────────────────────────────────────
  //
  // 🔴 **不是"谁在调这个接口"。** 调用方几乎永远是机器人自己(`agent` 就是它),
  //    而提问者在**它收到的那条 mqtt 消息的 `from`** 里 —— 只有收到消息的那一端知道,
  //    所以必须由客户端带上来,服务端无法从"谁在调"反推(反推出来的是机器人)。
  //
  // **证明不了就不传**:机器人的语音路(现场人声)无法证明身份,一律不传。
  // 不传 = 匿名提问,插件侧要认人的方法应当直接拒绝,**不许退回成"主人在问"**。
  //
  // ⚠️ 它只是**消息流转里的事实**,不是权限凭据。判"是不是主人"要拿服务端现取的
  //    权威值比对(见 hi.ai.ChatReq.master),动钱一律用那个权威值。
  //    别拿 `from` 去做流转之外的事。
  //
  // ⚠️ 人自己在 app/web 里直接跟助手聊时可以不传,服务端按登录主体推导。
  optional string           asker           = 12;
}

message ToolCallResult {
  optional string  id    = 1;
  repeated Content conts = 2;
}

// 工具结果续跑入参(Resume):客户端执行完工具后把结果交回来,接着跑。
message ToolCallResultsReq {
  optional string         id   = 1;
  repeated ToolCallResult list = 2;
}

// 对话(主体=会话)。用户 token 档,全档一致。hi.ai.Chat 的门面。
service Chat {
  // 传聊天媒体(图/语音/视频/文件)→ **temp bucket,14 天后自动过期**。
  // 媒体是临时资产:redis 消息历史也只留 14 天,两者对齐;客户端收到即缓存到本地,
  // 故过期不影响本地历史回看。**头像/群头像不要走这里** —— 那是永固资产,各有归属 bucket。
  // ── 会话管理 ──
  rpc NewSession (google.protobuf.Empty) returns (hi.ai.NewSessionResp) { option (hi.auth) = AUTH_USER; }      // 原 GenerateCid
  rpc GetContext (GetContextReq) returns (GetContextResp) { option (hi.auth) = AUTH_USER; }                 // 取上下文(一度叫 GetHistory)
  rpc ClearContext (ClearContextReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }      // 清上下文(一度叫 ClearHistory)
  // 补一对问答进上下文。机器人到点自己做完一件事之后用它 —— 不这么做的话,
  // 模型下次对话时对自己刚做过的事一无所知(见 hi/ai/chat.proto 的 AppendContextReq)。
  rpc AppendContext (AppendContextReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }
  // ── 对话:一轮 = 一个循环,中途只在"轮到客户端"时返回(详见 hi/ai/chat.proto)──
  //
  // cid 的归属判据同上面 GetContext 那段(机器人格式的 cid 里的机器人还必须就是 `agent`)。
  //
  // ⭐ **语音聊天记录**:cid == `hiclub:embedded:<调用者自己>`(机器人的语音路)时,club 在调推理的同时
  //    把这一轮存进聊天记录 —— 会话是「机器人 + 固定虚拟 did `voice_chat`」的二人会话
  //    (会话号与单聊同一算法,`BuildSingleGroupCode(机器人, "voice_chat")`;库里一条 single 记录,
  //    成员只有机器人)。用户那句一进来就写(from = `voice_chat`,内容 = 本轮 conts 原样);
  //    机器人的最终答复在 final=true 时写(from = 机器人)—— 中途轮到客户端执行工具的,
  //    最终答复出在 Resume / ResumeStream 里,同样写。存法与普通消息完全一致(Packet 字节、时间线、保留期),
  //    读法是 `Group.ListRecentMessages{peer: "voice_chat"}`(只有机器人自己是成员)。
  rpc Converse (ChatReq) returns (hi.ai.ChatResp) { option (hi.auth) = AUTH_USER; }                                  // 一轮对话(原 Complete + 原 Converse)
  rpc ConverseStream (ChatReq) returns (stream hi.ai.ConverseStreamResp) { option (hi.auth) = AUTH_USER; }           // 同上,流式(原 CompleteStream)
  rpc Resume (ToolCallResultsReq) returns (hi.ai.ChatResp) { option (hi.auth) = AUTH_USER; }                         // 交回客户端工具结果,续跑同一循环
  rpc ResumeStream (ToolCallResultsReq) returns (stream hi.ai.ConverseStreamResp) { option (hi.auth) = AUTH_USER; }  // 同上,流式
}
