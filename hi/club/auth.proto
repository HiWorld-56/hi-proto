syntax = "proto3";

package hi.club;

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/auth.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

message LoginResp {
  option (hi.audience) = VIS_SELF; // 登录返回:令牌/凭证,仅本人
  hi.Entity          base   = 1 [(hi.visibility) = VIS_PUBLIC]; // 用户名片(Entity=PUBLIC)
  hi.AuthToken       token  = 2 [(hi.visibility) = VIS_SELF];   // 登录令牌(凭证)
  hi.MqttCredentials mqtt   = 3 [(hi.visibility) = VIS_SELF];   // MQTT 凭证
  hi.Entity          master = 4 [(hi.visibility) = VIS_PUBLIC]; // 主人名片(Entity=PUBLIC)
}

service Auth {
  rpc RefreshToken (hi.did.RefreshTokenReq) returns (hi.AuthToken) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc Logout (hi.did.RefreshTokenReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; } // 登出:删该会话;凭 refresh_token(当前或宽限位)证明归属,不作数一律 Unauthenticated。AUTH_NONE 只是不验 access(可能已过期)
  rpc GenerateReqId (hi.did.GenerateReqIdReq) returns (hi.did.LoginQr) { option (hi.auth) = AUTH_NONE; } // 不鉴权;回 reqId 与 hidid 生成的二维码文本
  rpc GetReqStatus (hi.RequestId) returns (hi.did.ReqStatusResp) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc Verify (hi.SignedData) returns (LoginResp) { option (hi.auth) = AUTH_WEB3; } // Web3鉴权 / hi.did.LoginReq
}
