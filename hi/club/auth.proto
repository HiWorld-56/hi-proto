syntax = "proto3";

package hi.club;

import "hi/common.proto";
import "hi/did/auth.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

message LoginResp {
  hi.Entity base = 1;
  hi.AuthToken token = 2;
  hi.MqttCredentials mqtt = 3;
  hi.Entity master = 4;
}

service Auth {
  rpc RefreshToken (hi.did.RefreshTokenReq) returns (hi.AuthToken) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc GenerateReqId (hi.did.GenerateReqIdReq) returns (hi.RequestId) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc GetReqStatus (hi.RequestId) returns (hi.did.ReqStatusResp) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc Verify (hi.SignedData) returns (LoginResp) { option (hi.auth) = AUTH_NONE; } // Web3鉴权 / hi.did.LoginReq
}
