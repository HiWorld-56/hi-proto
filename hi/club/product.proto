syntax = "proto3";
package hi.club;
option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";
import "buf/validate/validate.proto";
import "hi/common.proto";
import "hi/did/base.proto";
import "hi/options.proto";

// 商品库与挂牌分离，沿用插件市场的“当前主人 -> 机器人摊位 -> 货”。
// 上传仅入本人硬件机器人的库，不能向任意机器人上传，也不能自动上架/广播。
// 公开目录与管理面分开；采购、库存和履约契约见product_trade.proto。
service ProductInventory {
  rpc Create(CreateProductReq) returns (ProductInventoryItem) { option (hi.auth) = AUTH_USER; }
  rpc Get(GetProductReq) returns (ProductInventoryItem) { option (hi.auth) = AUTH_USER; }
  rpc Configure(ConfigureProductReq) returns (ProductInventoryItem) { option (hi.auth) = AUTH_USER; }
  rpc AdjustStock(AdjustProductStockReq) returns (ProductInventoryItem) { option (hi.auth) = AUTH_USER; }
  rpc List(ListProductsReq) returns (ListProductInventoryResp) { option (hi.auth) = AUTH_USER; }
}
service ProductMarket {
  // 允许摊主本人或当前主人操作。插件以机器人身份调用，只能经营自己的库存。
  rpc Publish(GetProductReq) returns (ProductListing) { option (hi.auth) = AUTH_USER; }
  rpc SetListingStatus(SetProductListingStatusReq) returns (ProductListing) { option (hi.auth) = AUTH_USER; }
  rpc ListMyListings(ListProductsReq) returns (ListProductListingsResp) { option (hi.auth) = AUTH_USER; }
}
service ProductMarketDirectory {
  rpc ListSellers(hi.Pagination) returns (ListProductSellersResp) { option (hi.auth) = AUTH_NONE; }
  rpc GetSeller(GetProductSellerReq) returns (ProductSeller) { option (hi.auth) = AUTH_NONE; }
  rpc ListSellerStalls(ListProductStallsReq) returns (ListProductStallsResp) { option (hi.auth) = AUTH_NONE; }
  rpc ListStallListings(ListProductsReq) returns (ListProductListingsResp) { option (hi.auth) = AUTH_NONE; }
  rpc SearchListings(SearchProductListingsReq) returns (ListProductListingsResp) { option (hi.auth) = AUTH_NONE; }
  rpc GetListing(GetProductListingReq) returns (ProductListing) { option (hi.auth) = AUTH_NONE; }
}
message ProductImage {
  option (hi.audience) = VIS_PUBLIC;
  optional string url = 1 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).required = true, (buf.validate.field).string.uri = true];
  optional string thumb_url = 2 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).string.uri = true];
}
// 商品展示报价；不传表示未标价，显式0表示零价，两种报价可独立填写。
message ProductPricing {
  option (hi.audience) = VIS_PUBLIC;
  option (buf.validate.message).cel = {
    id: "product.pricing.nonempty"
    message: "请填写人民币价格或数字货币价格"
    expression: "has(this.cny_amount) || has(this.digital)"
  };
  optional string cny_amount = 1 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).string = {max_len: 80, pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"}]; // 人民币元
  hi.did.CoinAmount digital = 2 [(hi.visibility) = VIS_PUBLIC]; // 目录支持的一个币种及其金额
}
message ProductInfo {
  option (hi.audience) = VIS_PUBLIC;
  optional string name = 1 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 120}];
  repeated ProductImage images = 2 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).repeated = {min_items: 1, max_items: 9}];
  ProductPricing pricing = 3 [(hi.visibility) = VIS_PUBLIC]; // 唯一现价来源，订单冻结其快照
  optional string custom_id = 4 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).string.max_len = 200]; // 客户系统商品原始ID，仅人工排查，不参与业务定位/幂等/去重
}
message Product {
  option (hi.audience) = VIS_PUBLIC;
  optional string id = 1 [(hi.visibility) = VIS_PUBLIC]; // 系统分配
  ProductInfo info = 2 [(hi.visibility) = VIS_PUBLIC]; // 展示资料唯一来源
}
// 仅参与上传的主人与机器人可读。uploaded_by是审计快照，不是永久管理权。
message ProductInventoryItem {
  option (hi.audience) = VIS_PARTICIPANT;
  Product product = 1 [(hi.visibility) = VIS_PUBLIC];
  hi.Entity stall = 2 [(hi.visibility) = VIS_PARTICIPANT];
  hi.Entity uploaded_by = 3 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 uploaded_at = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 微秒
  ProductStockBalance stock = 5 [(hi.visibility) = VIS_PARTICIPANT];
  ProductFulfillmentSpec fulfillment = 6 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 revision = 7 [(hi.visibility) = VIS_PARTICIPANT];
}
enum ProductListingStatus {
  PRODUCT_LISTING_STATUS_UNSPECIFIED = 0;
  PRODUCT_LISTING_STATUS_LISTED = 1;
  PRODUCT_LISTING_STATUS_HIDDEN = 2;
  PRODUCT_LISTING_STATUS_DELISTED = 3;
}
message ProductListing {
  option (hi.audience) = VIS_PUBLIC;
  Product product = 1 [(hi.visibility) = VIS_PUBLIC]; // 从库存现取，不复制名称/图片
  hi.Entity merchant = 2 [(hi.visibility) = VIS_PUBLIC]; // 摊主当前主人；无主则不传
  hi.Entity stall = 3 [(hi.visibility) = VIS_PUBLIC];
  optional int64 listed_at = 4 [(hi.visibility) = VIS_PUBLIC]; // 微秒
  optional string uuid = 5 [(hi.visibility) = VIS_PUBLIC]; // 挂牌id，与商品id分开
  optional ProductListingStatus status = 6 [(hi.visibility) = VIS_PUBLIC];
  optional string publication_uuid = 7 [(hi.visibility) = VIS_PUBLIC]; // 本次上架事件，重试不变，再上架产生新事件
  ProductFulfillmentSpec fulfillment = 8 [(hi.visibility) = VIS_PUBLIC];
  optional int64 available_quantity = 9 [(hi.visibility) = VIS_PUBLIC]; // 未配置不传，不冒充0
  optional bool purchasable = 10 [(hi.visibility) = VIS_PUBLIC];
}
message ProductAnnouncement {
  option (hi.audience) = VIS_PUBLIC;
  ProductListing listing = 1 [(hi.visibility) = VIS_PUBLIC];
  hi.Entity group = 2 [(hi.visibility) = VIS_PUBLIC];
}
message ProductSeller {
  option (hi.audience) = VIS_PUBLIC;
  hi.Entity seller = 1 [(hi.visibility) = VIS_PUBLIC]; // 不传=聚合的无主摊位入口
  optional int64 stalls_count = 2 [(hi.visibility) = VIS_PUBLIC];
  optional int64 listing_count = 3 [(hi.visibility) = VIS_PUBLIC];
}
message ProductStall {
  option (hi.audience) = VIS_PUBLIC;
  hi.Entity stall = 1 [(hi.visibility) = VIS_PUBLIC];
  optional int64 listing_count = 2 [(hi.visibility) = VIS_PUBLIC];
}
message CreateProductReq {
  optional string request_uuid = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  optional string stall = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1]; // 必须为本人当前名下硬件机器人
  ProductInfo info = 3 [(buf.validate.field).required = true];
  optional int64 quantity = 4 [(buf.validate.field).int64 = {gte: 0, lte: 1000000000}]; // 未配置不可采购，0为已配置但无货
  ProductFulfillmentSpec fulfillment = 5;
}
message GetProductReq {
  optional string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}
message ListProductsReq {
  optional string stall = 1 [(buf.validate.field).string.min_len = 1]; // 管理面不传=当前本人名下全部机器人；摊主本人只读自己
  hi.Pagination pagination = 2;
}
message SetProductListingStatusReq {
  optional string uuid = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  optional ProductListingStatus status = 2 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
}
message GetProductListingReq {
  optional string uuid = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}
message SearchProductListingsReq {
  optional string keyword = 1 [(buf.validate.field).string.min_len = 1];
  hi.Pagination pagination = 2;
}
message GetProductSellerReq {
  optional string did = 1 [(buf.validate.field).string.min_len = 1]; // 不传=无主摊位入口
}
message ListProductStallsReq {
  optional string seller = 1 [(buf.validate.field).string.min_len = 1]; // 不传=无主摊位入口
  hi.Pagination pagination = 2;
}
message ListProductInventoryResp {
  option (hi.audience) = VIS_SELF;
  repeated ProductInventoryItem list = 1 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 total = 2 [(hi.visibility) = VIS_SELF];
}
message ListProductListingsResp {
  option (hi.audience) = VIS_PUBLIC;
  repeated ProductListing list = 1 [(hi.visibility) = VIS_PUBLIC];
  optional int64 total = 2 [(hi.visibility) = VIS_PUBLIC];
}
message ListProductSellersResp {
  option (hi.audience) = VIS_PUBLIC;
  repeated ProductSeller list = 1 [(hi.visibility) = VIS_PUBLIC];
  optional int64 total = 2 [(hi.visibility) = VIS_PUBLIC];
}
message ListProductStallsResp {
  option (hi.audience) = VIS_PUBLIC;
  repeated ProductStall list = 1 [(hi.visibility) = VIS_PUBLIC];
  optional int64 total = 2 [(hi.visibility) = VIS_PUBLIC];
}

// 独立库存只由Club记账，不连接外部库存系统。
message ProductStockBalance {
  option (hi.audience) = VIS_PARTICIPANT;
  optional int64 available = 1 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 held = 2 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 allocated = 3 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 shipped = 4 [(hi.visibility) = VIS_PARTICIPANT];
  optional int64 revision = 5 [(hi.visibility) = VIS_PARTICIPANT];
}
enum ProductDeliveryType {
  PRODUCT_DELIVERY_TYPE_UNSPECIFIED = 0;
  PRODUCT_DELIVERY_TYPE_PHYSICAL = 1;
  PRODUCT_DELIVERY_TYPE_DIGITAL = 2;
}
message ProductFulfillmentSpec {
  option (hi.audience) = VIS_PUBLIC;
  optional ProductDeliveryType type = 1 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).required = true, (buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string description = 2 [(hi.visibility) = VIS_PUBLIC, (buf.validate.field).string.max_len = 2000];
}
message ConfigureProductReq {
  optional string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  optional int64 revision = 2 [(buf.validate.field).required = true, (buf.validate.field).int64.gte = 0];
  ProductInfo info = 3;
  ProductFulfillmentSpec fulfillment = 4;
}
message AdjustProductStockReq {
  optional string id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  optional string request_uuid = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  optional int64 delta = 3 [(buf.validate.field).required = true, (buf.validate.field).int64 = {gte: -1000000000, lte: 1000000000}];
  optional string reason = 4 [(buf.validate.field).required = true, (buf.validate.field).string = {min_len: 1, max_len: 200}];
}
