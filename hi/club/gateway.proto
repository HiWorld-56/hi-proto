syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "hi/did/gateway.proto";
import "google/protobuf/empty.proto";
import "hi/options.proto";

service GatewayConfig  {
  // 网关配置列表(面向登录用户)。此前误为免鉴权。
  rpc List (google.protobuf.Empty) returns (hi.did.GatewayConfigListResp) { option (hi.auth) = AUTH_TOKEN; }
}