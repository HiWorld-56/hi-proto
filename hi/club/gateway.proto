syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "hi/did/gateway.proto";
import "google/protobuf/empty.proto";
import "hi/options.proto";

service GatewayConfig  {
  rpc List (google.protobuf.Empty) returns (hi.did.GatewayConfigListResp) { option (hi.auth) = AUTH_NONE; }
}