syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "hi/did/gateway.proto";
import "google/protobuf/empty.proto";

service GatewayConfig  {
  rpc ListGatewayConfigs (google.protobuf.Empty) returns (hi.did.GatewayConfigListResp);

  rpc List (google.protobuf.Empty) returns (hi.did.GatewayConfigListResp) { option deprecated = true; } // DEPRECATED: 改用 ListGatewayConfigs
}