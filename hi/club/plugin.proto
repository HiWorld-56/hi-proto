syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/ai/plugin.proto";
import "hi/options.proto";
import "hi/common.proto";

// 插件管理(主体=插件)。**hi.ai.Plugin 的门面**,纯透传 → 类型直接复用 hi.ai(有意为之)。
//
// 插件有 py / rust 两种,**建壳→建版本是同一条路**,club 这边一个分支都没有 ——
// lang 由后端从首版的包结构自动判定(见 hi.ai.PluginLang),用户不声明、也无从声明。
//
// ⚠️ club 侧的实际代码活(不只是改名):
//   1. **c.data 是 club 的私有区,不给用户填。** hi.ai 眼里它只是一袋不透明 JSON
//      (hiai-web 那边确实开放给商户手填),但 club 征用它存 api_key ——
//      故 club 的所有写入点一律 `c.data = {api_key: <该机器人的 key>}`,
//      **丢弃调用方传来的壳级扩展数据**。用户自己的扩展数据走版本级 d.data。
//      (只挡 api_key 一个键是不够的:那块地方本身就不该开着。)
//   2. **每个建 c 行的入口都必须注入 api_key,一个都不能漏** ——
//      建壳 / 改扩展数据 / 市场装载 / 内置插件自动装载。漏掉的表现是**静默**的:
//      插件跑起来才发现自己没有身份,而那时已经在机器人上了。
//      取不到就现造(ensure 语义),别报错让用户先去别处点一下。
//   3. apikey **挂机器人名下、不挂用户**,机器人换持有者后脚本照常跑。
//   4. **删 apikey 前必须查是否被插件引用,被引用则拒删**。
//
// 四表模型见 hi/ai/plugin.proto:a壳(uuid,name)/ b版本(uuid,version,本体)/ c壳级使用 / d版本级使用。
// 建壳=a+c 联表、建版本=b+d 联表;c/d 是机器人自定义使用态。市场引用(复用 a/b + 建自己 c/d)未开放。
service Plugin {
  rpc CreateShell (hi.ai.CreateShellReq) returns (hi.ai.CreateShellResp) { option (hi.auth) = AUTH_USER; }           // 建空壳(后台分配 uuid;club 覆盖 c.data={api_key},取不到就现造)
  rpc CreateVersion (hi.ai.CreateVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }       // 给壳加版本(建 b+d)
  rpc Edit (hi.ai.EditPluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                   // 只改扩展数据 c.data/d.data(壳名/版本本体冻结)
  rpc Get (hi.ai.GetPluginReq) returns (hi.ai.GetPluginResp) { option (hi.auth) = AUTH_USER; }                       // 查单个插件
  rpc List (hi.ai.ListPluginsReq) returns (hi.ai.ListPluginsResp) { option (hi.auth) = AUTH_USER; }                  // 一级页:列壳 + 该 agent 激活版本
  rpc ListVersions (hi.ai.ListVersionsReq) returns (hi.ai.ListVersionsResp) { option (hi.auth) = AUTH_USER; }        // 二级页:列某壳所有版本
  rpc Delete (hi.ai.DeleteVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }              // 删某个版本(仅创建者)
  rpc DeleteVersions (hi.ai.DeleteVersionsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }     // 批量删版本(范围 [min,max],仅创建者)
  rpc DeleteVersionList (hi.ai.DeleteVersionListReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 批量删指定版本(列表,可不连续,仅创建者)
  rpc DeleteShell (hi.ai.DeleteShellReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }           // 从机器人移除单个插件(创建者删壳/引用方解绑)
  rpc DeleteShells (hi.ai.DeleteShellsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }        // 批量从机器人移除多个插件
  // 注:按 agent 批量清插件是撤权级联的内部动作,club 侧不暴露给前端 ——
  //     PermissionService 撤"插件权限"时直接调 hi.ai.Plugin.DeleteByAgents(grpc),不走 club 门面。
  rpc SetActive (hi.ai.SetActiveReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }               // 选该 agent 激活版本
  rpc SetEnabled (hi.ai.SetEnabledReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }             // 插件级开关
  rpc SetFollowLatest (hi.ai.SetFollowLatestReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }   // 自动跟最新版开关(c.follow_latest)。**归使用方**,不在挂牌上
  rpc ReloadApiKey (ReloadApiKeyReq) returns (ReloadApiKeyResp) { option (hi.auth) = AUTH_USER; } // 重装 api_key:重新取该机器人第一个 apikey 写入 c.data 并重载(用户删旧 apikey 后修复)
  rpc RetryBuild (hi.ai.RetryBuildReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 重编某个 NATIVE 版本(编译失败后重试,版本本体不动)
}

// ── 机器人自用面 ──────────────────────────────────────────────────────────
//
// **主体恒是调用者本人。** 上面那个 `Plugin` 的主体是**主人**(管自己机器人的插件),
// 这里的主体是**机器人自己**(问"我该装什么")—— 两种主体混在一个 service 里,
// 迟早有人给这里的方法加个 `agent` 参数,那就成了任填 did 的越权入口。
//
// ListOnDeviceReq —— 见下面 ListOnDevice:**没有 agent 字段**,主体只能从凭证里取。
// 只带机器人自己的架构:RUST 插件一版两个架构各有一份产物,给错了要到 dlopen 才炸。
// (LUA 的制品 target 是 `any`,与架构无关 —— 服务端按 `target ∈ {这个值, "any"}` 筛。)
//
// ⚠️ **不传 = aarch64**。老 brain 发的是 `Empty`(根本不带这个字段),optional 之后就是
//    "没有值" —— 于是它照旧拿到 arm64 那份,零改动继续跑。这条兼容是有意的。
//    ⛔ **空串不再是合法值**(2026-08-28 起禁止用空串表示"没有"):要么不传,要么给真架构名。
message ListOnDeviceReq {
  optional string arch = 1;
  // 机器人已经有的依赖文件,club 原样穿透给 hi.ai。
  // 语义见 `hi.ai.HaveDep` 与 `hi.ai.ListOnDeviceReq.have` —— **它是请求的参数,
  // 不是服务端的一张表**。
  repeated hi.ai.HaveDep have = 2;
}

// 所以 `ListOnDevice` **没有 agent 参数**,主体只能从凭证里取。
// 照 `MarketApplyReq` 删掉申请人字段那次的教训:能传的主体就是能越权的主体。
//
// 为什么在 `hi.club` 而不是直接调 `hi.ai`:机器人经 core 的已认证 hiclub 通道说话,
// core 的 `call` 网关只有 hiclub 一条(见 deps.md 坑②),够不着 hi.ai。club 穿透转发。
service AgentPlugin {
  // 我该装哪些**设备端**插件(RUST 的 `.so` 与 LUA 的脚本,同一份清单)。
  // **全量清单**,机器人按它对账(多的删、少的下、摘要不同的换)。
  // 增量表达不了撤权与到期 —— 而那两件事必须传达到:服务端删掉引用行,
  // 机器人本地那个文件不会自己消失。
  //
  // ⚠️ 原名 `ListNative`,筛的是"壳是 NATIVE"。改名不只是改名:判据从
  // "是某种语言"换成了派生的 `runsOnDevice(lang)` —— 否则 lua 插件会被静默筛掉。
  rpc ListOnDevice (ListOnDeviceReq) returns (hi.ai.ListOnDeviceResp) { option (hi.auth) = AUTH_USER; }
}

// ReloadApiKey —— club 专属(hi.ai 无 api_key 概念)。
// api_key 存在 c.data(该机器人自己的),用户可在别处删掉某个 apikey,导致插件里存的那个失效;
// 用户重建 apikey 后调此方法,后端**重新取**该机器人 apikey 列表的**第一个**覆盖写入 c.data 并发重载通知。
// 语义如"重新装弹":只从现有弹匣取,**不造子弹** —— 列表为空即报错,绝不偷偷创建 apikey。
// 前端**不允许手填 api_key**(防伪),一律由此/建插件时后端自动注入。
message ReloadApiKeyReq {
  optional string agent = 1; // 机器人 did
  optional string uuid  = 2;  // 插件 uuid
}
message ReloadApiKeyResp {
  option (hi.audience) = VIS_SELF;
  optional string api_key = 1 [(hi.visibility) = VIS_SELF]; // 重新写入的 api_key(便于前端就地刷新列表)
}
