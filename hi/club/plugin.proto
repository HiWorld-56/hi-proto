syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/ai/plugin.proto";
import "hi/options.proto";

// 插件管理(主体=插件)。**hi.ai.Plugin 的门面**,纯透传 → 类型直接复用 hi.ai(有意为之)。
//
// 插件只剩 **py 脚本一种** —— 网搜(search)/画图(draw)已随 ai 整体砍掉:
// 那两类完全可以封装进 py 脚本里执行,且局限性太大(比如不好传入用户数据)。
// 故 DrawConfig / SearchCreate / DrawCreate / GetDraw 一并删除。
//
// ⚠️ club 侧的实际代码活(不只是改名):
//   1. **上传脚本工程(Create)时,自动把该机器人的 ExAPIKey 塞进去** —— 这是根除
//      "运行期回调三方要 apikey"那套机制的落地点(ai 的 UserCallback 已删)。
//   2. apikey **挂机器人名下、不挂用户**,以便机器人换持有者后脚本照常跑。
//   3. **删 apikey 前必须查是否被插件引用,被引用则拒删**(创建插件时已把它注入进去了)。
service Plugin {
  rpc Create (hi.ai.CreateReq) returns (hi.ai.CreateResp) { option (hi.auth) = AUTH_USER; }                          // 上传插件版本(原 PythonCreate;存在则覆盖)
  rpc Edit (hi.ai.EditPluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                   // 改插件
  rpc Get (hi.ai.GetPluginReq) returns (hi.ai.GetPluginResp) { option (hi.auth) = AUTH_USER; }                       // 查单个插件版本
  rpc List (hi.ai.ListPluginReq) returns (hi.ai.ListPluginResp) { option (hi.auth) = AUTH_USER; }                    // 一级页:列脚本(每 uuid 一行,返回激活版本)
  rpc ListVersions (hi.ai.ListVersionsReq) returns (hi.ai.ListPluginResp) { option (hi.auth) = AUTH_USER; }         // 二级页:列某脚本的所有版本
  rpc Delete (hi.ai.DeletePluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }               // 删某个版本
  rpc DeleteByDids (hi.ai.DeletePluginByDidsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }   // 按 agent 批量删
  rpc SetActiveVersion (hi.ai.SetActiveVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 选定供 function call 调用的版本
  rpc GetParams (hi.ai.GetParamsReq) returns (hi.ai.GetParamsResp) { option (hi.auth) = AUTH_USER; }                 // 取 function call 参数 schema(原 GetPythonParams)
  rpc SetEnabled (hi.ai.SetEnabledReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }             // 脚本级开关:是否参与推理(记忆开关已移到 Agent.Edit)
}
