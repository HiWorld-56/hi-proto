syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/ai/plugin.proto";
import "hi/options.proto";
import "hi/common.proto";

// 插件管理(主体=插件)。**hi.ai.Plugin 的门面**,纯透传 → 类型直接复用 hi.ai(有意为之)。
//
// 插件只剩 **py 脚本一种** —— 网搜/画图已随 ai 整体砍掉(可封装进 py 脚本)。
//
// ⚠️ club 侧的实际代码活(不只是改名):
//   1. **建壳/引用(CreateShell/CreateUsing)时,自动把该机器人的 club-apikey 塞进 annex** ——
//      根除"运行期回调三方要 apikey"那套机制的落地点。
//   2. apikey **挂机器人名下、不挂用户**,机器人换持有者后脚本照常跑。
//   3. **删 apikey 前必须查是否被插件引用,被引用则拒删**。
//
// 三层模型见 hi/ai/plugin.proto:壳(uuid,name)/ 版本(uuid,version,本体)/ 使用(agent,uuid,激活版本)。
service Plugin {
  rpc CreateShell (hi.ai.CreateShellReq) returns (hi.ai.CreateShellResp) { option (hi.auth) = AUTH_USER; }           // 建空壳(后台分配 uuid;club 取 agent 第一个 apikey 塞进 annex)
  rpc CreateVersion (hi.ai.CreateVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }       // 给壳加版本
  rpc CreateUsing (hi.ai.CreateUsingReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }           // 把已有壳绑到某 agent(插件市场引用;club 取该 agent apikey)
  rpc Edit (hi.ai.EditPluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                   // 只改 using 的 annex
  rpc Get (hi.ai.GetPluginReq) returns (hi.ai.GetPluginResp) { option (hi.auth) = AUTH_USER; }                       // 查单个插件
  rpc List (hi.ai.ListPluginsReq) returns (hi.ai.ListPluginsResp) { option (hi.auth) = AUTH_USER; }                  // 一级页:列壳 + 该 agent 激活版本
  rpc ListVersions (hi.ai.ListVersionsReq) returns (hi.ai.ListVersionsResp) { option (hi.auth) = AUTH_USER; }        // 二级页:列某壳所有版本
  rpc Delete (hi.ai.DeleteVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }              // 删某个版本(仅创建者)
  rpc DeleteVersions (hi.ai.DeleteVersionsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }     // 批量删版本(范围,仅创建者)
  rpc DeleteShell (hi.ai.DeleteShellReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }           // 从机器人移除单个插件(创建者删壳/引用方解绑)
  rpc DeleteShells (hi.ai.DeleteShellsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }        // 批量从机器人移除多个插件
  rpc DeleteByAgents (hi.ai.DeletePluginByAgentsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 按 agent 批量删
  rpc SetActive (hi.ai.SetActiveReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }               // 选该 agent 激活版本
  rpc SetEnabled (hi.ai.SetEnabledReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }             // 插件级开关
}
