syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "hi/did/user_extension.proto";
import "hi/options.proto";

service UserExtension {
  // 取某商户下某用户的扩展数据(如金标标记)。club 的节点渲染只需要这一个:
  // 用户选一个自己所在的商户节点 -> 按 (merchant, user) 取字段 -> 渲染。
  // 跨商户读由 did 侧的 requireGrant 把关(该商户须先授权 club)。
  rpc Get (hi.did.UserExtensionGetReq) returns (hi.did.UserExtensionGetResp) { option (hi.auth) = AUTH_TOKEN; }
}
