syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// Order.Pull 的**签名载荷 schema**(不是 rpc 参数):
// rpc 收的是 hi.SignedData,后端把 SignedData.Data 反序列化进它。
// ⚠️ 只被后端 Go 引用、proto 里无 rpc 引用 —— **勿按"无引用"当死 message 删**。
message PullOrdersData {
  string did   = 1;
  string nonce = 2;
}

// 我的订单(hidid-pc 为订单主体拉取)→ SELF。
//
// 原先第一个字段是 `id`,填的是 hi_trade_sub_order 库的自增主键,违反
// "自增 id 禁止跨端流转"铁律,且下游回传只认 order_id(uuid),从无消费方,已删除。
//
// ⚠️ **字段号在 dev.87 整体前移过一位**(order_id..status 2..9 → 1..8)。
// 老客户端(pre-dev.87 生成码)解新响应会 **硬报错**,不是"静默解错":
// 新的 `did`(7, string) 落在老的 `updated_at`(7, int64) 上 —— Dart 的 protobuf
// 对 int64 字段**接受 length-delimited**(按 packed 重复处理),于是把字符串字节
// 当 varint 一路读下去,流当场错位,最后 `InvalidProtocolBufferException: input
// ended unexpectedly`,grpc-dart 再包成 **code 15 DATA_LOSS "Error parsing response"**。
// (protoc/Go 的解码器则是宽容的 —— 同一段字节只是字段错位、不报错。
//  所以"我这边解得开"不能作为客户端不用升级的理由。)
message PcOrder {
  option (hi.audience) = VIS_SELF;
  string order_id   = 1 [(hi.visibility) = VIS_SELF];
  string to_did     = 2 [(hi.visibility) = VIS_SELF];
  string amount     = 3 [(hi.visibility) = VIS_SELF];
  string type       = 4 [(hi.visibility) = VIS_SELF];
  int64  created_at = 5 [(hi.visibility) = VIS_SELF];
  int64  updated_at = 6 [(hi.visibility) = VIS_SELF];
  string did        = 7 [(hi.visibility) = VIS_SELF];
  string status     = 8 [(hi.visibility) = VIS_SELF];
}

message PullOrdersResp {
  option (hi.audience) = VIS_SELF;
  repeated PcOrder orders = 1 [(hi.visibility) = VIS_SELF];
}

message OrderResult {
  string order_id  = 1;
  string status    = 2;
  string tx_hash   = 3;
  int64  timestamp = 4;
}

// Order.Report 的**签名载荷 schema**(同上,勿当死 message 删)。
message ReportResultsData {
  string                       did    = 1;
  repeated OrderResult orders = 2;
}

// hidid-pc **拉单**并回传处理结果(web3 自证)。裁决#10 的 club 侧。
//
// 为什么叫 Pull:hidid 后端**只转发"有新单"的通知**,订单本身由 PC 端直接来业务后台拉、
// 处理完再直接回传结果 —— 订单数据一旦经 hidid 中转,hidid 就有造假空间。
// 所以除通知外,PC 端与业务后台是**直连**的,这两个 rpc 就是那条直连通道的两端。
//
// 旧名 `ListNotPulled` / `UpdatePulled` 是照着库里 `no_pull` 状态起的 —— 拿**存储的内部状态**
// 当接口名,调用方根本不关心什么"没被拉过";而且 `List` 读着像只读,实际这一下有副作用
// (状态推进 no_pull→created、消掉 nonce、重复拉还会换 uuid)。
service Order {
  rpc Pull (hi.SignedData) returns (PullOrdersResp) { option (hi.auth) = AUTH_WEB3; }              // 原 ListNotPulled / GetNotPulledPcOrders
  rpc Report (hi.SignedData) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_WEB3; }     // 原 UpdatePulled / UpdatePulledPcOrders
}
