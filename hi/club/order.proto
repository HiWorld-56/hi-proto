syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// Order.ListNotPulled 的**签名载荷 schema**(不是 rpc 参数):
// rpc 收的是 hi.SignedData,后端把 SignedData.Data 反序列化进它。
// ⚠️ 只被后端 Go 引用、proto 里无 rpc 引用 —— **勿按"无引用"当死 message 删**。
message PcOrderData {
  string did   = 1;
  string nonce = 2;
}

// 我的订单(hidid-pc 为订单主体拉取)→ SELF。
message PcOrder {
  option (hi.audience) = VIS_SELF;
  reserved 1;         // 原 id:填的是 hi_trade_sub_order 库自增主键,违反"自增id禁止跨端流转"铁律;
  reserved "id";      //   且下游回传只认 order_id(SubOrderId,uuid),id 从无消费方 → 删除。
  string order_id   = 2 [(hi.visibility) = VIS_SELF];
  string to_did     = 3 [(hi.visibility) = VIS_SELF];
  string amount     = 4 [(hi.visibility) = VIS_SELF];
  string type       = 5 [(hi.visibility) = VIS_SELF];
  int64  created_at = 6 [(hi.visibility) = VIS_SELF];
  int64  updated_at = 7 [(hi.visibility) = VIS_SELF];
  string did        = 8 [(hi.visibility) = VIS_SELF];
  string status     = 9 [(hi.visibility) = VIS_SELF];
}

message GetNotPulledPcOrdersResp {
  option (hi.audience) = VIS_SELF;
  repeated PcOrder orders = 1 [(hi.visibility) = VIS_SELF];
}

message UpdatePulledPcOrder {
  string order_id  = 1;
  string status    = 2;
  string tx_hash   = 3;
  int64  timestamp = 4;
}

// Order.MarkPulled 的**签名载荷 schema**(同上,勿当死 message 删)。
message UpdatePulledPcOrderData {
  string                       did    = 1;
  repeated UpdatePulledPcOrder orders = 2;
}

// hidid-pc 拉未处理订单 / 回传处理结果(web3 自证)。裁决#10 的 club 侧。
service Order {
  rpc ListNotPulled (hi.SignedData) returns (GetNotPulledPcOrdersResp) { option (hi.auth) = AUTH_WEB3; } // 原 GetNotPulledPcOrders
  rpc UpdatePulled (hi.SignedData) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_WEB3; }      // 原 UpdatePulledPcOrders
}
