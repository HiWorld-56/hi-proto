syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/merchant.proto";
import "hi/options.proto";

// 列某商户名下的 greeter(扩展表 level >= 8)。
//
// ⚠️ merchant **必填**,与 did 侧同名字段不同语义:did 那边"不传=自己",因为调用者本身
//    就是商户(ExtendToken 解出);club 的调用者是普通用户、不是商户,"自己"无从谈起。
//    故这里不照搬 hi.did.ListGreetersReq —— 同名字段两种语义,是最容易出事的复用。
message ListGreetersReq {
  optional string merchant   = 1 [(buf.validate.field).string.pattern="^\\S+$", (buf.validate.field).required = true]; // 目标商户 did
  hi.Pagination   pagination = 2;
}

// 用户把**自己**加入某商户。
//
// ⚠️ **没有 user 字段,且永远不要加** —— 用户 did 恒取自登录 token。
//    加了它,任何登录用户都能把别人塞进任意商户名下,而这个动作在 did 那一侧
//    是以 **club 这个商户**的身份做的、did 无从分辨真正的发起人。
//    身份必须来自 token,不能来自入参(同 hi.did.Merchant.Get 那个越权教训)。
message JoinMerchantReq {
  optional string merchant = 1 [(buf.validate.field).string.pattern="^\\S+$", (buf.validate.field).required = true]; // 要加入的商户 did
}

// 商户(用户档)。**club 侧目前没有商户的概念** —— 本 service 只是**转发 hidid 的商户方法**。
service Merchant {
  rpc List (google.protobuf.Empty) returns (hi.did.MerchantListResp) { option (hi.auth) = AUTH_USER; } // 查询用户所在的商户列表(转发 did.Merchant.ListMerchants)

  // 链路:club 用户 --用户token--> club后台 --ExtendToken--> did后台。
  // club 手里只有自己的商户凭证,所以到了 did 侧是"club 这个商户要读**别家商户**的用户扩展",
  // 必须由目标商户先授权给 club(did 侧 requireGrant 校验)。
  // club 侧不再叠鉴权:所有登录用户都能调。
  rpc ListGreeters (ListGreetersReq) returns (hi.did.ListUsersResp) { option (hi.auth) = AUTH_USER; } // 列某商户的 greeter(转发 did.Merchant.ListGreeters)

  // 用户把自己加入某商户。链路:app --用户token--> club后台 --club的ExtendToken-->
  // did.MerchantGranted.AddUsers(merchant=目标商户, users=[登录用户]).
  //
  // club 侧同样不叠鉴权(与 ListGreeters 一致):真正的门在 did 侧 ——
  // 目标商户必须把 **MERCHANT_GRANT_SCOPE_ADD_USERS** 这一项授权给 club,
  // 没给就是 PermissionDenied,不是静默成功。
  rpc Join (JoinMerchantReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 用户加入某商户(转发 did.MerchantGranted.AddUsers)
}

// 商户管理(超管)。原 `Merchant.ListAll` —— 超管方法蹲在用户面 service 里(混档),
// 照 did 的 Merchant / MerchantManage 范式拆出来;拆出后 `ListAll` 改回 `List`
// (主体已由 service 名表达,再叫 ListAll 是冗余)。转发 did.MerchantManage.List。
service MerchantManage {
  rpc List (hi.Pagination) returns (hi.did.MerchantListResp) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:列所有商户
}
