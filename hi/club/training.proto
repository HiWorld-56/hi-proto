syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/ai/training.proto";
import "hi/options.proto";

// Token鉴权
service Training {
  rpc TrainingAgent (hi.ai.TrainingAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }                // 启动训练
  rpc TrainingStatus (hi.ai.TrainingStatusReq) returns (hi.ai.TrainingStatusResp) { option (hi.auth) = AUTH_TOKEN; }           // 获取训练状态
  rpc TrainingClear (hi.ai.TrainingClearReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }                // 清除训练状态
  rpc UploadFile (hi.ai.UploadFileReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }                      // 上传训练文件
  rpc ListAgentFiles (hi.ai.ListAgentFileReq) returns (hi.ai.ListAgentFileResp) { option (hi.auth) = AUTH_TOKEN; }              // 获取训练文件列表
  rpc DeleteAgentFile (hi.ai.DeleteAgentFileReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }            // 删除训练文件
  rpc DeleteAgentFiles (hi.ai.DeleteAgentFilesReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }          // 批量删除训练文件
  rpc GetAgentFile (hi.ai.GetAgentFileReq) returns (hi.ai.GetAgentFileResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc UpdateContent (hi.ai.UpdateContentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }
  rpc CreateContent (hi.ai.CreateContentReq) returns (hi.ai.CreateContentResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc EditDigest (hi.ai.EditDigestReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }
  rpc SetMemModel (hi.ai.SetMemModelReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }
  rpc GetMemModel (hi.ai.GetMemModelReq) returns (hi.ai.GetMemModelResp) { option (hi.auth) = AUTH_TOKEN; }
}
