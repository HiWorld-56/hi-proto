syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/ai/training.proto";
import "hi/options.proto";

// 训练/记忆(主体=训练)。**hi.ai.Training 的门面**,纯透传 → 类型直接复用 hi.ai(有意为之)。
//
// 去 stutter(跟 ai 定稿):TrainingAgent/TrainingStatus/TrainingClear → Start/Status/Clear;
// 文件类方法的 "Agent" 是入参不是主体 → ListAgentFiles → ListFiles 等。
service Training {
  // ── 训练任务 ──
  rpc Start (hi.ai.StartReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                   // 启动训练(原 TrainingAgent)
  rpc Status (hi.ai.StatusReq) returns (hi.ai.StatusResp) { option (hi.auth) = AUTH_USER; }                      // 训练状态(原 TrainingStatus)
  rpc Clear (hi.ai.ClearReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }                   // 清除记忆/训练(原 TrainingClear)
  // ── 训练文件 ──
  rpc ListFiles (hi.ai.ListFilesReq) returns (hi.ai.ListFilesResp) { option (hi.auth) = AUTH_USER; }             // 列训练文件(原 ListAgentFiles)
  rpc GetFile (hi.ai.GetFileReq) returns (hi.ai.GetFileResp) { option (hi.auth) = AUTH_USER; }                   // 取单个训练文件(原 GetAgentFile)
  rpc DeleteFiles (hi.ai.DeleteFilesReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }       // 批量删(带 agent 归属;原单删 DeleteFile 越权已删)
  // ── 文本记忆条目 ──
  rpc CreateContent (hi.ai.CreateContentReq) returns (hi.ai.CreateContentResp) { option (hi.auth) = AUTH_USER; } // 建文本记忆
  rpc UpdateContent (hi.ai.UpdateContentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }   // 改文本记忆
  rpc EditDigest (hi.ai.EditDigestReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; }         // 改摘要
}
// 记忆模型 mem_model 已并入 ai.AgentConfig.ModelSet,经 Agent.Edit 设置(原 SetMemModel/GetMemModel 已删)。
