syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// ── 权限(原 UserACL)────────────────────────────────────────────────────────
// **继承 hi.ai 的权限分类**(设计文档《HiClub.权限控制》开篇即写"继承 HiAI.模型权限控制"):
//   normal 普通 / advanced 高级 / mem 记忆 / plugin 插件
// 类型直接复用 hi.ai(有意为之,见 agent.proto 顶部说明)。
//
// ⚠️ **但 club 不是纯门面** —— 它在继承之上**增加了自己的控制项**(文档《HiClub.权限控制》):
//   - 普通:群人数上限 **300**
//   - 高级:APP 侧语音转文本默认开启;群人数上限 **1200**
//
// ⚠️⚠️ **取消高级权限的 club 侧副作用(重!后端必须实现)**:
//   1. 群成员分 3 类:群主 / 管理员 / 草民
//   2. 保留前 300 人,优先级 **群主 > 管理员 > 草民**
//   3. **其余人全部自动"退群"**(无视是否含管理员)
//   另:添加高级 → 用户所有群人数上限调 1200、新建群默认 1200;去除高级 → APP 侧语音转文本自动关闭。
//
// 未决(后端阶段定):授权限这个动作的入口在哪 —— 倾向 club 超管面为入口,
// 转发 ai 的 PermissionManage 成功后,club 再执行自己的收尾(群上限/踢人/语音开关)。

// ── 权限模型(club 自有)────────────────────────────────────────────────
// **权限归 club 自己管**,类型定义也放在这里 —— 曾经复用 hi.ai 的,那是错的:
// 两边模型相同但各存各的表、各判各的,不跨服务查(见 hi.ai.Permission 的说明)。
//
// 权限是 **bit 位**拼的,可组合。**授予的是实体本身(机器人),不从 master 继承** ——
// 机器人的能力写在它自己身上,没有 master 也能独立运作。
// 用途是**出问题时撤掉**(把瞎搞的机器人踢掉),不是逐步授予:建号即授全部。
//
// ⚠️ **人用户没有权限配置,只有机器人才有。**
enum PermissionType {
  // ⚠️ 纯占位。proto3 要求首值为 0,故删不掉,但**不代表"全部"或"不过滤"** ——
  //    传它一律按无效参数拒绝。要列全部传 PERMISSION_NORMAL:所有机器人都持有
  //    normal 位,按它筛天然等于不过滤,不需要另造一个"不过滤"的档。
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_NORMAL      = 1; // 普通:自由度/系统提示词/用户提示词。**所有机器人默认持有**
  PERMISSION_ADVANCED    = 2; // 高级:上下文数/对话模型/嵌入模型/STT 模型
  PERMISSION_MEM         = 3; // 记忆:上传资料/训练记忆
  PERMISSION_PLUGIN      = 4; // 插件:启用插件
}

// 查某台机器人的权限。
//
// ⚠️ 原先是 Get(Empty) 查"调用者自己" —— 而人用户根本没有权限配置,所以前端那三个
//    页面(robot_memory / robot_plugin / robot_setup)拿到的永远是空。它们真正要看的
//    是**那台机器人**能干什么。归属校验走 CheckAgentAccess(自己 / master / 超管)。
message GetAgentPermissionReq {
  string agent = 1 [(buf.validate.field).string.pattern="^\\S+$"]; // 机器人 did
}

message PermissionInfo {
  option (hi.audience) = VIS_SELF;
  string                  did         = 1 [(hi.visibility) = VIS_SELF];
  repeated PermissionType permissions = 2 [(hi.visibility) = VIS_SELF];
  string                  note        = 3 [(hi.visibility) = VIS_SELF];
}

message PermissionAddReq {
  string         did  = 1; // 机器人 did
  PermissionType type = 2;
}

message PermissionDeleteReq {
  string         did  = 1; // 机器人 did
  PermissionType type = 2;
}

message PermissionEditReq {
  string did  = 1;
  string note = 2;
}

message PermissionListReq {
  string         did        = 1; // 可选:按 did 过滤
  PermissionType type       = 2; // **必填**,须是四档之一;列全部传 NORMAL,不是 UNSPECIFIED
  hi.Pagination  pagination = 3;
}

message PermissionListResp {
  option (hi.audience) = VIS_SELF;
  int32                   total = 1 [(hi.visibility) = VIS_SELF];
  repeated PermissionInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

// 权限查询(用户档)。前端 robot_memory / robot_plugin / robot_setup 三个**普通用户页面**
// 拿它当 getPermissions 用(查自己有哪些权限以显隐功能)。
//
// ⚠️ **绝不能标超管** —— 前人在此犯过实打实的回归:按"整个 service 都是管理面"把它标成
//    SUPERADMIN,普通用户当场 PermissionDenied。故按主体拆成 查(用户)/ 管(超管)两个 service。
//
// ⚠️ **入参为空 = 强制查自己**。原 `UserACL.List(did, ...)` 带 did 参数,
//    **传谁的 did 都能查 → 任意用户可读他人 ACL**(原注释里的 TODO 早已指出)。
//    与 did 的 Merchant.Get 越权同一类病:身份必须来自 token,不能来自入参。
service Permission {
  rpc Get (GetAgentPermissionReq) returns (PermissionInfo) { option (hi.auth) = AUTH_USER; } // 查**某台机器人**有哪些权限
}

// 权限管理(超管)。**club 自有存储,不转发 hi.ai** —— 权限各自单独管理。
// club 侧还须执行自己的副作用(取消高级 → 群缩容踢人等,见文件头)。
service PermissionManage {
  rpc Add (PermissionAddReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }       // 超管:授予(追加)
  rpc Delete (PermissionDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:取消(伴随踢群等副作用)
  rpc Edit (PermissionEditReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }     // 超管:改备注
  rpc List (PermissionListReq) returns (PermissionListResp) { option (hi.auth) = AUTH_SUPERADMIN; }  // 超管:按类型列持有者
}
