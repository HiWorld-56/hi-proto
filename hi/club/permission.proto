syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// ── 机器人权限(**权威在 club**,存在 club 自己的库里)──────────────────────────
//
// 权限是**机器人自身的能力位**,授予的是机器人本身,不从 creator/master 继承 ——
// 机器人自己背授权,转手了也照常能用。四档:
//   normal 普通 / advanced 高级 / mem 记忆 / plugin 插件
// **新建机器人默认:普通 + 记忆 + 插件,不含高级**(10-27 用户定:用户不能自己选模型、改上下文条数)。
// 要给某台高级档,超管走 PermissionManage.Add。
//
// ## 为什么在 club,不在 hi.ai(10-27 用户定)
//
// 权限是**商户自己的业务规则**:多个商户共用 hi.ai 时,各自管各自的机器人能干什么。
// 放在 hi.ai 就是一份全局的规则替所有商户做主,商户之间会冲突。hi.ai 只是机器人容器,**没有权限概念**。
//
// ## 那「校验必须跟执行同一侧」怎么办
//
// 插件挂不挂进 tools、记忆拼不拼进上下文,是 hi.ai 推理时做的。所以 club **每一轮对话都把结论带过去**:
// `hi.ai.ChatReq.allow_plugins` / `allow_mem`,由 club 按这里的权限现算(club 发给 hi.ai 的每一条 ChatReq 都填)。
// hi.ai 照做,不自己判断。08-13 之前的病是「检查只长在改配置的路径上,拦得住改、拦不住用」——
// 现在「用」的那一刻也是 club 定的,不会再犯。
//
// ⚠️ club 自己的副作用(取消高级 → 群缩容等)仍在 club 做。
//
// ⚠️ 撤权**不删数据**:插件绑定、记忆文件都留着,只是不再参与推理;给回权限立刻恢复。

enum PermissionType {
  // ⚠️ 纯占位。proto3 要求首值为 0,故删不掉,但**不代表"全部"或"不过滤"** ——
  //    传它一律按无效参数拒绝。要列全部传 PERMISSION_NORMAL:所有机器人都持有
  //    normal 位,按它筛天然等于不过滤。
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_NORMAL      = 1; // 普通:自由度/系统提示词/用户提示词。**所有机器人默认持有**
  PERMISSION_ADVANCED    = 2; // 高级:上下文数/对话模型/嵌入模型/STT 模型。**默认不给**
  PERMISSION_MEM         = 3; // 记忆:上传资料/训练记忆;**撤掉后记忆不再进推理**
  PERMISSION_PLUGIN      = 4; // 插件:启用插件;**撤掉后插件不再挂进 tools**
}

message PermissionInfo {
  option (hi.audience) = VIS_SELF;
  string                  did         = 1 [(hi.visibility) = VIS_SELF]; // 机器人 did
  repeated PermissionType permissions = 2 [(hi.visibility) = VIS_SELF]; // 当前持有的档位
  optional string         note        = 3 [(hi.visibility) = VIS_SELF]; // 备注(为什么被撤,给人看的)
}

message ListAgentPermissionsReq {
  repeated string agents = 1; // 机器人 did 列表
}

message ListAgentPermissionsResp {
  option (hi.audience) = VIS_SELF;
  repeated PermissionInfo infos = 1 [(hi.visibility) = VIS_SELF];
}

message PermissionAddReq {
  string                  did  = 1 [(buf.validate.field).string.pattern = "^\\S+$"]; // 机器人 did
  optional PermissionType type = 2;
}

message PermissionDeleteReq {
  string                  did  = 1 [(buf.validate.field).string.pattern = "^\\S+$"];
  optional PermissionType type = 2;
}

// 按档位分页列持有者(超管页用)。
message PermissionListReq {
  optional string         did        = 1; // 可选:按 did 过滤;**不传=不筛**
  optional PermissionType type       = 2; // **必填**,须是四档之一;列全部传 NORMAL(所有机器人都持有它),不是 UNSPECIFIED
  hi.Pagination           pagination = 3;
}

message PermissionListResp {
  option (hi.audience) = VIS_SELF;
  optional int32          total = 1 [(hi.visibility) = VIS_SELF];
  repeated PermissionInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

message PermissionEditReq {
  string          did  = 1 [(buf.validate.field).string.pattern = "^\\S+$"];
  optional string note = 2; // 备注
}

// 权限查询(用户档)。前端 robot_memory / robot_plugin / robot_setup 三个**普通用户页面**
// 拿它当 getPermissions 用(查自己有哪些权限以显隐功能)。
//
// ⚠️ **绝不能标超管** —— 前人在此犯过实打实的回归:按"整个 service 都是管理面"把它标成
//    SUPERADMIN,普通用户当场 PermissionDenied。故按主体拆成 查(用户)/ 管(超管)两个 service。
//
// ⚠️ **入参为空 = 强制查自己**。原 `UserACL.List(did, ...)` 带 did 参数,
//    **传谁的 did 都能查 → 任意用户可读他人 ACL**。身份必须来自 token,不能来自入参。
service Permission {
  // 机器人查**自己**的权限。无参数 —— 身份取自 token/apikey,不接受入参指定。
  //
  // ⚠️ 人用户没有权限配置,只有机器人才有。前端那三个页面
  //    (robot_memory / robot_plugin / robot_setup)要看的是机器人能干什么:
  //    机器人自己调 Get,master 代查走 List。
  rpc Get (google.protobuf.Empty) returns (PermissionInfo) { option (hi.auth) = AUTH_USER; }
  rpc List (ListAgentPermissionsReq) returns (ListAgentPermissionsResp) { option (hi.auth) = AUTH_USER; } // master 批量查名下机器人的权限
}

// 权限管理(超管)。
service PermissionManage {
  rpc Add (PermissionAddReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }       // 超管:授予(追加)
  rpc Delete (PermissionDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:取消(伴随群缩容等副作用)
  rpc Edit (PermissionEditReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }     // 超管:改备注
  rpc List (PermissionListReq) returns (PermissionListResp) { option (hi.auth) = AUTH_SUPERADMIN; }        // 超管:按类型列持有者
}
