syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/base.proto";
import "hi/did/transfer.proto";

message TradeUnit {
  hi.did.Coin coin   = 1;
  hi.Entity   user   = 2;
  string      sum    = 3;
  string      amount = 4;
  string      fee    = 5;
}

message TradeBase {
  TradeUnit from      = 1;
  TradeUnit to        = 2;
  string    id        = 3;
  int64     timestamp = 4;
}

message GetTradeFeeReq {
  string coin = 1;
}

message GetTradeFeeResp {
  string fee = 1;
}

message GetTradeReq {
  string order = 1;
}

message TradeTrans {
  string                 id        = 1;
  hi.did.Transaction     trans     = 2;
  string                 status    = 3;
  int64                  timestamp = 4;
}

message TradeDetail {
  string                  order     = 1;
  string                  status    = 2;
  TradeUnit               from      = 3;
  TradeUnit               to        = 4;
  map<string, TradeTrans> list      = 5;
  int64                   timestamp = 8;
}

message GetTradeResp {
  TradeDetail detail = 1;
}

message AddTradeReq {
  TradeDetail detail = 1;
}

message AddTradeResp {
  TradeDetail detail = 1;
}

message UpdateTransHashReq {
  string id   = 1;
  string hash = 2;
}

// 交易列表的唯一入参:did/id 均为可选过滤条件(AIP-132:过滤走参数,不编码进方法名)。
message ListTradeReq {
  string        did        = 1; // 可选:只看该用户的交易;空=不按用户过滤
  string        id         = 2; // 可选:只看该交易;空=不按 id 过滤
  hi.Pagination pagination = 3;
}

message ListTradeResp {
  int32                total = 1;
  repeated TradeDetail list  = 2;
}

service Trade {
  rpc GetTradeFee (GetTradeFeeReq) returns (GetTradeFeeResp);
  rpc GetTrade (GetTradeReq) returns (GetTradeResp);
  rpc AddTrade (AddTradeReq) returns (AddTradeResp);
  rpc UpdateTransHash (UpdateTransHashReq) returns (google.protobuf.Empty);
  rpc List (ListTradeReq) returns (ListTradeResp); // 合并原 ListTrade(按 did)+ ListAllTrade(按 id/全量),过滤走参数
}
