syntax = "proto3";

package hi.club;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/club";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/base.proto";
import "hi/did/transfer.proto";
import "hi/options.proto";

message TradeUnit {
  hi.did.Coin coin   = 1;
  hi.Entity   user   = 2;
  string      sum    = 3;
  string      amount = 4;
  string      fee    = 5;
}

message TradeBase {
  TradeUnit from      = 1;
  TradeUnit to        = 2;
  string    id        = 3;
  int64     timestamp = 4;
}

message GetTradeFeeReq {
  string coin = 1;
}

message GetTradeFeeResp {
  string fee = 1;
}

message GetTradeReq {
  string order = 1;
}

message TradeTrans {
  string                 id        = 1;
  hi.did.Transaction     trans     = 2;
  string                 status    = 3;
  int64                  timestamp = 4;
}

message TradeDetail {
  string                  order     = 1;
  string                  status    = 2;
  TradeUnit               from      = 3;
  TradeUnit               to        = 4;
  map<string, TradeTrans> list      = 5;
  int64                   timestamp = 8;
}

message GetTradeResp {
  TradeDetail detail = 1;
}

message AddTradeReq {
  TradeDetail detail = 1;
}

message AddTradeResp {
  TradeDetail detail = 1;
}

message UpdateTransHashReq {
  string id   = 1;
  string hash = 2;
}

// 查自己的交易。
message ListTradeReq {
  string        did        = 1;
  string        id         = 2; // 可选:只看该交易
  hi.Pagination pagination = 3;
}

// 交易统计(内部使用)。id 为空 = 全量。
message ListAllTradeReq {
  string        id         = 1; // 可选:只看该交易;空=全量
  hi.Pagination pagination = 2;
}

message ListTradeResp {
  int32                total = 1;
  repeated TradeDetail list  = 2;
}

service Trade {
  rpc GetTradeFee (GetTradeFeeReq) returns (GetTradeFeeResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc GetTrade (GetTradeReq) returns (GetTradeResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc AddTrade (AddTradeReq) returns (AddTradeResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc UpdateTransHash (UpdateTransHashReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }
  // 查自己的交易(did 必填)。普通用户可调。
  rpc List (ListTradeReq) returns (ListTradeResp) { option (hi.auth) = AUTH_TOKEN; }
  // 交易统计:全量/按 id 查(id 为空=全量)。**内部使用**,仅超管可调。
  // 不与 List 合并:二者鉴权级别不同,而档位是按方法挂的 —— 合并会导致
  // "did 留空即拿到全部人的交易",把 filter 值变成越权入口。
  rpc ListAll (ListAllTradeReq) returns (ListTradeResp) { option (hi.auth) = AUTH_SUPERADMIN; }
}
