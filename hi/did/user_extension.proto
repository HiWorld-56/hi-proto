syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";
import "hi/did/base.proto";
import "hi/did/merchant.proto";

message UserExtensionSettingResp {
  string token = 1;
  string table = 2;
}

service UserExtensionSettings {
  rpc Update (google.protobuf.Empty) returns (UserExtensionSettingResp) { option (hi.auth) = AUTH_TOKEN; } // Token鉴权
  rpc Get (google.protobuf.Empty) returns (UserExtensionSettingResp) { option (hi.auth) = AUTH_TOKEN; } // Token鉴权
}

message Button {
  string bg_color = 1; // 背景色
  string title    = 2; // 按钮文字
  string type     = 3; // url类型: url, scheme
  string url      = 4; //
}

message Card {
  string title = 1; // 标题
  string text  = 2; // 文本
  string logo  = 3; // logo
  Button left  = 4; // 左按钮
  Button right = 5; // 右按钮
}

message UserExtensionUpdateReq {
  repeated UserExtensionUnit units = 1;
}

// 列某用户所属的商户。主体是**用户** —— 故归 UserExtension(用户扩展)而非 Merchant。
message ListMerchantsReq {
  string        user_did   = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 用户 did(注意:不是商户 did)
  hi.Pagination pagination = 2;
}

message UserExtensionGetReq {
  string merchant = 1;
  string user     = 2;
}

message UserExtensionGetResp {
  UserExtensionUnit unit = 1;
}

service UserExtension {
  rpc Update (UserExtensionUpdateReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // Extend-Token鉴权
  rpc Delete (UserExtensionDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // Extend-Token鉴权
  rpc Get (UserExtensionGetReq) returns (UserExtensionGetResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 某商户下某用户的扩展数据(跨商户须先获授权)
  // 列某用户所属的商户。原 Merchant.List(hi.DID) 搬来:主体是用户,归 UserExtension 才准确;
  // 裸 hi.DID 入参也换成正经 Req —— "这是用户 did 不是商户 did"写进类型,而非靠注释。
  rpc ListMerchants (ListMerchantsReq) returns (MerchantListResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }
}
