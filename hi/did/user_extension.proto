syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";
import "hi/did/merchant.proto";

// (原 UserExtensionSettings 是假名 —— 其实是"商户取/换自己的 ExtendToken",
//  已改名 MerchantExDB 迁至 merchant.proto。)

// 列某用户所属的商户。主体是**用户** —— 读作 "UserExtension.ListMerchants":
// 列出这个用户在哪些商户下有扩展(=属于哪些商户)。不返回扩展数据本身。
message ListMerchantsReq {
  string        user_did   = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 用户 did(注意:不是商户 did)
  hi.Pagination pagination = 2;
}

// 归位后 UserExtension 只剩 ListMerchants —— 扩展数据的读写全归 Merchant(商户主体),
// 用户不能读自己的扩展。这里只回答"某用户属于哪些商户"(不含扩展内容)。
service UserExtension {
  rpc ListMerchants (ListMerchantsReq) returns (MerchantListResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }
}
