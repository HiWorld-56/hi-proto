syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/base.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";

// 链（chain）：
//    ethereum
//    tron
//    filecoin（已废弃）
//    bitcoin
//    solana
//    aptos

message UpdateAddressesReq {
  optional string did = 1;
  optional string btc = 2;
  optional string eth = 3;
  optional string trx = 4;
  optional string sol = 5;
  optional string apt = 6;
}

message GetWalletReq {
  string did   = 1;
  string chain = 2;
}

message GetWalletResp {
  message Unit {
    string chain   = 1;
    string address = 2;
  }
  repeated Unit list = 1;
}

message ListAddressesReq {
  message Unit {
    string did   = 1;
    string chain = 2;
  }
  repeated Unit list = 1;
}

message ListAddressesResp {
  message Unit {
    string did     = 1;
    string chain   = 2;
    string address = 3;
  }
  repeated Unit list = 1;
}

message TotalAssetsReq {
  string currency = 1;
}

message TotalAssetsResp {
  string n = 1;
}

message ListUsersAssetsReq {
  string        currency   = 1;
  hi.Pagination pagination = 2;
}

message ListUsersAssetsResp {
  message Unit {
    string did    = 1;
    string avatar = 2;
    string n      = 3;
  }
  int32         total = 1;
  repeated Unit list  = 2;
}

message GetUserAssetsReq {
  string did  = 1;
  string coin = 2;
}

// 美元金额 = amount*price
// 人民币金额 = amount*price*exchange
message GetUserAssetsResp {
  message Unit {
    Coin   coin    = 1;
    string address = 2;
    string amount  = 3; // 金额
    string price   = 4; // 币价，单位USDT
  }
  repeated Unit unit     = 1;
  string        exchange = 2; // 汇率：USD->CNY
}

message UpdateAssetsReq { // Token ----> Real.DID
  string did        = 1;
  string btc        = 2;
  string eth        = 31;
  string usdt_erc20 = 32;
  string trx        = 41;
  string usdt_trc20 = 42;
  string whds_trc20 = 43;
  string bt_trc20   = 44;
  string sol        = 51;
  string usdt_sol   = 52;
  string bt_sol     = 53;
  string panda_sol  = 54;
  string apt        = 61;
  string whds_apt   = 62;
  string hwhd_apt   = 63;
  string slkj_apt   = 64;
  string wsm_apt    = 65;
}

// 用户自己的钱包(用户主体,token)。UpdateAddresses 需签名证明地址归属,故 web3 —— 已拆去 Assets。
service Wallet {
  rpc UpdateAssets (UpdateAssetsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_USER; } // 用户:刷新自己的资产快照
  rpc Get (GetWalletReq) returns (GetWalletResp) { option (hi.auth) = AUTH_USER; }               // 用户:查某链的钱包地址(原 GetWallet 去 stutter)
  rpc ListAddresses (ListAddressesReq) returns (ListAddressesResp) { option (hi.auth) = AUTH_USER; }   // 用户:列出全部链地址
}

// 资产/地址(公开 + web3,web3 视为无鉴权,档位一致)。资产查询是链上公开数据;
// UpdateAddresses 用签名自证地址归属(不依赖登录 token),故归此。
service Assets {
  rpc Total (TotalAssetsReq) returns (TotalAssetsResp) { option (hi.auth) = AUTH_NONE; } // 公开:总资产统计(链上数据;原 TotalAssets 去 stutter)
  rpc List (ListUsersAssetsReq) returns (ListUsersAssetsResp) { option (hi.auth) = AUTH_NONE; } // 公开:批量用户资产(链上数据;原 ListUsersAssets)
  rpc Get (GetUserAssetsReq) returns (GetUserAssetsResp) { option (hi.auth) = AUTH_NONE; } // 公开:某用户资产(链上数据;原 GetUserAssets)
  rpc UpdateAddresses (hi.SignedData) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_WEB3; }    // web3:更新用户各链地址(btc/eth/trx/sol/apt),签名自证
}
