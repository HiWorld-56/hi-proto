syntax = "proto3";

package hi.did;

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

message RefreshTokenReq {
  hi.ClientInfo   node          = 1;
  string          did           = 2;
  optional string refresh_token = 3;
}

// hidid web/app/pc登录
message LoginReq {
  optional string req_id = 1;
  string          did    = 2;
  hi.ClientInfo   node   = 3;
}

message LoginResp {
  option (hi.audience) = VIS_SELF;
  hi.Entity          user  = 1 [(hi.visibility) = VIS_PUBLIC];
  hi.AuthToken       token = 2 [(hi.visibility) = VIS_SELF];
  hi.MqttCredentials mqtt  = 3 [(hi.visibility) = VIS_SELF];
}

message GenerateReqIdReq {
  string        did  = 1;
  hi.ClientInfo node = 2;
}

message ReqStatusResp {
  option (hi.audience) = VIS_SELF;
  hi.Entity          base   = 1 [(hi.visibility) = VIS_PUBLIC];
  optional string    status = 2 [(hi.visibility) = VIS_SELF];
  hi.AuthToken       token  = 3 [(hi.visibility) = VIS_SELF];
  hi.MqttCredentials mqtt   = 4 [(hi.visibility) = VIS_SELF];
}

// web3 载荷 schema(不是 rpc 参数):Auth.Logout 把 SignedData.Data 反序列化进它。
// ⚠️ 只被后端 Go 引用、proto 里无 rpc 引用 —— 勿按"无 rpc 引用"当死 message 删。
message LogoutReq {
  hi.DID did = 1;
}

// Auth —— 登录/登出。握手类是公开的(此时还没 token),身份确认类是 web3 验签(载荷带签名)。
// 公开 与 web3验签 同处一个 service 是允许的(web3 本质是数据校验,不是方法鉴权)。
//
// ⭐ 客户端**只有 `Verify` 一个入口**(扫码、深链唤起都是它),分叉在后端。
//
// 后端解出 web3 载荷后,**只拿 `req_id` 去查会话**,判据是**会话里的发起方 did**:
// 是 hi-did 自己的哨兵(hisrv 这类自家后台把自己冒充成三方接进同一条流程)就自己发 token;
// 是某个商户就只验签+转发、回拨商户 `LoginCallback`,token 由商户自己发。
//
// ⚠️ **载荷里的 `did` 字段没有任何地方读过**(hi-did 与 club 两侧都核过) —— 它只是发起方
//    自报。客户端不必、也不该拿它替后端断言"这一定是三方":那正是 2026-08-18
//    hidid-simple-app 报「需要注册为商户」的成因(截图粘贴来的码本质就是扫码,只有裸 reqId)。
//
// ⚠️ **冒充别的商户不成立**:商户自己也按 reqId 记一本账(如 club 的 `UserLogin` 第一步就查
//    自己的会话),reqId 不是经它申请出来的,回拨那一步直接失败。两本账对不上就走不下去。
//
// ── `Notify` 的下场(2026-08-19,同一天删了两次)────────────────────────────
// 它曾是"三方那半截"的单独入口,功能上是 `Verify` 的**子集**(只有三方那一支,
// 还少了自家哨兵那一支)。08-18 第一次删,当天生产大面积「hidid 授权 hiclub 登录失败」——
// **不是删错了,是删早了**:已发布的 hidid-app 深链那条一直在调它。
//
// 那次的真正教训是**它挂得静悄悄**:gRPC 未知方法在进拦截器**之前**就被 transport 拒,
// 服务端一个字都不记 —— 日志里零错误,只有用户在报障。
// **删 rpc 之前先确认没有已发布的客户端在调;"日志里没见过"不算证据,调不通的恰恰不留痕迹。**
//
// 现在客户端已经改成一律走 `Verify` 并验证可用,故正式删除,不留兼容入口。
// **不要再加回来。**
service Auth {
  rpc RefreshToken (RefreshTokenReq) returns (hi.AuthToken) { option (hi.auth) = AUTH_NONE; }      // 公开:用 refresh token 换新 token(内部自校验)
  rpc Verify (hi.SignedData) returns (LoginResp) { option (hi.auth) = AUTH_WEB3; }                 // 验签:助记词/硬件登录,验签后签发 token
  rpc VerifyOffline (hi.SignedData) returns (LoginResp) { option (hi.auth) = AUTH_WEB3; }          // 验签:离线登录变体(内部服务用)
  rpc GenerateReqId (GenerateReqIdReq) returns (hi.RequestId) { option (hi.auth) = AUTH_NONE; }    // 公开:生成扫码登录的 reqId
  rpc GetReqStatus (hi.RequestId) returns (ReqStatusResp) { option (hi.auth) = AUTH_NONE; }        // 公开:轮询扫码登录状态
  rpc Logout (hi.SignedData) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_WEB3; }     // 验签:登出
}
