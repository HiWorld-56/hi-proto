syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/options.proto";

message GatewayConfigUnit {
  string name    = 1; //aptos/bitcoin/ethereum/solana/tatum/tron-grpc/tron-http
  string url     = 2;
  string api_key = 3;
}

message GatewayConfigListResp {
  repeated GatewayConfigUnit list = 1;
}

message GatewayConfigSetReq {
  repeated GatewayConfigUnit list = 1;
}

// 网关配置(区块链节点 url + api_key)。这是**给前端用的配置**:hidid app 的 hidid-core、
// 以及 hiclub(内嵌 hidid-core)都要拿它去连区块链节点。resp 里的 api_key 是**共享的节点访问凭证**
// (非用户私密),前端连节点必须带。故:
//   - List:开放给 token(app 用户)或 ExtendToken(hiclub 商户)——前端读配置。
//   - Set :只有超管能写。
// ⚠️ 后端(开发/生产)不要走这个 RPC 取配置 —— 生产与开发/前端环境不同,后端应从自己的配置文件引入。
service GatewayConfig  {
  // 列出网关配置(前端读)。token 或 ExtendToken 均可。
  rpc List (google.protobuf.Empty) returns (GatewayConfigListResp) { option (hi.auth) = AUTH_TOKEN_OR_EXTEND; }
  // 写网关配置。仅超管。
  rpc Set (GatewayConfigSetReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }
}