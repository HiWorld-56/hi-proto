syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/options.proto";

message GatewayConfigUnit {
  string name    = 1; //aptos/bitcoin/ethereum/solana/tatum/tron-grpc/tron-http
  string url     = 2;
  string api_key = 3;
}

message GatewayConfigListResp {
  repeated GatewayConfigUnit list = 1;
}

message GatewayConfigSetReq {
  repeated GatewayConfigUnit list = 1;
}

service GatewayConfig  {
  // 网关配置列表。此前免鉴权;调用方是主服务(club 等)持 ExtendToken 转发,
  // 故用 AUTH_EXTEND_TOKEN 而非 AUTH_TOKEN —— 后者会让 club 的转发直接 401(它不带用户 Token)。
  rpc List (google.protobuf.Empty) returns (GatewayConfigListResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }
  // 设置网关配置(含 api_key)。**内部使用**:handler 里本就有 IsAdmin 校验,
  // 现收敛到拦截器 —— AUTH_SUPERADMIN = token 鉴权 + 多一层"当前用户是否超管"。
  rpc Set (GatewayConfigSetReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }
}