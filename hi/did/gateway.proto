syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/options.proto";

message GatewayConfigUnit {
  string name    = 1; //aptos/bitcoin/ethereum/solana/tatum/tron-grpc/tron-http
  string url     = 2;
  string api_key = 3;
}

message GatewayConfigListResp {
  repeated GatewayConfigUnit list = 1;
}

message GatewayConfigSetReq {
  repeated GatewayConfigUnit list = 1;
}

// 网关配置(区块链节点 url + api_key)。**纯内部运维接口**,整个 service 都只有超管能碰。
//
// 唯一调用方是 hisrv web 的"网关配置"页,它直连 did 的 HTTP(9533)、带用户 token。
// 该页在前端属于"内部使用"菜单组,只对超管显示 —— 但那只是菜单显隐,
// 路由守卫只查有没有 token,敲 URL 就能进。所以真正的闸门只有这里。
service GatewayConfig  {
  // 列出网关配置。resp 里含 api_key,泄露即等于把节点凭证给出去。
  rpc List (google.protobuf.Empty) returns (GatewayConfigListResp) { option (hi.auth) = AUTH_SUPERADMIN; }
  rpc Set (GatewayConfigSetReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }
}