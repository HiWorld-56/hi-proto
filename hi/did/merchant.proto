syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/base.proto";
import "hi/options.proto";

message MerchantInfo {
  hi.Entity     master          = 1;
  hi.Entity     server          = 2;
  string        name            = 3;
  string        logo            = 4;
  repeated Coin public_coins    = 5; // 公共币种
  repeated Coin custom_tokens   = 6; // 自定义币种
  string        endpoint        = 7;
  string        scheme          = 8;
  string        extension_token = 9;
  int64         created_at      = 10;
}

message MerchantGetResp {
  MerchantInfo info = 1;
}

message MerchantSetReq {
  string          server   = 1;
  string          name     = 2;
  string          logo     = 3;
  repeated string coins    = 4;
  string          endpoint = 5;
  string          scheme   = 6;
  string          comment  = 7;
}

message MerchantListResp {
  int32                 total = 1;
  repeated MerchantInfo list  = 2;
}

message GetUserProfileResp {
  hi.Entity          base = 1;
  hi.MqttCredentials mqtt = 2;
}

message SetUserProfileReq {
  string did    = 1;
  string name   = 2;
  string avatar = 3;
}

// 商户互授权:我(=ExtendToken 认出的商户)允许 grantee 访问我的数据。
// ⚠️ 入参里**没有授权方 did** —— 授权方永远取自 token,故商户只能改自己的授权列表。
message GrantReq {
  string grantee = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 被授权方商户 did
  string note    = 2; // 备注,给人看的
}

message GrantUnit {
  hi.Entity grantee    = 1; // 被授权方
  string    note       = 2;
  int64     created_at = 3; // ms
}

message ListGrantsResp {
  repeated GrantUnit grants = 1; // 我授权给了哪些商户
}

message MerchantUsersListReq {
  string        merchant   = 1; // 可选:指定商户(须先获其授权);空=自己(取 ExtendToken)
  string        user       = 2; // 可选:按用户 did 过滤
  hi.Pagination pagination = 3;
}

message MerchantUsersListResp {
  int32                      total = 1;
  repeated UserExtensionUnit units = 2;
}

message MerchantUsersSaveReq {
  repeated string users = 1; // 用户did
}

message MerchantUsersDeleteReq {
  repeated string users = 1; // 用户did
}

// ⚠️ 裁决 #3:这个 service 混了两个主体 —— Get/Set 是**用户**查/设自己绑的商户节点(用户token),
//    其余全是**商户**操作(ExtendToken)。TODO:把 Get/Set 拆去用户面 service。
//
// ⚠️ 裁决 #13:GetUserProfile/SetUserProfile/GetMerchant 现在没有授权校验 ——
//    club 就走 GetUserProfile 读用户档案。TODO:加互授权校验,无授权不得取他人商户的用户信息。
//
// 授权机制(裁决 #4,定稿):商户 X 操作商户 A 的数据时 —— 从 X 的 ExtendToken 解出 didx,
//    若 didx 在 A 的授权列表里则直接操作,**不回取 A 的 ExtendToken**。
service Merchant {
  // ── 用户主体(TODO 拆走)──
  rpc Get (google.protobuf.Empty) returns (MerchantGetResp) { option (hi.auth) = AUTH_TOKEN; }  // 用户:查自己绑定的商户节点信息
  rpc Set (MerchantSetReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }   // 用户:设置/更换自己绑定的商户节点
  // ── 商户主体 ──
  rpc GetUserProfile (hi.DID) returns (GetUserProfileResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }     // 商户:读某用户的档案(base + mqtt 凭证)。【⚠️ 缺授权校验】
  rpc SetUserProfile (SetUserProfileReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 商户:写某用户的档案(名字/头像)。【⚠️ 缺授权校验】
  rpc GetMerchant (hi.DID) returns (MerchantGetResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }           // 商户:按 did 查某商户的信息。【⚠️ 缺授权校验;此前还误在免鉴权表里】
  // ── 商户互授权 ──────────────────────────────────────────────
  // 商户之间平级,跨商户读数据必须显式授权。授权方 = ExtendToken 认出的商户(不在入参里)。
  rpc ListGrants (google.protobuf.Empty) returns (ListGrantsResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 我授权了哪些商户
  rpc AddGrant (GrantReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 授权某商户访问我的数据
  rpc RemoveGrant (GrantReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 取消授权
  // 列商户下的用户。merchant 空=自己(取 ExtendToken);非空=指定商户(须先获该商户授权)。
  // 合并原 UserExtension.List(商户从 token)+ ListByMerchantDid(商户从参数)——
  // 二者查的是同一张 extend_table、同一份数据,此前因信任模型不同不能合;
  // requireGrant 落地后,参数来的 merchant 必过授权校验,已无此顾虑。
  rpc ListUsers (MerchantUsersListReq) returns (MerchantUsersListResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }
  rpc SaveUsers (MerchantUsersSaveReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // ExtendToken鉴权, 批量添加商户的用户
  rpc DeleteUsers (MerchantUsersDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // ExtendToken鉴权，批量删除商户的用户
}

message MerchantNotifyReq {
  string did   = 1;
  string nonce = 2;
}

message OrderEventResp {
  string event   = 1;
  string payload = 2;
}

// SSE —— web3 自动付款机制(裁决 #10)。
//
// 架构:PC 端跑 hidid-pc,通过 SSE 与 hidid 后台保持长连接(hidid-pc 无公网 IP)。
// 流程:①商户业务系统在**自己的服务上**生成订单 → ②商户调 Notify → hidid 后端把通知转发给
//       对应的 hidid-pc → ③hidid-pc 按用户在软件里设置的地址**去拉订单** → ④付款 →
//       ⑤付款结果通过用户设置的地址回传。
// 关键:hidid 后端**只负责转发通知**,订单真伪由三方业务系统控制;拉单/回传的 url 都是用户填的,
//       hidid-pc 直接对接三方、不经 hidid 后台 —— 排除了 hidid 后台伪造订单的可能。
service SSE {
  rpc OrderEvents (hi.DID) returns (stream OrderEventResp) { option (hi.auth) = AUTH_TOKEN; }      // hidid-pc 订阅订单事件流(长连接)
  rpc Notify (MerchantNotifyReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; } // 商户触发一次付款通知,转发给对应 hidid-pc。公开=只是转发触发器,真伪由三方+用户填的 url 兜底
}
