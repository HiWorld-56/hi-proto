syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/base.proto";
import "hi/options.proto";

message MerchantInfo {
  hi.Entity     master          = 1;
  hi.Entity     server          = 2;
  string        name            = 3;
  string        logo            = 4;
  repeated Coin public_coins    = 5; // 公共币种
  repeated Coin custom_tokens   = 6; // 自定义币种
  string        endpoint        = 7;
  string        scheme          = 8;
  string        extension_token = 9;
  int64         created_at      = 10;
}

message MerchantGetResp {
  MerchantInfo info = 1;
}

message MerchantSetReq {
  string          server   = 1;
  string          name     = 2;
  string          logo     = 3;
  repeated string coins    = 4;
  string          endpoint = 5;
  string          scheme   = 6;
  string          comment  = 7;
}

message MerchantListResp {
  int32                 total = 1;
  repeated MerchantInfo list  = 2;
}

// ── 用户扩展的数据形状 ───────────────────────────────────────────────
// 商户给自己名下用户挂的扩展信息(金标/等级/名片等)。
// 从 base.proto 迁来:归位后只有 Merchant(商户主体)读写扩展,放这里最贴切,
// 且 merchant.proto 不 import user_extension.proto,不会成环。
message UserExtensionInfo {
  optional string logo   = 1;
  optional int32  level  = 2;
  optional string card   = 3;
  optional string extend = 4;
  optional string note   = 5;
}

message UserExtensionUnit {
  hi.Entity         user = 1; // 用户实体(name/avatar);handler 须始终填,即使无扩展行
  UserExtensionInfo info = 2; // 扩展信息(该商户维护)
}

// ── 商户互授权 ───────────────────────────────────────────────────────
// 我(=ExtendToken 认出的商户)允许 grantee 访问我的数据。
// ⚠️ 入参里**没有授权方 did** —— 授权方永远取自 token,故商户只能改自己的授权列表。
message GrantReq {
  string grantee = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 被授权方商户 did
  string note    = 2; // 备注,给人看的
}

message GrantUnit {
  hi.Entity grantee    = 1; // 被授权方
  string    note       = 2;
  int64     created_at = 3; // ms
}

message ListGrantsResp {
  repeated GrantUnit grants = 1; // 我授权给了哪些商户
}

// ── 商户管理用户(扩展数据)的入参 ───────────────────────────────────
// merchant 空=自己(取 ExtendToken);非空=指定商户(须先获该商户授权,requireGrant)。
message GetUserReq {
  string merchant = 1; // 商户 did;空=自己
  string user     = 2; // 用户 did
}

message ListUsersReq {
  string        merchant   = 1; // 空=自己;非空=指定商户(须先获授权)
  string        user       = 2; // 可选:按用户 did 过滤
  hi.Pagination pagination = 3;
}

message ListUsersResp {
  int32                      total = 1;
  repeated UserExtensionUnit units = 2;
}

message SetUsersReq {
  repeated UserExtensionUnit units = 1; // 批量写自己名下用户的扩展信息
}

message AddUsersReq {
  repeated string users = 1; // 用户 did:加到自己名下
}

message RemoveUsersReq {
  repeated string users = 1; // 用户 did:从自己名下删
}

// 列某用户所属的所有商户(某商户查:这个用户挂在哪些商户下)。不返回扩展数据本身。
message ListMerchantsReq {
  string        user_did   = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 用户 did(注意:不是商户 did)
  hi.Pagination pagination = 2;
}

message GetUserMqttReq {
  string user = 1; // 用户 did
}

// mqtt 凭证。**无 client_id** —— client_id 各服务自管(did/club 同时登 mqtt 时不互踢);
// username/password 设计上穿透(为将来动态密码留口)。商户可见 OK(邀请码注册可追责)。
message GetUserMqttResp {
  string username = 1;
  string password = 2;
}

// 商户(主体=商户,ExtendToken)。按主体归位:商户自身配置、对用户扩展数据的读写、授权,全在这。
// 用户不能读自己的扩展(扩展是商户的地盘)。
//
// (原 UserMerchant service 已删 —— 那个名字看不懂,且 Get 与本服务的 Get 逻辑完全重复
//  [都是 FindOne(did)];Set 就是商户改自己配置,归 Merchant.Update。草民无 ExtendToken 调不到,
//  正好修掉原 handler 里"草民查返回空"的 TODO。)
//
// 授权机制(裁决 #4,定稿):商户 X 操作商户 A 的数据时 —— 从 X 的 ExtendToken 解出 didx,
//   若 didx 在 A 的授权列表里则直接操作,**不回取 A 的 ExtendToken**。
service Merchant {
  // ── 商户自身配置 ──
  // Get:did 空=自己(取 ExtendToken);非空=查指定商户的节点信息(节点信息半公开,供渲染)。
  //     合并原 UserMerchant.Get(self)+ GetMerchant(param),消除重复;并去掉 GetMerchant 的 stutter。
  rpc Get (hi.DID) returns (MerchantGetResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }              // 查商户节点信息(空=自己)
  rpc Update (MerchantSetReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 改自己的商户配置(原 UserMerchant.Set)
  // ── 商户管理其用户的扩展信息 ──
  // GetUser/ListUsers:merchant 空=自己(免 grant);非空=指定商户(走 grant)。
  // GetUser 的 resp.user 须始终有 name/avatar(取自全局 user 表),即使无扩展行 —— club 靠它显示。
  rpc GetUser (GetUserReq) returns (UserExtensionUnit) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 拿某商户下某用户的扩展信息
  rpc ListUsers (ListUsersReq) returns (ListUsersResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }     // 列某商户下的用户
  rpc ListMerchants (ListMerchantsReq) returns (MerchantListResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 查某用户所属的所有商户(hiclub 作为商户调)
  rpc SetUsers (SetUsersReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; }       // 批量写自己名下用户的扩展信息
  rpc AddUsers (AddUsersReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; }       // 加用户到自己名下
  rpc RemoveUsers (RemoveUsersReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 从自己名下删用户
  // ── 用户 mqtt 凭证(基础信息,商户可见)──
  rpc GetUserMqtt (GetUserMqttReq) returns (GetUserMqttResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 拿用户 mqtt 用户名/密码(供 club 管 ACL)
  // ── 商户互授权 ──
  rpc ListGrants (google.protobuf.Empty) returns (ListGrantsResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; } // 我授权了哪些商户
  rpc AddGrant (GrantReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; }         // 授权某商户访问我的数据
  rpc RemoveGrant (GrantReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; }      // 取消授权
}

// 商户的扩展库访问凭证:extoken(=ExtendToken,商户的 API 凭证)+ extend 表名。
message MerchantExDBResp {
  string token = 1; // ExtendToken
  string table = 2; // 扩展数据表名
}

// 商户主人登录 hisrv 后,取/换自己的 ExtendToken —— **bootstrap 层**。
// 原名 UserExtensionSettings 是假名(跟"用户扩展设置"无关,ctx.did 就是商户 did)。
//
// ⚠️ 为什么单独一个 service、且是 AUTH_TOKEN:ExtendToken 是从这里**拿到**的,
//    所以本 service 不能要求先有 ExtendToken(拿票窗口不能查票)。主体是商户主人(登录 token),
//    与 Merchant(服务持 ExtendToken 干活)主体不同,故不与 Merchant 合并。
service MerchantExDB {
  rpc Get (google.protobuf.Empty) returns (MerchantExDBResp) { option (hi.auth) = AUTH_TOKEN; }     // 取自己的 ExtendToken + 扩展表名
  rpc Refresh (google.protobuf.Empty) returns (MerchantExDBResp) { option (hi.auth) = AUTH_TOKEN; } // 重新生成自己的 ExtendToken(旧名 Update)
}

message MerchantNotifyReq {
  string did   = 1;
  string nonce = 2;
}

message OrderEventResp {
  string event   = 1;
  string payload = 2;
}

// ── 订单通知/事件(web3 自动付款机制,裁决 #10)──────────────────────
// 架构:PC 端跑 hidid-pc,通过 SSE 长连接(OrderEvent.Sub)与 hidid 后台保持连接(pc 无公网 IP)。
// 流程:①商户业务系统在**自己的服务上**生成订单 → ②商户调 OrderNotify.Send → hidid 后端把通知
//       转发给对应 hidid-pc → ③hidid-pc 按用户设置的地址**去拉订单** → ④付款 →
//       ⑤付款结果通过用户设置的地址回传。
// 关键:hidid 后端**只负责转发通知**,订单真伪由三方业务系统控制;拉单/回传的 url 都是用户填的,
//       hidid-pc 直接对接三方、不经 hidid 后台 —— 排除了 hidid 后台伪造订单的可能。
// 是商户特有的行为,放 merchant.proto。拆两端:主体不同(hidid-pc 订阅 vs 商户发送)、档位不同。

// 订单事件订阅端(hidid-pc 订阅,token)。原 SSE.OrderEvents —— SSE 是传输术语不是主体。
service OrderEvent {
  rpc Sub (hi.DID) returns (stream OrderEventResp) { option (hi.auth) = AUTH_TOKEN; } // hidid-pc 订阅订单事件流(长连接)
}

// 订单通知发送端(商户触发,公开):商户业务系统触发一次付款通知,hidid 转发给对应 hidid-pc。
// 公开=只是转发触发器,订单真伪由三方业务系统 + 用户填的 url 兜底(裁决 #10)。
// 与订阅端主体不同(商户 vs hidid-pc)、档位不同(公开 vs token),故拆开。
service OrderNotify {
  rpc Send (MerchantNotifyReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; } // 商户触发付款通知
}
