syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/did/merchant.proto";
import "hi/options.proto";

// ═══════════════════════════════════════════════════════════════════════════
// admin.proto —— hisrv 商户后台的管理面接口。
//
// 已按裁决执行:超管方法标 AUTH_SUPERADMIN(原误标 TOKEN,只靠 handler 内联校验),
// 并按主体拆 service。后端 bump 后需:①把 handler 内联超管校验收敛到拦截器
// ②按拆分调整 RegisterXServer ③dev 实测超管方法"非超管被拒"。
// 见 record/20260716-162625-did-裁决.md、record/20260716-164356-did-新4条裁决.md。
// ═══════════════════════════════════════════════════════════════════════════

// ── 邀请码 ──────────────────────────────────────────────────────────────────
// 商户靠邀请码注册进 hisrv(草民只用 hidid app,登不了 hisrv web)。

message InviteCodeCreateResp {
  string code      = 1;
  bool   is_active = 2;
}

message InviteCodeEditReq {
  string code = 1;
  string note = 2;
}

message InviteCodeListResp {
  message Unit {
    string code       = 1;
    bool   is_active  = 2;
    string note       = 3;
    int64  created_at = 4;
  }
  int32         total = 1;
  repeated Unit infos = 2;
}

message InviteCodeDeleteReq {
  string code = 1;
}

message InviteCodeVerifyReq {
  string id   = 1;
  string code = 2;
  string did  = 3;
}

// 邀请码管理:超管发/改/查/删邀请码。整个 service 都是超管面。
// (待注册用户"验码"是另一个主体,已拆到下面 InviteCodeVerify。)
service InviteCode {
  rpc Create (google.protobuf.Empty) returns (InviteCodeCreateResp) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:生成一个新邀请码
  rpc Edit (InviteCodeEditReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }       // 超管:改邀请码备注
  rpc List (hi.Pagination) returns (InviteCodeListResp) { option (hi.auth) = AUTH_SUPERADMIN; }              // 超管:分页列出邀请码
  rpc Delete (InviteCodeDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }   // 超管:删邀请码
}

// 注册:主体是**还没注册的人**,拿邀请码换 AuthToken 完成注册。
// 从 InviteCode 拆出(主体不同:注册者 vs 超管;鉴权不同:公开 vs 超管)。
// 原名 InviteCodeVerify.Verify 是 stutter,改 Register.Verify。
service Register {
  rpc Verify (InviteCodeVerifyReq) returns (hi.AuthToken) { option (hi.auth) = AUTH_NONE; } // 公开:验邀请码,通过则换回注册用的 AuthToken
}

// ── DApp 目录 ───────────────────────────────────────────────────────────────
// hidid app 首页展示的 DApp(去中心化应用)列表。
// 裁决 #2:按读写主体拆两个 service —— DApp(app 浏览,读)/ DAppAdmin(超管维护,写)。

message DAppInfo {
  string uuid        = 1; // uuid
  string class       = 2; // 分类
  string logo        = 3; // 应用图片
  string title       = 4; // 应用标题
  string description = 5; // 应用描述
  string url         = 6; // 应用链接
  bool   nav         = 7; // 是否在导航栏展示
  bool   external    = 8; // 是否内置浏览器打开
  bool   promotion   = 9; // 是否推广
}

message DAppListByClassResp {
  repeated DAppInfo top       = 1; // 视频类 Dapp
  repeated DAppInfo popular   = 2; // 热门 Dapp
  repeated DAppInfo recommend = 3; // 推荐 Dapp
}

message DAppGetRWAResp {
  string url = 1;
}

message DAppUpdateTopReq {
  string url   = 1;
  string cover = 2;
}

message DAppUpdateOrderReq {
  message Unit {
    string uuid  = 1;
    int32  order = 2;
  }
  repeated Unit list = 1;
}

message DAppDeleteReq {
  string uuid = 1;
}

// DApp 浏览(app 面):普通登录用户看首页 DApp 列表。只读。
service DApp {
  rpc ListByClass (google.protobuf.Empty) returns (DAppListByClassResp) { option (hi.auth) = AUTH_USER; } // 用户:按分类取 DApp(视频/热门/推荐)
  rpc GetRWA (google.protobuf.Empty) returns (DAppGetRWAResp) { option (hi.auth) = AUTH_USER; }           // 用户:取 RWA 类 DApp 的入口 url
  rpc GetTop (google.protobuf.Empty) returns (DAppInfo) { option (hi.auth) = AUTH_USER; }                 // 用户:取置顶 DApp
}

// DApp 维护(超管面):上架/下架/改/排序/置顶。handler 里本有超管校验,收敛到拦截器。
service DAppAdmin {
  rpc Create (DAppInfo) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }                // 超管:上架 DApp
  rpc Edit (DAppInfo) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }                  // 超管:改 DApp
  rpc Delete (DAppDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }           // 超管:下架 DApp
  rpc UpdateOrder (DAppUpdateOrderReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:调整 DApp 排序
  rpc UpdateTop (DAppUpdateTopReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }     // 超管:设置置顶 DApp(封面+url)
}

// ── 商户管理 ────────────────────────────────────────────────────────────────
// 超管在 hisrv 后台管理所有商户。

message MerchantManageListReq {
  string        name       = 1;
  hi.Pagination pagination = 2;
}

message MerchantManageListResp {
  message Unit {
    MerchantInfo base    = 1;
    string       comment = 2;
  }
  int32         total = 1;
  repeated Unit list  = 2;
}

message MerchantManageEditReq {
  string did     = 1;
  string comment = 2;
}

// 商户管理(超管面)。裁决 #11:此前 Delete/Edit 标 AUTH_USER 且 handler 零校验
// (任何登录用户可删改商户,是漏洞),已全部收紧为 AUTH_SUPERADMIN。
// ⚠️ handler 侧无内联校验,完全靠拦截器 —— 后端 bump 后必须实测"非超管调 Delete/Edit 被拒"。
service MerchantManage {
  rpc List (MerchantManageListReq) returns (MerchantManageListResp) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:分页列出所有商户
  rpc Delete (hi.DID) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }               // 超管:删商户
  rpc Edit (MerchantManageEditReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }  // 超管:改商户备注
}
