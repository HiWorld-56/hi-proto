syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

message UserListReq {
  hi.Pagination pagination = 1;
}

message UserListResp {
  int32              total = 1;
  repeated hi.Entity list  = 2;
}

message UserTotalResp {
  int32 total = 1;
}

service User {
  rpc Edit (hi.Entity) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_TOKEN; }      // 用户:改自己的资料
  rpc Query (google.protobuf.Empty) returns (hi.Entity) { option (hi.auth) = AUTH_TOKEN; }     // 用户:查自己的资料
  rpc Total (google.protobuf.Empty) returns (UserTotalResp) { option (hi.auth) = AUTH_NONE; }  // 公开:用户总数
  // 注:handler 里另有 List,proto 未声明 —— 死代码,应在后端删除。
}
