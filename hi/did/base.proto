syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

message Coin {
  string icon     = 1;
  string name     = 2;
  string category = 3; // public-公共币种, custom-自定义币种
}

message ListCoinsResp {
  repeated Coin list = 1;
}

message LatestVersionReq {
  string platform = 1; // android / ios / ...
}

message LatestVersionResp {
  string          min_supported_version = 1;
  string          latest_version        = 2;
  string          download_url          = 3;
  repeated string changes               = 4;
  int64           release_time          = 5;
}

message ListSuperAdminUsersResp {
  repeated string list = 1;
}

service Base {
  rpc ListCoins (google.protobuf.Empty) returns (ListCoinsResp) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc LatestVersion (LatestVersionReq) returns (LatestVersionResp) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  // 超管名单。hisrv web 登录后拿它显隐"内部使用"菜单 —— 任何登录商户都要调,
  // 故不能标 AUTH_SUPERADMIN(会变成"先是超管才能知道自己是不是超管")。
  // 此前是 AUTH_NONE,等于把内部团队的 did 名单公开挂着。
  rpc ListSuperAdminUsers (google.protobuf.Empty) returns (ListSuperAdminUsersResp) { option (hi.auth) = AUTH_TOKEN; }
  rpc ServerVersion (google.protobuf.Empty) returns (hi.ServerVersionResp) { option (hi.auth) = AUTH_NONE; } // 不鉴权:查服务自身版本+环境
}

service Assist {
  rpc VerifySignature (hi.SignedData) returns (hi.DID) { option (hi.auth) = AUTH_WEB3; } // Web3鉴权
}

// 超管名单的**唯一持有方**。超管是内部团队的后门(方便快速做全局操作/查询),与业务无关,
// 人员固定就那几个。club/ai/media 一律穿透到这里问,不许自己留表 ——
// 此前四个服务四张表,实测已漂移(did 11 / club 14 / ai 15 / media 3),
// 且在一处撤权另一处不生效(zGzji3gw 在 did 已停用,在 club/ai 仍是超管)。
//
// 与 Base.ListSuperAdminUsers 的区别是**主体不同**,故分开:
//   Base.ListSuperAdminUsers → 主体是登录用户(hisrv web),带用户 token,只为显隐菜单
//   SuperAdmin.List          → 主体是兄弟服务,带 ExtendToken,用于它们的拦截器判档
service SuperAdmin {
  rpc List (google.protobuf.Empty) returns (ListSuperAdminUsersResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }
}

// ── 用户扩展的共享数据形状 ──────────────────────────────────────
// 放这里而非 user_extension.proto:merchant.proto 与 user_extension.proto 都要用它,
// 若留在任一方会造成两文件循环 import(protoc 直接报错)。
// 同属 hi.did 包,全限定名仍是 hi.did.UserExtensionUnit,引用点无需改动。

message UserExtensionInfo {
  optional string logo   = 1;
  optional int32  level  = 2;
  optional string card   = 3;
  optional string extend = 4;
  optional string note   = 5;
}

message UserExtensionUnit {
  hi.Entity         user = 1;
  UserExtensionInfo info = 2;
}

