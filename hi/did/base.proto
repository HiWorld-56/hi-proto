syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

message Coin {
  string icon     = 1;
  string name     = 2;
  string category = 3; // public-公共币种, custom-自定义币种
}

message ListCoinsResp {
  repeated Coin list = 1;
}

message LatestVersionReq {
  string platform = 1; // android / ios / ...
}

message LatestVersionResp {
  string          min_supported_version = 1;
  string          latest_version        = 2;
  string          download_url          = 3;
  repeated string changes               = 4;
  int64           release_time          = 5;
}

message ListSuperAdminUsersResp {
  repeated string list = 1;
}

message UserTotalResp {
  int32 total = 1;
}

// Base —— 每个包统一的公共信息入口(版本/币种/服务自身版本/用户总数),全部公开。
// 生态约定:club/ai/media 也各有 Base.ServerVersion / Base.LatestVersion,保持一致。
service Base {
  rpc ListCoins (google.protobuf.Empty) returns (ListCoinsResp) { option (hi.auth) = AUTH_NONE; }            // 公开:支持的币种列表
  rpc LatestVersion (LatestVersionReq) returns (LatestVersionResp) { option (hi.auth) = AUTH_NONE; }         // 公开:某平台的最新版本
  rpc ServerVersion (google.protobuf.Empty) returns (hi.ServerVersionResp) { option (hi.auth) = AUTH_NONE; } // 公开:本服务 bin 版本 + 运行环境
  rpc UserTotal (google.protobuf.Empty) returns (UserTotalResp) { option (hi.auth) = AUTH_NONE; }            // 公开:用户总数(原 User.Total)
}

// 超管名单的**唯一持有方**。超管是内部团队的后门(方便快速做全局操作/查询),与业务无关,
// 人员固定就那几个。club/ai/media 一律穿透到这里问,不许自己留表 ——
// 此前四个服务四张表,实测已漂移(did 11 / club 14 / ai 15 / media 3),
// 且在一处撤权另一处不生效(zGzji3gw 在 did 已停用,在 club/ai 仍是超管)。
//
// List 是**身份无关的读**(不管谁调返回都一样):前端登录用户拿它显隐"内部使用"菜单,
// 兄弟服务(club/ai)穿透过来判档。两类调用方凭证不同(token / ExtendToken),
// 故用 AUTH_TOKEN_OR_EXTEND 一个方法通吃(原 SuperAdmin.List + SuperAdminView.ListSuperAdminUsers 合并)。
// 注意:不能标 AUTH_SUPERADMIN,否则变成"先是超管才能知道自己是不是超管"。
service SuperAdmin {
  rpc List (google.protobuf.Empty) returns (ListSuperAdminUsersResp) { option (hi.auth) = AUTH_TOKEN_OR_EXTEND; } // 取超管名单(前端/兄弟服务都可)
}

// (UserExtensionInfo / UserExtensionUnit 已迁至 merchant.proto —— 归位后只有 Merchant
//  读写扩展,放那里最贴切,且不再有 merchant↔user_extension 的循环 import。)

