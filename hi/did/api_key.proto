syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

message ApiKeyInfo {
  string user       = 1;
  string value      = 2;
  string note       = 3;
  int64  created_at = 4;
}

message CreateApiKeyReq {
  string user = 1; // 用户Did/硬件机器人Did
}

message CreateApiKeyResp {
  ApiKeyInfo info = 1;
}

message EditApiKeyReq {
  string api_key = 1;
  string note    = 2;
}

message EditApiKeyResp {
  ApiKeyInfo info = 1;
}

message ListApiKeyReq {
  string        user       = 1; // 用户Did/硬件机器人Did
  hi.Pagination pagination = 2;
}

message ListApiKeyResp {
  int32               total = 1;
  repeated ApiKeyInfo infos = 2;
}

message DeleteApiKeyReq {
  string api_key = 1;
}

message GetApiKeyReq {
  string api_key = 1;
}

message GetApiKeyResp {
  ApiKeyInfo info = 1;
}

// ⚠️ 裁决 #6:apikey 机制**不该在 did**。它是 hiclub 的东西 —— hiclub 给每个用户
//    (人/软bot/硬bot)设 apikey,供外部**以该用户身份**调用 hiclub 的**受限方法子集**。
//    与 token 的区别:apikey 能调的方法有限。
//    TODO:整个 service 迁出 did,搬到 hiclub。当前 club 是转发到这里来用的。
service ApiKey {
  rpc Create (CreateApiKeyReq) returns (CreateApiKeyResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }        // 给某用户生成 apikey
  rpc Edit (EditApiKeyReq) returns (EditApiKeyResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }              // 改 apikey 备注
  rpc List (ListApiKeyReq) returns (ListApiKeyResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }              // 列某用户的 apikey
  rpc Delete (DeleteApiKeyReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_EXTEND_TOKEN; }   // 删 apikey
  rpc Get (GetApiKeyReq) returns (GetApiKeyResp) { option (hi.auth) = AUTH_EXTEND_TOKEN; }                 // 按 apikey 反查归属用户(club 拦截器验 apikey 时调)
}
