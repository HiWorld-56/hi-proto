syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/did";

import "hi/common.proto";
import "hi/did/base.proto";
import "hi/options.proto";

message Transaction {
  string    hash   = 1;
  string    amount = 2;
  Coin      coin   = 3;
  hi.Entity from   = 4;
  hi.Entity to     = 5;
  string    remark = 6;
}

message HistoryReq {
  string coin    = 1;
  string address = 2;
  string cursor  = 3; // 分页游标，第一页为空
  int32  limit   = 4; // 最大返回数
}

message HistoryResp {
  message Unit {
    Transaction trans     = 1;
    string      direction = 2; // in（转入）/ out（转出）/ self（自转）
    string      status    = 3; // pending / confirming / success / failed / notfound
    int64       timestamp = 4;
  }
  repeated Unit list        = 1;
  string        next_cursor = 2; // 下一页游标
}

message TxStatusReq {
  string coin = 1;
  string hash = 2;
}

message TxStatusResp {
  string state    = 1; // pending / confirming / success / failed / notfound
  uint32 progress = 2; // 进度，0-100
}

message VerifyTransactionReq {
  string coin   = 1; // 预期币种（定位链/合约）
  string hash   = 2; // 链上交易 hash
  string amount = 3; // 预期金额（最小单位整数串，与 tx_detail 口径一致）
  string from   = 4; // 预期付款方地址
  string to     = 5; // 预期收款方地址
}

message VerifyTransactionResp {
  string state            = 1; // pending / confirming / success / failed / notfound
  bool   passed           = 2; // 业务校验是否通过（仅 state=success 有意义）
  string reason           = 3; // 未过原因：AMOUNT_ERR / FROM_ERR / TO_ERR / CONTRACTADDRESS_ERR
  int64  confirmed_blocks = 4; // 链上确认数
  int64  timestamp        = 5; // 交易时间（ms）；调用方据此自行做时限校验（业务层解耦）
  uint32 query_count      = 6; // 该 hash 在缓存窗口内被查询次数（业务侧据此防伪）
}

// Transfer —— 一组**helper 方法**:都是查链上数据 / 验签,给三方(尤其没能力自己做
// 链上查询或 web3 验签的)用。全部公开或 web3(web3 视为无鉴权),档位一致。
service Transfer {
  rpc History (HistoryReq) returns (HistoryResp) { option (hi.auth) = AUTH_NONE; }                                // 公开:某地址的转账历史(链上数据)
  rpc TxStatus (TxStatusReq) returns (TxStatusResp) { option (hi.auth) = AUTH_NONE; }                             // 公开:查交易状态(链上数据)
  rpc VerifyTransaction (VerifyTransactionReq) returns (VerifyTransactionResp) { option (hi.auth) = AUTH_NONE; }  // 公开:交易校验(两阶段都只查链上数据比对,无需鉴权)
  rpc VerifySignature (hi.SignedData) returns (hi.DID) { option (hi.auth) = AUTH_WEB3; }                          // web3:验签工具(原 Assist.VerifySignature),给不会自己验签的三方用
  // 注:handler 里另有 HistoryOld,proto 未声明 —— 死代码,应在后端删除。
}
