syntax = "proto3";

package hi.did;

option go_package = "github.com/HiWorld-56/hi-proto/gen/go/hi/did";

import "hi/common.proto";
import "hi/did/base.proto";

message Transaction {
  string    hash   = 1;
  string    amount = 2;
  Coin      coin   = 3;
  hi.Entity from   = 4;
  hi.Entity to     = 5;
  string    remark = 6;
}

message HistoryReq {
  string coin    = 1;
  string address = 2;
  string cursor  = 3; // 分页游标，第一页为空
  int32  limit   = 4; // 最大返回数
}

message HistoryResp {
  message Unit {
    Transaction trans     = 1;
    string      direction = 2; // in（转入）/ out（转出）/ self（自转）
    string      status    = 3; // pending / confirming / success / failed / notfound
    int64       timestamp = 4;
  }
  repeated Unit list        = 1;
  string        next_cursor = 2; // 下一页游标
}

message TxStatusReq {
  string coin = 1;
  string hash = 2;
}

message TxStatusResp {
  string state    = 1; // pending / confirming / success / failed / notfound
  uint32 progress = 2; // 进度，0-100
}

service Transfer {
  rpc History (HistoryReq) returns (HistoryResp); // 不鉴权
  rpc TxStatus (TxStatusReq) returns (TxStatusResp); // 不鉴权
}
