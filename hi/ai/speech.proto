syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "hi/options.proto";
import "hi/audio.proto";
import "buf/validate/validate.proto";

message SynthesizeReq {
  optional string text  = 1;
  optional string model = 2;
  optional string style = 3;
}

message SynthesizeResp {
  option (hi.audience) = VIS_SELF; // 我的音频合成结果 → SELF
  optional string url = 1 [(hi.visibility) = VIS_SELF]; // 合成音频 url
}

message TranscribeReq {
  optional string url   = 1; // 音频 url(从 HiSource 下载)
  optional string model = 2; // whisper-1 / whisper-hiai
  optional string lang  = 3;
}

message TranscribeResp {
  option (hi.audience) = VIS_SELF; // 我的语音转写结果 → SELF
  optional string text = 1 [(hi.visibility) = VIS_SELF];
}

// 输入start -> chunk* -> end；model/lang只允许在start设置。
// 仅完整end并最终flush后返回TranscribeResp，部分转写不触发任何业务。
message TranscribeStreamReq {
  option (hi.audience) = VIS_SELF;
  optional string model = 1 [(hi.visibility) = VIS_SELF]; // paraformer-streaming
  optional string lang = 2 [(hi.visibility) = VIS_SELF]; // 当前auto/zh；服务端验证支持范围
  hi.AudioStreamEvent audio = 3 [(hi.visibility) = VIS_SELF, (buf.validate.field).required = true];
}

// 语音转换(主体=语音)。**纯格式转换,不涉及 agent / 会话 / 工具**。
//
// 从 Chat 拆出,并借机解掉命名撞车:原 `Chat.SimpleSpeechToText`(真 STT)与
// `Chat.SpeechToText`(其实是完整多模态对话)只靠 "Simple" 前缀区分,读的人根本分不清。
// 现在:真转换叫 Transcribe / Synthesize;Chat 里的 SpeechToText 系列才是多模态对话。
//
// 商户档:hiai web 与商户后台服务都会调。
service Speech {
  rpc TranscribeStream (stream TranscribeStreamReq) returns (TranscribeResp) { option (hi.auth) = AUTH_MERCHANT; } // 边采集边计算，只有最终转写结果；取消透传

  rpc SynthesizeStream (SynthesizeReq) returns (stream hi.AudioStreamEvent) { option (hi.auth) = AUTH_MERCHANT; } // 完整最终文本输入，PCM增量输出；取消须透传至推理任务

  rpc Transcribe (TranscribeReq) returns (TranscribeResp) { option (hi.auth) = AUTH_MERCHANT; } // 语音转文字(原 Chat.SimpleSpeechToText)
  rpc Synthesize (SynthesizeReq) returns (SynthesizeResp) { option (hi.auth) = AUTH_MERCHANT; } // 文字转语音(原 Chat.SimpleTextToSpeech)
}
