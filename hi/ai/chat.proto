syntax = "proto3";

package hi.ai;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

message Content {
  string type    = 1;
  string content = 2;
}

message NewSessionResp {
  string cid = 1; // 新会话 id;原 GenerateCidResp
}

message SendReq {
  string           did                  = 1;
  string           cid                  = 2;
  repeated Content conts                = 3;
  string           state                = 4;
  string           custom               = 5;
  bool             return_plugin_use    = 6;
  bool             return_training_data = 7;
  bool             return_context       = 8;
}

message SendResp {
  string reply = 1;
}

message StreamResp {
  int32  code    = 1;
  string type    = 2;
  string message = 3;
}

message ClearHistoryReq {
  string cid = 1;
}

message GetHistoryReq {
  string cid   = 1;
  string agent = 2;
}

message QA {
  string           a = 1; // assistant
  repeated Content q = 2; // User
}

message GetHistoryResp {
  repeated QA list = 1;
}

// ── 多模态对话入参 ────────────────────────────────────────────────────
// 命名读作「<输入模态>To<输出模态>」,描述的是一轮 agent 对话的模态组合(带工具调用),
// **不是字面的格式转换** —— 真 STT/TTS 在 Speech service(Transcribe/Synthesize)。
message SpeechToSpeechReq {
  string              did         = 1;
  string              cid         = 2;
  repeated Content    conts       = 3;
  repeated ToolSupply tools       = 4;
  optional string     tool_choice = 5;
  optional string     custom      = 6;
  optional string     state       = 7;
  optional string     style       = 8;
}

message TextToTextReq {
  string              did         = 1;
  string              cid         = 2;
  repeated Content    conts       = 3;
  repeated ToolSupply tools       = 4;
  optional string     tool_choice = 5;
  optional string     custom      = 6;
  optional string     state       = 7;
}

message SpeechToTextReq {
  string              did         = 1;
  string              cid         = 2;
  repeated Content    conts       = 3;
  repeated ToolSupply tools       = 4;
  optional string     tool_choice = 5;
  optional string     custom      = 6;
  optional string     state       = 7;
}

message ToolCallResult {
  string           id    = 1;
  repeated Content conts = 2;
}

// 工具结果续跑入参(Resume 系列):客户端执行完工具后把结果交回来,接着跑。
message ToolCallResultsReq {
  string                  id   = 1;
  repeated ToolCallResult list = 2;
}

message ToolSupply {
  message Function {
    string                          name        = 1;
    string                          description = 2;
    optional google.protobuf.Struct parameters  = 3;
  }
  string   type     = 1;
  Function function = 2;
}

message ToolCall {
  message Function {
    string name      = 1;
    string arguments = 2;
  }
  string   id       = 1;
  string   type     = 2;
  Function function = 3;
}

// final == true
//   result = text / url
//   tools = null
// final == false
//   result = tool_id
//   tools = tools
message ChatResp {
  bool              final  = 1;
  string            result = 2;
  repeated ToolCall tools  = 3;
}

// 对话(主体=会话)。商户档:hiai web(token)与商户后台服务(apikey)都会调。
//
// (原 Simple 已删 —— 那是给前端**无身份**直连 llm 推理的便捷方法,有安全隐患。)
// 真 STT/TTS 已拆去 Speech;延迟统计已拆去 AgentBench。
service Chat {
  // ── 会话管理 ──
  rpc NewSession (google.protobuf.Empty) returns (NewSessionResp) { option (hi.auth) = AUTH_MERCHANT; } // 建会话(原 GenerateCid)
  rpc Send (SendReq) returns (SendResp) { option (hi.auth) = AUTH_MERCHANT; }                           // 一轮对话(原 Dialog)
  rpc Stream (SendReq) returns (stream StreamResp) { option (hi.auth) = AUTH_MERCHANT; }                // 流式一轮(原 DialogStream)
  rpc GetHistory (GetHistoryReq) returns (GetHistoryResp) { option (hi.auth) = AUTH_MERCHANT; }         // 取会话上下文(原 GetContext)
  rpc ClearHistory (ClearHistoryReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 清上下文(原 ClearContext)
  // ── 多模态对话(带工具调用);Resume = 交回工具结果续跑(原 xxx2)──
  rpc TextToText (TextToTextReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }                     // 文入文出
  rpc TextToTextResume (ToolCallResultsReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }          // 文入文出:工具结果续跑
  rpc SpeechToText (SpeechToTextReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }                 // 语音入、文本出
  rpc SpeechToTextResume (ToolCallResultsReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }        // 语音入文本出:工具结果续跑
  rpc SpeechToSpeech (SpeechToSpeechReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }             // 语音入语音出
  rpc SpeechToSpeechResume (ToolCallResultsReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }      // 语音入语音出:工具结果续跑
}
