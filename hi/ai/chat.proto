syntax = "proto3";

package hi.ai;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

// ── AI 对话全链路都是私有:会话/上下文/回复只发给发起对话的本人 ──────────────
message Content {
  option (hi.audience) = VIS_SELF;
  string type    = 1 [(hi.visibility) = VIS_SELF];
  string content = 2 [(hi.visibility) = VIS_SELF];
}

message NewSessionResp {
  option (hi.audience) = VIS_SELF;
  string cid = 1 [(hi.visibility) = VIS_SELF]; // 新会话 id;原 GenerateCidResp
}

// ── 服务端整流程执行(Complete 家族)────────────────────────────────────────
// 服务端把一轮对话**整个跑完**(function call 也在服务端执行),客户端不参与工具调用,直接拿最终答复。
// Complete = 一次性;CompleteStream = 流式。与下面 Converse/Resume(客户端 tool-callback 两阶段)是两条路。
message CompleteReq {
  string           agent  = 1;
  string           cid    = 2;
  repeated Content conts  = 3;
  string           state  = 4;
  string           custom = 5;
  // ── 要不要把过程回给调用方(**只管输出,不管行为**)────────────────────────────
  // ⚠️ 别把它读成"要不要调插件":**调不调是模型决定的**(标准 function call:
  //    模型看着 tools 自己决定 → 调 → 结果回喂 → 模型二次回复)。这两个开关只决定
  //    过程数据要不要一并流给调用方。
  //
  // 这两个字段在 dev45 那次迁移(Stream→CompleteStream)时**从请求里漏掉了**,
  // 而读它们的代码原样留着 → 恒 false → toolCalls 帧与训练数据从此再没发出去过,
  // 不报错、类型也对,只是值永远是零值。补回来。
  bool return_plugin_use    = 6; // 发 type="toolCalls" 帧:模型调了哪个函数、传了什么参数、工具返回什么
  bool return_training_data = 7; // 回训练数据(命中的记忆片段)
  // 发 type="context" 帧:**这次真正喂给模型的那份上下文**(系统提示词 + 按 qa_num 截出的历史
  // + 本轮输入),即 GetCompleteMessage 的产物。调不准的时候要看的就是它 ——
  // 光看历史列表看不出实际截了几轮、系统提示词长什么样、记忆片段拼没拼进去。
  bool return_context       = 8;
}

message CompleteResp {
  option (hi.audience) = VIS_SELF;
  string reply = 1 [(hi.visibility) = VIS_SELF];
}

message CompleteStreamResp {
  option (hi.audience) = VIS_SELF;
  int32  code    = 1 [(hi.visibility) = VIS_SELF];
  string type    = 2 [(hi.visibility) = VIS_SELF];
  string message = 3 [(hi.visibility) = VIS_SELF];
}

message ClearHistoryReq {
  string cid = 1;
}

message GetHistoryReq {
  string cid = 1; // cid 已唯一定位会话,不再带 agent
}

message QA {
  option (hi.audience) = VIS_SELF;
  string           a = 1 [(hi.visibility) = VIS_SELF]; // assistant
  repeated Content q = 2 [(hi.visibility) = VIS_SELF]; // User
}

message GetHistoryResp {
  option (hi.audience) = VIS_SELF;
  repeated QA list = 1 [(hi.visibility) = VIS_SELF];
}

// ── 客户端 tool-callback 两阶段对话入参(Converse/Resume)────────────────────
// 一轮对话:Converse 返回最终答复,或返回**待客户端执行的工具**(final=false);客户端执行后调 Resume 交回结果续跑。
// 模态(文/语音、输出音色)由 conts + style 决定 —— 合并原 TextToText/SpeechToText/SpeechToSpeech 三个按模态复制的方法。
// 命名读作模态转换但**不是字面格式转换**;真 STT/TTS 在 Speech service(Transcribe/Synthesize)。
message ChatReq {
  string              agent       = 1;
  string              cid         = 2;
  repeated Content    conts       = 3;
  repeated ToolSupply tools       = 4;
  optional string     tool_choice = 5;
  optional string     custom      = 6;
  optional string     state       = 7;
  optional string     style       = 8; // 语音出的音色等;纯文本场景留空
}

message ToolCallResult {
  string           id    = 1;
  repeated Content conts = 2;
}

// 工具结果续跑入参(Resume):客户端执行完工具后把结果交回来,接着跑。续跑的模态由原始调用的 id 决定。
message ToolCallResultsReq {
  string                  id   = 1;
  repeated ToolCallResult list = 2;
}

message ToolSupply {
  message Function {
    string                          name        = 1;
    string                          description = 2;
    optional google.protobuf.Struct parameters  = 3;
  }
  string   type     = 1;
  Function function = 2;
}

message ToolCall {
  option (hi.audience) = VIS_SELF; // 本轮对话里待客户端执行的工具,只发给本人
  message Function {
    option (hi.audience) = VIS_SELF;
    string name      = 1 [(hi.visibility) = VIS_SELF];
    string arguments = 2 [(hi.visibility) = VIS_SELF];
  }
  string   id       = 1 [(hi.visibility) = VIS_SELF];
  string   type     = 2 [(hi.visibility) = VIS_SELF];
  Function function = 3 [(hi.visibility) = VIS_SELF];
}

// final == true  → result = text/url, tools = null
// final == false → result = tool_id,  tools = 待客户端执行的工具
message ChatResp {
  option (hi.audience) = VIS_SELF;
  bool              final  = 1 [(hi.visibility) = VIS_SELF];
  string            result = 2 [(hi.visibility) = VIS_SELF];
  repeated ToolCall tools  = 3 [(hi.visibility) = VIS_SELF];
}

// 对话(主体=会话)。商户档:hiai web(token)与商户后台服务(apikey)都会调。
// 两条对话路:①Complete/CompleteStream —— 服务端整流程执行(工具在服务端跑);
//            ②Converse/Resume —— 客户端 tool-callback 两阶段(工具由客户端执行)。
// (原 Simple 已删;真 STT/TTS 已拆去 Speech;延迟统计已拆去 AgentBench。)
service Chat {
  // ── 会话管理 ──
  rpc NewSession (google.protobuf.Empty) returns (NewSessionResp) { option (hi.auth) = AUTH_MERCHANT; }   // 建会话(原 GenerateCid)
  rpc GetHistory (GetHistoryReq) returns (GetHistoryResp) { option (hi.auth) = AUTH_MERCHANT; }            // 取会话上下文(原 GetContext)
  rpc ClearHistory (ClearHistoryReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 清上下文(原 ClearContext)
  // ── 服务端整流程执行(工具在服务端跑)──
  rpc Complete (CompleteReq) returns (CompleteResp) { option (hi.auth) = AUTH_MERCHANT; }                  // 一次性(原 Send)
  rpc CompleteStream (CompleteReq) returns (stream CompleteStreamResp) { option (hi.auth) = AUTH_MERCHANT; } // 流式(原 Stream)
  // ── 客户端 tool-callback 两阶段 ──
  rpc Converse (ChatReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }                          // 一轮对话(合原 TextToText/SpeechToText/SpeechToSpeech)
  rpc Resume (ToolCallResultsReq) returns (ChatResp) { option (hi.auth) = AUTH_MERCHANT; }                 // 交回工具结果续跑(合原三个 *Resume)
}
