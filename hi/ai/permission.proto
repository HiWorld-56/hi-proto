syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// ── 机器人权限(hi.ai 是**唯一权威**)────────────────────────────────────────
//
// 权限是**机器人自身的能力位**,授予的是机器人本身,不从 creator/master 继承 ——
// 机器人自己背授权,转手了也照常能用,符合去中心化机器人的初衷。
// 建号即授全部,用途是**出问题时撤掉**(把瞎搞的机器人限制住),不是逐步授予。
//
// ## 为什么权威在 ai 而不在 club
//
// 插件与记忆的**执行**在 ai:挂不挂 tools、要不要把记忆片段拼进上下文,都是 ai 推理时的事。
// 校验必须跟执行在同一侧 —— 否则就是"配置时拦得住、运行时拦不住":
// 曾经权限存 club、ai 无权限层,于是撤了插件/记忆权限的机器人照样调插件、照样用记忆
// (club 那三处检查全在改配置的路径上)。
//
// club 侧的"机器人权限"页是**超管**功能,后端**穿透**到这里写(club 作为 ai 的商户调用),
// 不在 club 自己存一份 —— 同步两份必然漂移,而这类东西一漂移就是安全问题。
//
// ## 档位:商户
//
// 商户**只能配置自己创建/注册的机器人**(handler 一律 `creator = 调用者` 收束),
// 传别人的机器人 did 一律当"不存在"处理,不泄露"这个 did 存不存在"。
enum PermissionType {
  // ⚠️ 纯占位。proto3 要求首值为 0,故删不掉,但**不代表"全部"或"不过滤"** ——
  //    传它一律按无效参数拒绝。要列全部传 PERMISSION_NORMAL:所有机器人都持有
  //    normal 位,按它筛天然等于不过滤。
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_NORMAL      = 1; // 普通:自由度/系统提示词/用户提示词。**所有机器人默认持有**
  PERMISSION_ADVANCED    = 2; // 高级:上下文数/对话模型/嵌入模型/STT 模型
  PERMISSION_MEM         = 3; // 记忆:上传资料/训练记忆;**撤掉后记忆不再进推理**
  PERMISSION_PLUGIN      = 4; // 插件:启用插件;**撤掉后插件不再挂进 tools**
}

message PermissionInfo {
  option (hi.audience) = VIS_SELF;
  string                  did         = 1 [(hi.visibility) = VIS_SELF]; // 机器人 did
  repeated PermissionType permissions = 2 [(hi.visibility) = VIS_SELF]; // 当前持有的档位
  optional string         note        = 3 [(hi.visibility) = VIS_SELF]; // 备注(为什么被撤,给人看的)
}

message ListAgentPermissionsReq {
  repeated string agents = 1; // 机器人 did 列表;**只返回调用者名下的那些**,别人的直接略过
}

message ListAgentPermissionsResp {
  option (hi.audience) = VIS_SELF;
  repeated PermissionInfo infos = 1 [(hi.visibility) = VIS_SELF];
}

message PermissionAddReq {
  string                  did  = 1 [(buf.validate.field).string.pattern = "^\\S+$"]; // 机器人 did
  optional PermissionType type = 2;
}

message PermissionDeleteReq {
  string                  did  = 1 [(buf.validate.field).string.pattern = "^\\S+$"];
  optional PermissionType type = 2;
}

// 按档位分页列持有者(club 超管页穿透过来用)。**只出调用者名下的机器人**。
message PermissionListReq {
  optional string         did        = 1; // 可选:按 did 过滤;**不传=不筛**(以前用空串表示,已禁止)
  optional PermissionType type       = 2; // **必填**,须是四档之一;列全部传 NORMAL(所有机器人都持有它),不是 UNSPECIFIED
  hi.Pagination           pagination = 3;
}

message PermissionListResp {
  option (hi.audience) = VIS_SELF;
  optional int32          total = 1 [(hi.visibility) = VIS_SELF];
  repeated PermissionInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

message PermissionEditReq {
  string          did  = 1 [(buf.validate.field).string.pattern = "^\\S+$"];
  optional string note = 2; // 备注
}

// 机器人权限(商户档)。**权威存储在 ai**,推理时由 ai 自己校验。
//
// ⚠️ 撤权**不删数据**:插件绑定、记忆文件都留着,只是不再参与推理;给回权限立刻恢复。
//    曾经撤权顺手调 DeletePluginByAgents / DeleteAgentFilesByDid 真删,那是错的 ——
//    "限制一下瞎搞的机器人"不该等于"毁掉用户的数据"。
service Permission {
  rpc List (ListAgentPermissionsReq) returns (ListAgentPermissionsResp) { option (hi.auth) = AUTH_MERCHANT; } // 批量查自己名下机器人的权限
  rpc Add (PermissionAddReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }            // 授予一档(幂等)
  rpc Delete (PermissionDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }      // 取消一档(不删数据)
  rpc Edit (PermissionEditReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }          // 改备注
  rpc ListByType (PermissionListReq) returns (PermissionListResp) { option (hi.auth) = AUTH_MERCHANT; }       // 按档位分页列自己名下的持有者
}
