syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

// ── 权限(原 UserACL)────────────────────────────────────────────────────────
// 命名依据设计文档《HiAI.权限控制》:文档通篇叫**权限**、返回字段叫 permissions[]、
// 前端叫 getPermissions —— 故用 Permission,不自创 Privilege/ACL。
//
// **权限四档**(文档):
//   normal   普通 —— 新用户默认拥有;管 自由度 / 系统提示词 / 用户提示词
//   advanced 高级 —— 管 上下文数 / 对话模型 / 嵌入模型 / STT 模型
//   mem      记忆 —— 能否上传资料、训练记忆
//   plugin   插件 —— 能否启用插件
//
// ⚠️ **撤权只翻位、啥都不做**(2026-07 定案):取消权限**不清任何数据**,只把权限位关掉。
//   数据留着,使用侧(推理装配、上传校验等)**每次先判权限再决定用不用**(总开关思路),
//   没权限自然用不上。理由:撤权若带一堆连带清理动作,漏一个就是漏洞;把判断收敛到 use-side 最稳。
//   (后端 permission_repo Revoke 已按此改成只翻位。)
//
// ⚠️⚠️ **权限 ≠ 超管,别再混!**
//   - 后端常量 `TYPE_SUPER_USER_SUPER = "super"` 其实是上面的「**高级**」档
//     (它只管"能不能用高级模型":`if !check && llmModel != "gpt-4.1-nano" → 报错`),
//     **跟管理员权限毫无关系**,纯属撞名。值应正名为 `advanced`。
//   - 后端常量 `TYPE_SUPER_USER_NORMAL = "all"` 其实是「**普通**」档。
//     因新用户默认拥有,"列普通用户"=="列全部用户",这才是它查 UserRepo 的原因 —— 逻辑自洽,是名字在骗人。
//     值应正名为 `normal`。
//   - 真·超管(谁能授权限)是文档里的"**操作许可:特定用户**",名单穿透 hidid。
//
// ⚠️ 前人血泪(club/user_acl.proto 原注释),**别再犯**:
//   原 `UserACL.List` 是 AUTH_TOKEN,前端 robot_memory/robot_plugin/robot_setup 三个
//   **普通用户页面**拿它当 getPermissions 用。有人曾按"整个 service 都是管理面"把它标成
//   SUPERADMIN → **普通用户当场 PermissionDenied,是实打实的回归**。
//   故本文件按**主体**拆成两个 service:查(商户/用户)与 管(超管)。

// 权限类型:固定闭集(四档),故用枚举而非魔法字符串。客户端有枚举即可显隐功能,不必再拉 ListTypes。
// 名为 PermissionType(不能叫 Permission —— 与 service Permission 同命名空间会撞)。
enum PermissionType {
  // ⚠️ **纯占位,不要赋予任何业务语义。** proto3 要求首值必须为 0,故这一行删不掉,
  //    但它不代表"全部"、也不代表"不过滤" —— 传它一律按无效参数拒绝。
  //    要列全部,传 PERMISSION_NORMAL:权限是 bit 位拼的,所有用户默认持有 normal 位,
  //    所以"列持有 normal 的人"天然就等于"列全部用户"。不需要再造一个"不过滤"的档。
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_NORMAL      = 1; // 普通:自由度/系统提示词/用户提示词
  PERMISSION_ADVANCED    = 2; // 高级:上下文数/对话模型/嵌入模型/STT 模型
  PERMISSION_MEM         = 3; // 记忆:上传资料/训练记忆
  PERMISSION_PLUGIN      = 4; // 插件:启用插件
}

message PermissionGetReq {
  string did = 1; // 要查谁的权限
}

// 某 did 持有的权限清单,只发给主体本人(经商户代查)或超管后门。
message PermissionInfo {
  option (hi.audience) = VIS_SELF;
  string              did         = 1 [(hi.visibility) = VIS_SELF];
  repeated PermissionType permissions = 2 [(hi.visibility) = VIS_SELF]; // 该 did 持有的权限
  string              note        = 3 [(hi.visibility) = VIS_SELF];
}

message PermissionAddReq {
  string         did  = 1;
  PermissionType type = 2; // 要授予的权限类型
}

message PermissionDeleteReq {
  string         did  = 1;
  PermissionType type = 2; // 要取消的权限类型
}

message PermissionEditReq {
  string did  = 1;
  string note = 2; // 备注,给人看的
}

message PermissionListReq {
  string         did        = 1; // 可选:按 did 过滤
  PermissionType type       = 2; // **必填**,须是四档之一。列全部传 NORMAL(人人默认持有该位),不是 UNSPECIFIED
  hi.Pagination  pagination = 3;
}

message PermissionListResp {
  option (hi.audience) = VIS_SELF; // 超管后门列持有者(每项 PermissionInfo 本身即 SELF)
  int32                   total = 1 [(hi.visibility) = VIS_SELF];
  repeated PermissionInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

// 权限查询(商户档)—— 查的是**商户自己在 hiai 的权限**,不是替谁代查。
//
// ⚠️ 原注释写着"club 作为 ai 的商户,替自己的用户查",**是错的**:
//    **权限各自单独管理,不跨服务查。** ai 与 club 的权限模型相同(同一套位掩码
//    normal/advanced/mem/plugin),但各存各的表、各判各的:
//      · hiai 侧:hi_ai_permission —— 里面给了 club 商户 did 全部权限(type=7),
//        所以 club 能调 hiai 的插件/记忆/高级能力;
//      · club 侧:hi_chat_user_super —— club 用同一套模型管**自己的用户**,
//        hi.club.Permission.Get 查的是这张表,**从不转发到这里**(实测无任何调用)。
//    权限授予 **master**:master 有插件权限,他名下所有机器人就都能用插件。
//
// **绝不能标超管**:这是普通用户页面的 getPermissions 链路(见文件头血泪)。
service Permission {
  rpc Get (PermissionGetReq) returns (PermissionInfo) { option (hi.auth) = AUTH_MERCHANT; } // 查某 did 有哪些权限
}

// 权限管理(超管)。对应设计文档的"操作许可:特定用户"。
//
// ⚠️ **取消权限只翻位、不清数据**(见文件头):撤 mem/plugin/advanced 都**只关权限位**,
//    资料/记忆/插件数据一律保留,由 use-side 判权限门控。club 侧的"群人数上限回落 300 并踢人"
//    是 club 自己的产品行为(见 hi/club/permission.proto),与 ai 无关。
service PermissionManage {
  rpc Add (PermissionAddReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }       // 超管:授予(追加)
  rpc Delete (PermissionDeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:取消(只翻位,不清数据)
  rpc Edit (PermissionEditReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_SUPERADMIN; }     // 超管:改备注
  rpc List (PermissionListReq) returns (PermissionListResp) { option (hi.auth) = AUTH_SUPERADMIN; }        // 超管:按类型列持有者
}

// ── 商户目录 ─────────────────────────────────────────────────────────────
message MerchantListReq {
  string        did        = 1; // 可选:按 did 过滤
  hi.Pagination pagination = 2;
}

message MerchantListResp {
  option (hi.audience) = VIS_PARTICIPANT; // 注册商户目录 → 商户生态内 PARTICIPANT
  message Unit {
    option (hi.audience) = VIS_PARTICIPANT;
    hi.Entity base       = 1 [(hi.visibility) = VIS_PUBLIC]; // hi.Entity 恒 PUBLIC
    int64     created_at = 2 [(hi.visibility) = VIS_PARTICIPANT]; // 取本消息档
  }
  int32         total = 1 [(hi.visibility) = VIS_PARTICIPANT];
  repeated Unit infos = 2 [(hi.visibility) = VIS_PARTICIPANT];
}

// 商户目录(超管)。承接原 `UserACL.List(type="all")` —— 那查的是**注册用户/商户名录**,
// 与"授权限"是两件事,混在一个方法里靠 type 分流,读的人看不懂,故拆出来。
// 与 hi.did.MerchantManage.List 同形对齐(hiai 里没有普通用户,只有商户)。
service Merchant {
  rpc List (MerchantListReq) returns (MerchantListResp) { option (hi.auth) = AUTH_SUPERADMIN; } // 超管:列注册商户
}
