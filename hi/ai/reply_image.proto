syntax = "proto3";

package hi.ai;

import "hi/options.proto";

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

// 插件成功取得、已转存到聊天桶的待发送图片；不表示已投递给用户。
// 元数据来自后台转存结果，不由模型填写；与模型视觉输入 Content 分开传递。
message ReplyImage {
  option (hi.audience) = VIS_SELF;
  optional string url = 1 [(hi.visibility) = VIS_SELF]; // 聊天桶原图地址，不是 ComfyUI 或 HiMedia 的临时地址。
  optional string name = 2 [(hi.visibility) = VIS_SELF]; // 实际文件名，映射聊天内容的 chat.name。
  optional uint64 size_bytes = 3 [(hi.visibility) = VIS_SELF]; // 实际字节数，映射 chat.size；JSON 为 sizeBytes。
}
