syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "hi/ai/chat.proto";
import "hi/common.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";

// ── 插件模型(a 壳 / b 版本 / c 壳级使用 / d 版本级使用,2026-07 四层重构)────────
//
//   a 壳    hi_ai_plugin                {uuid, name}                        —— 插件身份。**不含使用者**
//   b 版本  hi_ai_plugin_version        {uuid, version, 本体内容}            —— 脚本本体。**不含使用者**;(uuid,version) 冻结
//        **a + b 唯一确定一个脚本(执行流程),与谁用无关。**
//
//   c 壳级使用 hi_ai_plugin_using        {agent, uuid, enabled, source, data} —— 每 (使用者,插件) 一行,
//        **对该插件所有版本一致**。data=插件级扩展数据(hiclub 放 api_key)。
//        创建者由 (uuid, source=ORIGINAL) 唯一确定(DB 生成列唯一索引兜底)。
//   d 版本级使用 hi_ai_plugin_version_using {agent, uuid, version, active, data} —— 每 (使用者,插件,版本) 一行,
//        **各版本可不同**。active=该版本是否激活(同 (使用者,插件) 同时仅一个,DB 生成列唯一索引兜底);
//        data=版本级扩展数据(hiclub 放 club 侧数据)。
//        **当前激活版本从 d 查(active=true),不在 c 冗余存**,避免不同步。
//
// 运行期:c(enabled)⋈ d(active)⋈ b 取 url/description;注入 py 的 plugin_annex = c.data ∪ d.data(激活版)。
// **hiai 侧不认识 api_key**,只有 c/d 两级泛型扩展数据;api_key 是 hiclub 塞进 c.data 的约定。

// ⚠️ **消息 audience 是 SELF,但里面几个字段是 PUBLIC —— 这不矛盾。**
// lint 规则是 `level(field) <= level(message)`(见 hi/options.proto),
// 挡的只有"把私字段塞进公消息",PUBLIC 字段放进 SELF 消息本来就合法。
//
// 名字这类**展示物本身就是给别人看的** —— 市场标题就是它。
// 原先整条消息一路刷成 SELF,于是挂牌被迫另填一套 title/summary/logo,
// 同一个东西两份值、必然漂(叫法在市场和机器人插件列表里不一样,还没人会报错)。
message PluginShell {                                    // a
  option (hi.audience) = VIS_SELF;
  string uuid = 1 [(hi.visibility) = VIS_SELF]; // 插件 id,后台分配(单一 id)
  string name = 2 [(hi.visibility) = VIS_PUBLIC]; // 插件名。**市场标题直接用它**,不另填
  // 跑在哪儿。首版由包结构自动判定,之后不变 —— 它决定包的格式与执行方,换了等于换个插件。
  PluginRuntime runtime = 3 [(hi.visibility) = VIS_SELF];
}

message PluginVersion {                                  // b:按 (uuid,version) 冻结
  option (hi.audience) = VIS_SELF;
  string uuid        = 1 [(hi.visibility) = VIS_SELF]; // 所属壳
  string version     = 2 [(hi.visibility) = VIS_PUBLIC]; // 版本号(前端按现有版本预填,后端校验须>现有最大)
  // logo / summary 是**展示物**:市场页、插件详情页给买家看的就是这两个。
  // 标 PUBLIC 不是放松,是纠正 —— 它们本来就没有"只给自己看"的语义,
  // 而挂牌页要用它们(见 hi.club.MarketListingBrief:那边是门面,值从这儿来)。
  string logo        = 3 [(hi.visibility) = VIS_PUBLIC];
  string summary     = 4 [(hi.visibility) = VIS_PUBLIC];
  string url         = 5 [(hi.visibility) = VIS_SELF]; // 脚本包 zip:**至少含 main.py / requirements.txt / description.json**
  // function-call spec,**OpenAI tools 数组格式**(与 hi.ai.ToolSupply、与 brain 的
  // functions.json 完全一致 —— 三者的 tools 最终会合进同一个数组喂给模型):
  //
  //   [{"type":"function","function":{"name":...,"description":...,"parameters":{schema}}}, ...]
  //
  // **创建时不用传** —— 后端在 CreateVersion 时从脚本包里的 description.json 读出来存库
  // (运行期每次装配 function-call 都要它,存在包里就得每次下载解压,所以发版时预读一次)。
  // 读接口(Get/List/ListVersions)会把内容回给你,web 拿它展示这个包提供哪些方法。
  //
  // ⚠️ **存的是加工后的版本,不等于包里的 description.json** ——
  // 每个 name 都被改写成 `<壳前缀>_<原名>`。前缀是壳的属性(建壳时分配、全局唯一、永不变),
  // 作用是让不同插件包里的同名方法(`search` 遍地都是)喂给模型时不撞;
  // 与 brain 的内置工具(express_emotion 等,不带前缀)也天然错开。
  //
  // 为什么在**发版时**算好而不是每次装配现拼:装配是每轮对话都跑的热路径,名字本来就是固定的。
  // 派生值入库通常危险(会漂),但这里安全 —— 单一写入点,且 (uuid,version) 发布后冻结,
  // 那一行物理上改不了,没有第二份可以跟它分叉。
  //
  // 拿它跟包里的文件比对会对不上,**这是预期行为,别当 bug 查**。
  //
  // PUBLIC:买家在挂牌页看的 `MarketListingDetail.capabilities` 就是这一份 ——
  // 那边早就是公开的了,源头这边却标着 SELF,两边对不上。以这边为准改成 PUBLIC。
  string description = 6 [(hi.visibility) = VIS_PUBLIC];
}

// 插件跑在哪儿 —— **壳的属性**(同一个包不会一半 py 一半 rust),发版后不该再改。
//
// 这不只是个标签,它决定**谁执行**,而"谁执行"决定了一堆判据该由谁把关:
//
//   PYTHON —— 脚本包(main.py/requirements.txt/description.json),**hiai 服务端执行**。
//   NATIVE —— rust 源码包(Cargo.toml/src/description.json),云端交叉编译成 .so
//             **下发到机器人本地执行**,能碰摄像头、屏幕、GPIO、钱包。
//
// ⚠️ **NATIVE 绝不能进服务端的「执行名单」** —— hiai 这个运行时物理上跑不了 .so,
//    进了名单,按名字分流时会被判成"我自己跑",然后拿到一个假的成功。
//
//    但**可以、而且应该进「喂给模型的 tools 数组」**:那两个是分开的两个数组
//    (chat.go 里的 allTools 与 internal)。模型点了 NATIVE 方法,分流时落到 outside,
//    原样交回机器人执行 —— 那正是要的。
//
//    ⚠️ 这里原来写的是"服务端装配只收 PYTHON,NATIVE 由机器人自己上报"。**那是错的**,
//    代价是**启停控制没了**:后台把 enabled 关掉,服务端确实不再下发它,
//    但机器人内存里那份 .so **卸不掉**(Rust 没有安全的 dlclose),它照样上报、
//    模型照样点得到。描述由服务端出之后,关掉的那一行不进数组,模型当场看不见 ——
//    即使 .so 还装着。撤权同理。**控制点必须在后台,不能在机器人手里。**
//
//    机器人只保留一件事:知道自己能调哪些名字,收到 tool_call 时切回原名分发。
//    描述文件对它没用 —— 那是给模型看的,而模型在服务端那头。
//    **内置插件是例外**(跟着固件走、后台没有它的记录),仍由机器人上报。
//
// 由此,NATIVE 插件挂在一个**软件**机器人上是完全合法的 —— 那台机器人当"柜台":
// 只展示和存储、供人选购与下发,自己一个也跑不了。这样公共插件就不必挂在某台
// 硬件机器人上,免得那台机器一下线整个货架跟着消失。
// ⭐ **runtime 是自动判定的,不让用户声明。**
//
// 建壳时**根本没有包**,谈不上语言 —— 所以空壳一律 UNDETERMINED;
// 首版上传时后端解开 zip 按**包结构**认:
//
//   Cargo.toml → NATIVE      main.py → PYTHON      两个都有 / 都没有 → 报错,不猜
//
// 判定的材料早就在手上:`CreateVersion` 本来就要下载解压这个包去预读
// description.json(specFromPackage),顺手看一眼根目录有什么,零额外成本。
//
// 让用户在表单里选一次"这是 rust 还是 py",等于要他把包里已经写死的事实再抄一遍 ——
// 抄错了还没人拦得住(选了 PYTHON 传 rust 包:不会编译、当脚本跑、报一个看不懂的语法错)。
//
// 首版定下之后**壳的 runtime 冻结**:后续版本的包类型必须与壳一致,否则拒。
// 换语言等于换了个东西 —— uuid / fn_prefix / 已经装了它的那些机器人,一样都不能沿用。
enum PluginRuntime {
  PLUGIN_RUNTIME_PYTHON       = 0; // 服务端跑的 py 脚本包(历史插件全是这个,故占 0)
  PLUGIN_RUNTIME_NATIVE       = 1; // 机器人本地跑的 rust 插件(源码上传,云端编译后下发)
  PLUGIN_RUNTIME_UNDETERMINED = 2; // 空壳:还没有任何版本,包没上传过,语言未知
}

// ── NATIVE 的构建态 ────────────────────────────────────────────────────────
//
// **只有 NATIVE 有这一段。** PYTHON 的包传上来就能跑,不存在"编不编得出来";
// NATIVE 传上来的是 rust 源码,要交叉编译成 arm64 `.so` 才谈得上下发。
//
// 单独一张表、不并进 b(PluginVersion):b 是**发版即冻结**的本体,
// 而构建结果是几分钟后才回填的、还可能重试 —— 两种寿命塞进一行迟早打架。
enum PluginBuildStatus {
  PLUGIN_BUILD_STATUS_PENDING   = 0; // 已排队,还没开始(发版当场就是这个)
  PLUGIN_BUILD_STATUS_BUILDING  = 1; // 正在编
  PLUGIN_BUILD_STATUS_SUCCEEDED = 2; // 编出来了、校验过了、产物已上传
  PLUGIN_BUILD_STATUS_FAILED    = 3; // 编不出来 / 校验没过。error+log 里有原因
}

// 一次构建的结果。**发版接口不返回它** —— 发版是立即返回的,构建在后台跑,
// 结果经 Get/ListVersions 回显给发版的人看(编译中 / 失败+日志 / 成功)。
message PluginBuild {
  option (hi.audience) = VIS_SELF;
  string uuid    = 1 [(hi.visibility) = VIS_SELF];
  string version = 2 [(hi.visibility) = VIS_SELF];
  PluginBuildStatus status = 3 [(hi.visibility) = VIS_SELF];
  string artifact_url = 4 [(hi.visibility) = VIS_SELF]; // 编好的 .so(私有桶;下发时现签 presigned)
  string sha256       = 5 [(hi.visibility) = VIS_SELF]; // 产物摘要,机器人下完照此核对
  uint32 abi_version  = 6 [(hi.visibility) = VIS_SELF]; // 从 .so 里真读出来的(见 hi.ai.plugin.BuildResp)
  string error        = 7 [(hi.visibility) = VIS_SELF]; // 失败原因(一句话)
  string log          = 8 [(hi.visibility) = VIS_SELF]; // 编译日志尾部
  int64  started_at   = 9 [(hi.visibility) = VIS_SELF];
  int64  finished_at  = 10 [(hi.visibility) = VIS_SELF];
}

// 插件在某机器人使用记录里的来源(历史事实;引用不是拷贝,只多一行 c 指向同壳)。
enum PluginSource {
  PLUGIN_SOURCE_ORIGINAL  = 0; // 原始:主人上传的(每 uuid 唯一)
  PLUGIN_SOURCE_REFERENCE = 1; // 引用:经授权用别人的脚本;**不能下载源码**
}

// 某 agent 视角的一个插件:壳 + 激活版本内容 + 壳级使用(enabled/source/data)+ 激活版本的版本级 data + 引用计数。
// **每机器人各不相同的 = c(enabled/source/data,含 api_key)+ d(激活版 + 版本级 data)**,这正是拆表的意义。
message PluginView {
  option (hi.audience) = VIS_SELF;
  PluginShell   shell        = 1 [(hi.visibility) = VIS_SELF];
  PluginVersion active       = 2 [(hi.visibility) = VIS_SELF]; // 激活版本内容(无激活为空)
  bool          enabled      = 3 [(hi.visibility) = VIS_SELF]; // c.enabled:插件是否开启
  PluginSource  source       = 4 [(hi.visibility) = VIS_SELF]; // c.source
  int32         ref_count    = 5 [(hi.visibility) = VIS_SELF]; // 被多少机器人引用(实时 COUNT)
  google.protobuf.Struct data         = 6 [(hi.visibility) = VIS_SELF]; // c.data:插件级扩展数据(含 api_key)
  google.protobuf.Struct version_data = 7 [(hi.visibility) = VIS_SELF]; // 激活版本的 d.data:版本级扩展数据
  // 激活版本的构建态。**NATIVE 才有,PYTHON 恒空。**
  // 一级页要它是因为:NATIVE 插件"挂上了"不等于"能用了" —— 中间隔着一次交叉编译。
  // 不回显的话,用户看到插件已启用、机器人却始终没装上,查不出是编失败了。
  PluginBuild   build        = 8 [(hi.visibility) = VIS_SELF];
}

// 二级页一行:某版本内容 + 该 agent 是否激活它 + 该 agent 对该版本的版本级数据。
message PluginVersionView {
  option (hi.audience) = VIS_SELF;
  PluginVersion version = 1 [(hi.visibility) = VIS_SELF];
  bool          active  = 2 [(hi.visibility) = VIS_SELF];
  google.protobuf.Struct data = 3 [(hi.visibility) = VIS_SELF]; // d.data
  PluginBuild   build   = 4 [(hi.visibility) = VIS_SELF]; // 该版本的构建态(NATIVE 才有)
}

// 插件加载完成通知(公开摘要,不带私产)。
message PluginLoaded {
  option (hi.audience) = VIS_PARTICIPANT;
  string uuid    = 1 [(hi.visibility) = VIS_PARTICIPANT];
  string name    = 2 [(hi.visibility) = VIS_PARTICIPANT];
  string version = 3 [(hi.visibility) = VIS_PARTICIPANT];
  bool   enabled = 4 [(hi.visibility) = VIS_PARTICIPANT];
}

// 建空壳:插 a{uuid,name,runtime=UNDETERMINED} + owner 的 c{source=original, enabled=false}。
// uuid 后台分配返回;此时无版本、无激活、**语言未知**(见 PluginRuntime:首版的包说了算)。
// data=插件级扩展数据(hiclub 放该机器人 api_key;hiai 直连则空)。
//
// ⚠️ **没有 runtime 字段,不要再加回来。** 4 号留空是原 `runtime` 的位置。
// 建壳时还没有包,语言这件事在这一刻**不存在**;它由首版上传的包结构自动判定。
message CreateShellReq {
  reserved 4;
  reserved "runtime";
  string      agent = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string      name  = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Struct data = 3; // c.data(插件级)
}
message CreateShellResp {
  option (hi.audience) = VIS_SELF;
  string uuid = 1 [(hi.visibility) = VIS_SELF];
}

// 给壳加版本:插 b。若该 agent 对此壳还没激活版(首版)→ 顺带插 d(active=true) 自动激活。
// data=该 agent 对这一版的版本级扩展数据(hiclub 放 club 数据)。
message CreateVersionReq {
  string        agent   = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  // version.uuid=壳;version.version + 本体内容。
  // **description 不用填**:后端从 version.url 那个包里的 description.json 预读入库;
  // 包里没有它会直接报错(过渡期:字段里直接给合法 spec 内容仍收,但会告警)。
  PluginVersion version = 2;
  google.protobuf.Struct data = 3; // d.data(版本级)
}

// 改扩展数据:壳级(c.data)和/或某版本级(d.data)。**壳/版本本体冻结,不动。**
message EditPluginReq {
  string                 agent        = 1;
  string                 uuid         = 2;
  optional google.protobuf.Struct data         = 3; // 传了才改 c.data(插件级)
  optional string                 version      = 4; // 配合 version_data 指定改哪个版本的 d.data
  optional google.protobuf.Struct version_data = 5; // 传了(且 version 非空)才改 d.data
}

message SetEnabledReq { string agent = 1; string uuid = 2; bool enabled = 3; }             // 改 c.enabled
message SetActiveReq  { string agent = 1; string uuid = 2; string version = 3; }           // 改 d.active(事务内互斥)

// SetActiveAll 把**所有使用方**切到同一版 —— 官方/内置插件发新版时用。
//
// 为什么需要它:激活版是**每个使用方各一行**(d),发新版不会动别人那行。对普通插件这是
// 对的(作者发新版可能改坏,不该自动打穿所有引用方,所以有 follow_latest 这个开关);
// 但**内置插件的版本必须全网统一** —— 它是平台能力,还跟 brain 的 ABI 绑在一起,
// 一台机器人停在老版就是一台设备的能力与固件对不上。
//
// ⚠️ **没有 agent 参数**,也没有"要切哪些"的名单:主体就是"这个壳的所有使用方"。
//    给了名单就等于让调用方去枚举几千个 did,而那份名单迟早与事实不符。
//
// ⚠️ 与 SetActive 同一套语义(没有 d 行就以当前激活版的 d.data 为模板补一行再激活),
//    所以引用方不必发过版也切得动。
message SetActiveAllReq {
  string uuid    = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string version = 2 [(buf.validate.field).string.pattern="^\\S+$"];
}
message SetActiveAllResp {
  option (hi.audience) = VIS_SELF;
  int32 switched = 1 [(hi.visibility) = VIS_SELF]; // 切过去的使用方个数(日志/回显用)
}

message DownloadScriptReq { string agent = 1; string uuid = 2; string version = 3; }
message DownloadScriptResp {
  option (hi.audience) = VIS_SELF;
  bytes  content = 1 [(hi.visibility) = VIS_SELF];
  string name    = 2 [(hi.visibility) = VIS_SELF];
}

message ListPluginsReq  { string agent = 1; hi.Pagination pagination = 2; }
message ListVersionsReq { string agent = 1; string uuid = 2; hi.Pagination pagination = 3; }
message ListPluginsResp {
  option (hi.audience) = VIS_SELF;
  int32               total = 1 [(hi.visibility) = VIS_SELF];
  repeated PluginView list  = 2 [(hi.visibility) = VIS_SELF];
}
message ListVersionsResp {
  option (hi.audience) = VIS_SELF;
  int32                      total = 1 [(hi.visibility) = VIS_SELF];
  repeated PluginVersionView list  = 2 [(hi.visibility) = VIS_SELF];
}
message GetPluginReq  { string agent = 1; string uuid = 2; }
message GetPluginResp {
  option (hi.audience) = VIS_SELF;
  PluginView view = 1 [(hi.visibility) = VIS_SELF];
}

// 删单个版本(b 该行 + 全部 agent 的 d 该版本行 + 脚本文件)。**仅创建者(c.source=original)可删** —— 版本是共享本体。
message DeleteVersionReq {
  string agent   = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string uuid    = 2 [(buf.validate.field).string.pattern="^\\S+$"];
  string version = 3 [(buf.validate.field).string.pattern="^\\S+$"];
}
// 批量删版本:删该插件在 **[min_version, max_version] 范围内**(按三级版本号数值比较,含端点)的全部版本。
// min_version 空=不设下界,max_version 空=不设上界(两者都空=全部版本)。**仅创建者可删**。
message DeleteVersionsReq {
  string agent       = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string uuid        = 2 [(buf.validate.field).string.pattern="^\\S+$"];
  string min_version = 3; // 空=不设下界
  string max_version = 4; // 空=不设上界
}
// 批量删**指定的**若干版本(前端勾选的一批,**版本号可不连续**)。**仅创建者可删**。
message DeleteVersionListReq {
  string agent    = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string uuid     = 2 [(buf.validate.field).string.pattern="^\\S+$"];
  repeated string versions = 3; // 要删的版本号列表(可不连续)
}
// 从某机器人移除插件。**按归属分别处理**:该 agent 是创建者(c.source=original)→ 删整个插件
// (a+全部b+全部c+全部d+脚本文件,全局);是引用方(reference)→ 只解绑本机器人(删本 agent 的 c/d,壳留给 owner)。
// 这样引用方删不掉别人的插件。
message DeleteShellReq {
  string agent = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string uuid  = 2 [(buf.validate.field).string.pattern="^\\S+$"];
}
// 批量:一次从某机器人移除多个插件,每个 uuid 语义同 DeleteShell(按归属删壳或解绑)。
message DeleteShellsReq {
  string          agent = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  repeated string uuids = 2;
}
// **内部级联清理**:某些机器人被撤"插件权限"时,清掉它们名下全部插件绑定(club PermissionService.Revoke 调,非前端按钮)。
message DeletePluginByAgentsReq { repeated string agents = 1; }

// CreateReference **按授权建引用** —— 插件市场的落地点。
//
// 语义 = 插 c(source=REFERENCE) + d(active=true),**一个字都不碰 a/b**
// (壳与版本是共享本体,引用方无权改)。这正是 PluginSource 里那条
// 「引用:经授权用别人的脚本;**不能下载源码**」终于被用上的地方。
//
// 与 CreateShell 的区别:CreateShell 是建**新**壳(a+c),这里是给**已有**壳加一个使用者。
//
// 幂等:该 agent 已有该 uuid 的 c 行 → 直接返回成功(重试安全)。拒绝:壳不存在。
//
// ⚠️ **data 必须是受让方机器人自己的扩展数据** —— 尤其 api_key。
//    club 侧复用建壳时那套「取该机器人第一个有效 apikey 塞进 c.data」的逻辑,主体换成受让方。
//    **绝不能把出让方的 c.data 拷过来** —— 那等于把出让方的凭据连同脚本一起交出去了。
//    c/d 本来就是「每机器人各不相同的使用态」,这正是当初拆表的意义。
message CreateReferenceReq {
  string agent   = 1 [(buf.validate.field).string.pattern="^\\S+$"]; // 受让方机器人
  string uuid    = 2 [(buf.validate.field).string.pattern="^\\S+$"]; // 壳 uuid(别人的)
  string version = 3; // 空 = 取出让方当前激活版
  google.protobuf.Struct data         = 4; // c.data(club 注入受让方自己的 api_key)
  google.protobuf.Struct version_data = 5; // d.data
}

// ── 展示面:市场要拿插件自己的名字/图/简介 ──────────────────────────────────
//
// 为什么要**批量**:市场列表一页 N 条挂牌,逐条 `Get` 就是 N 次 grpc 往返。
// 而这三样东西正是"读侧现取"的代价 —— 代价必须是一次查询,不然下一个人
// 又会想着"要不还是在挂牌行里存一份吧",绕回那两套值。
//
// 为什么带 agent:插件的**展示信息跟着出让方当前激活的那一版**走
// (与"引用跟版"同一口径),而 active 是每个使用方各自的(d 表),所以必须给主体。
message PluginRef {
  string agent = 1 [(buf.validate.field).string.pattern="^\S+$"];
  string uuid  = 2 [(buf.validate.field).string.pattern="^\S+$"];
}

message PublicBriefsReq {
  repeated PluginRef refs = 1;
}

// 一个插件对外能看到的全部展示信息。**没有 url / api_key / 扩展数据**。
message PluginPublicBrief {
  option (hi.audience) = VIS_PUBLIC;
  string agent   = 1 [(hi.visibility) = VIS_PUBLIC];
  string uuid    = 2 [(hi.visibility) = VIS_PUBLIC];
  string name    = 3 [(hi.visibility) = VIS_PUBLIC]; // 壳名
  string version = 4 [(hi.visibility) = VIS_PUBLIC]; // 该 agent 当前激活版(没有则空)
  string logo    = 5 [(hi.visibility) = VIS_PUBLIC]; // 激活版的
  string summary = 6 [(hi.visibility) = VIS_PUBLIC]; // 激活版的
}

message PublicBriefsResp {
  option (hi.audience) = VIS_PUBLIC;
  // 查不到的 ref **直接不出现在结果里**(不是返回一个空壳条目)——
  // 调用方按 (agent,uuid) 对号入座,漏掉的那条自己决定怎么显示。
  repeated PluginPublicBrief briefs = 1 [(hi.visibility) = VIS_PUBLIC];
}

// ── 下发面:机器人问「我该装哪些 NATIVE 插件」───────────────────────────────
//
// 只回**该装的**:c.enabled ∧ d.active ∧ 壳是 NATIVE ∧ 该版本构建成功。
// 任一不成立就不该出现在清单里 —— 机器人拿到就会装,而装了就会喂给模型。
//
// ⚠️ **清单是全量,不是增量。** 机器人按它对账:多的删、少的下、sha256 不同的换。
// 增量(只告诉"新增了什么")没法表达撤权与到期 —— 而那两件事恰恰必须传达到:
// 市场 revoke 删的是服务端的引用行,机器人本地那个 `.so` 不会自己消失。
message NativePlugin {
  option (hi.audience) = VIS_SELF;
  string uuid    = 1 [(hi.visibility) = VIS_SELF]; // 壳 uuid。**落地文件名就是它**(`plugins/<uuid>.so`)
  string name    = 2 [(hi.visibility) = VIS_SELF]; // 壳名,只用于机器人日志
  string version = 3 [(hi.visibility) = VIS_SELF];
  // 壳前缀。机器人**上报 tools 时要拼在方法名前**(`<fn_prefix>_<原名>`),
  // 分发时切第一个 `_` 切掉。
  //
  // ⚠️ 这个字段原本是 hiai 的内部实现细节(见 PluginVersion.description 那段注释),
  // 现在必须过线 —— 因为 `.so` 里编进去的 manifest 是**原始名**,
  // 而 py 插件那侧的改名是在发版预读时做掉的,`.so` 没有对应的时机。
  // 不给机器人前缀的话,两个厂商各卖一个提供 `search` 的插件,买家两个都买 →
  // 机器人本地撞名 → 整个插件拒绝加载,而失败原因只在机器人的本地日志里。
  string fn_prefix = 4 [(hi.visibility) = VIS_SELF];
  // `.so` 的下载地址。私有桶,**每次拉清单现签**(限期),不存库。
  string url       = 5 [(hi.visibility) = VIS_SELF];
  string sha256    = 6 [(hi.visibility) = VIS_SELF]; // 下完必须核对;对不上就是没下全或被改过
  uint32 abi_version = 7 [(hi.visibility) = VIS_SELF]; // 机器人可据此先筛掉对不上的,省一次下载
}

message ListNativeReq { string agent = 1 [(buf.validate.field).string.pattern="^\\S+$"]; }
message ListNativeResp {
  option (hi.audience) = VIS_SELF;
  repeated NativePlugin list = 1 [(hi.visibility) = VIS_SELF];
}

// 重编一版。编译失败(网络抖、依赖源挂了)后不必删版本重发一遍 ——
// 版本本体是冻结的,重编的是**产物**,不是版本。
message RetryBuildReq {
  string agent   = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string uuid    = 2 [(buf.validate.field).string.pattern="^\\S+$"];
  string version = 3 [(buf.validate.field).string.pattern="^\\S+$"];
}

// 插件管理(主体=插件)。商户档:hiai web 与三方商户后台(club)都会调。
service Plugin {
  rpc CreateShell (CreateShellReq) returns (CreateShellResp) { option (hi.auth) = AUTH_MERCHANT; }           // 建空壳(后台分配 uuid)
  rpc CreateVersion (CreateVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 给壳加版本(校验版本号,首版自动激活)
  rpc Edit (EditPluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }             // 只改 c.data / d.data 扩展数据(壳名/版本本体发布后冻结,要改删了重建)
  rpc Get (GetPluginReq) returns (GetPluginResp) { option (hi.auth) = AUTH_MERCHANT; }
  rpc List (ListPluginsReq) returns (ListPluginsResp) { option (hi.auth) = AUTH_MERCHANT; }                  // 一级页:壳 + 激活版
  rpc ListVersions (ListVersionsReq) returns (ListVersionsResp) { option (hi.auth) = AUTH_MERCHANT; }        // 二级页:某壳所有版本 + 哪个 active
  rpc Delete (DeleteVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }        // 删单个版本(仅创建者)
  rpc DeleteVersions (DeleteVersionsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 批量删版本(范围 [min,max],仅创建者)
  rpc DeleteVersionList (DeleteVersionListReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 批量删指定版本(列表,可不连续,仅创建者)
  rpc DeleteShell (DeleteShellReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }     // 从机器人移除单个插件(创建者删壳/引用方解绑)
  rpc DeleteShells (DeleteShellsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }   // 批量从机器人移除多个插件
  rpc CreateReference (CreateReferenceReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 按授权建引用(市场装载;插 c=REFERENCE + d,不碰 a/b,幂等)
  rpc DeleteByAgents (DeletePluginByAgentsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 内部级联(仅 grpc,不配 http):club 撤"插件权限"时经 aiapi 调,清某些机器人全部插件;非前端接口
  rpc SetActive (SetActiveReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }         // 激活某版本(d.active 互斥)
  rpc SetActiveAll (SetActiveAllReq) returns (SetActiveAllResp) { option (hi.auth) = AUTH_MERCHANT; }        // 所有使用方一起切到某版(官方/内置插件发新版)
  rpc SetEnabled (SetEnabledReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }       // 插件开关(c.enabled)
  rpc ListNative (ListNativeReq) returns (ListNativeResp) { option (hi.auth) = AUTH_MERCHANT; }              // 下发清单:某机器人该装哪些 NATIVE 插件(club 经此穿透)
  rpc RetryBuild (RetryBuildReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }       // 重编一版(仅创建者;版本本体不动,重来的是产物)
  rpc PublicBriefs (PublicBriefsReq) returns (PublicBriefsResp) { option (hi.auth) = AUTH_MERCHANT; }        // 批量取展示信息(市场列表页用;一次一页,别 N 次 Get)
}

// ── py-docker 执行契约已迁至子服务内部面 `hi/ai/plugin/base.proto`(package hi.ai.plugin)──
//
// 原 `service AiPlugin` + `RunReq/RunResp/CleanupReq/PluginAnnex` 都搬去了那里,并:
//   · 档位 AUTH_NONE → **AUTH_INTERNAL**(它只由 ai 转发调用,不是公开面;而它执行的是任意代码,
//     标成"公开"极易被误当作可对外暴露);
//   · 服务名 AiPlugin → **Runner**(全名 hi.ai.plugin.Runner,去掉 `hi.ai.AiPlugin` 里冗余的 Ai)。
//
// 本文件只保留**对外面** `service Plugin`(AUTH_MERCHANT,插件管理),契约一字未动。
