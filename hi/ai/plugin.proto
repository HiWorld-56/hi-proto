syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "hi/ai/chat.proto";
import "hi/common.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";

// ── 插件模型(body / annex 分层,2026-07 重构)───────────────────────────────
// 插件 = plugin_body(本体,可多机器人共享)+ plugin_annex(附件,每机器人各异)。
//   · plugin_body{uuid, version, script(zip), description=function-call格式} —— 按 (uuid,version)
//     不可变;同 uuid 多版本共存,某 agent 只激活一个。**可被多个机器人引用**(为插件市场铺路)。
//   · plugin_annex{api_key, data} —— 某机器人对某 body 的附件:
//       api_key = 机器人的 club 原生 apikey(上传时 club 自动取该 agent 第一个;鉴权范围 ≤ token),
//                 脚本用它调 hiclub 的受限方法子集;
//       data    = 用户填的运行时扩展数据。
//     运行期把 **plugin_annex 作为一个字典型全局变量 `plugin_annex` 注入 py 执行环境**。
//   · 同一 body 被不同机器人引用 → 多条 annex,api_key/data 各异。
//
// 只保留 py 脚本一种(原 search/draw 已砍)。依赖由工程内 requirement.txt 显式声明。

// plugin_body:插件本体。
//
// **uuid = <主id>_<次id>,它就是"插件 id" —— 系统内一个 uuid 就是一个独立插件。**
// 同一个主id 下的多个 uuid = 同一脚本的多个版本;一级列表按主id 聚合,二级页列出各 uuid。
// ⚠️ **次id 与 version 无关**:次id 是后台生成的身份,version 是用户贴的标签。
//    正因如此,用户删掉某版本再用同一个版本号重建,拿到的是**新的 uuid**,
//    老的引用指向的仍是那个已删除的插件,不会被悄悄换掉内容。
//
// ⚠️ **发布后整行冻结** —— name/logo/summary 也不例外。
//    定版的东西如果能改,版本就失去意义了;要改就发新版本。
message PluginBody {
  option (hi.audience) = VIS_SELF; // 经 PluginView 返回给持有者;url(脚本)是私产
  string uuid        = 1 [(hi.visibility) = VIS_SELF]; // 插件 id = <主id>_<次id>,后台生成
  string name        = 2 [(hi.visibility) = VIS_SELF]; // 脚本名(给人看)
  string logo        = 3 [(hi.visibility) = VIS_SELF]; // 图标 url
  string summary     = 4 [(hi.visibility) = VIS_SELF]; // 详情资源 url:介绍页或一张美工图,由用户自定
  string version     = 5 [(hi.visibility) = VIS_SELF]; // 三级版本号如 1.23.66,用户自填;仅作标签,**不参与身份**
  string url         = 6 [(hi.visibility) = VIS_SELF]; // 主脚本包 zip url(内含 main.py + requirement.txt)
  string description = 7 [(hi.visibility) = VIS_SELF]; // 完整 function-call spec(作用 + parameters schema)
}

// plugin_annex:某机器人对某 body 的附件。运行期以字典全局变量注入执行环境。
message PluginAnnex {
  string                 api_key = 1; // agent 的 club-apikey(club 上传时自动取第一个)
  google.protobuf.Struct data    = 2; // 用户填的运行时扩展数据
}

// 某 agent 视角的一个插件:body + 该 agent 的绑定状态(List/Get 返回;api_key 敏感不随列表回)。
message PluginView {
  option (hi.audience) = VIS_SELF; // 插件挂机器人下,持有者私产
  PluginBody   body      = 1 [(hi.visibility) = VIS_SELF];
  string       active    = 2 [(hi.visibility) = VIS_SELF]; // 该 agent 激活的 uuid;body.uuid == active 即本行生效
  bool         enabled   = 3 [(hi.visibility) = VIS_SELF]; // 该 agent 是否启用此插件参与推理
  PluginSource source    = 4 [(hi.visibility) = VIS_SELF]; // 来源:主人直接上传 or 经授权引用
  int32        ref_count = 5 [(hi.visibility) = VIS_SELF]; // 被多少机器人引用(实时 COUNT,**不落库**,存了必漂)
}

// 插件加载完成的**通知载荷**。只说"哪个插件好了",不带任何私产。
//
// ⚠️ 别再往通知里塞 PluginView:它是 VIS_SELF(body.url 是私有 bucket 的脚本包地址,
//    脚本是 owner 私产、且是可交易资产),而 hi.club.Notice 是 VIS_PARTICIPANT ——
//    SELF 装进 PARTICIPANT 本该被可见性 lint 拦下,只因中间隔了个 google.protobuf.Any
//    才没拦住。**Any 是那套 lint 唯一的结构性缺口**,往里塞什么要自己把关。
message PluginLoaded {
  option (hi.audience) = VIS_PARTICIPANT;
  string uuid    = 1 [(hi.visibility) = VIS_PARTICIPANT]; // 插件 id(<主id>_<次id>)
  string name    = 2 [(hi.visibility) = VIS_PARTICIPANT];
  string version = 3 [(hi.visibility) = VIS_PARTICIPANT];
  bool   enabled = 4 [(hi.visibility) = VIS_PARTICIPANT]; // 是否参与推理
}

// 插件在某机器人列表里的来源。
//
// ⚠️ 这是**历史事实,推导不出来** —— 不能用"agent 是不是创建者"去判:
//    一个主人有三个机器人、同一脚本装三个上去,那样会把其中两个误判成引用。
// ⚠️ **引用不是拷贝** —— 只是把同一个 uuid 放进另一个机器人的列表,不新建 body。
enum PluginSource {
  PLUGIN_SOURCE_ORIGINAL  = 0; // 原始:主人给这个机器人上传的
  PLUGIN_SOURCE_REFERENCE = 1; // 引用:经授权用别人的脚本;**不能下载源码**
}

// 发布一个插件(= 脚本的一个版本)+ 建该机器人的 annex(source=original)。
// root 空=全新脚本(生成 主id+次id);非空=给该脚本加新版本(只生成次id,且版本号须大于现有最大)。
// **uuid 已存在必拒**,发布即冻结。
// annex.api_key 由 club 自动取该 agent 第一个 club-apikey 填入(ai 只存);data 用户填。
message CreatePluginReq {
  string      agent = 1; // 装到哪个 agent
  string      root  = 2; // 主id:**空=全新脚本**(后台生成 主id+次id);非空=给该脚本**加新版本**(只生成次id)
  PluginBody  body  = 3; // uuid 由后台生成并回填,调用方不要传;其余字段由用户/前端提供
  PluginAnnex annex = 4; // api_key 由 club 自动填、data 用户填
}

message CreatePluginResp {
  option (hi.audience) = VIS_SELF;
  string uuid = 1 [(hi.visibility) = VIS_SELF]; // 插件 id
}

// 把一个**已有 body** 绑定到某 agent(生成一条 annex)。插件市场"分享/授权"通过后由 club 调;
// owner 首次上传走 Create(自带 annex),本方法用于**同 body 多机器人引用**。
message CreateAnnexReq {
  string      agent   = 1; // 目标 agent did
  string      uuid    = 2; // 要绑定的 body uuid
  string      version = 3; // 激活哪个版本(该 agent 的 active)
  PluginAnnex annex   = 4; // 该 agent 的 api_key(club 取)+ data
}

// 改绑定关系。**body 一个字段都不能改** —— 发布即冻结,要改就发新版本。这里只动该 agent 的 annex。
message EditPluginReq {
  string      agent = 1; // agent did
  string      uuid  = 2; // 插件 id
  PluginAnnex annex = 3; // 改该 agent 的 api_key/data
}

message SetEnabledReq {
  string agent   = 1; // agent did
  string uuid    = 2; // 脚本 id
  bool   enabled = 3; // 该 agent 是否参与推理
}

// 选定该 agent 激活哪个版本。uuid 本身即版本身份,不需要再传版本号。
// 同一主id 下只能激活一个;不同机器人可各自激活不同版本。
message SetActiveReq {
  string agent = 1; // agent did
  string uuid  = 2; // 要激活的插件 id
}

// 下载脚本包。私有 bucket 匿名取不到,故由服务端带凭据取回字节。
message DownloadScriptReq {
  string agent = 1; // agent did(校验持有关系)
  string uuid  = 2; // 插件 id
}

message DownloadScriptResp {
  option (hi.audience) = VIS_SELF; // 脚本内容是 owner 私产
  bytes  content = 1 [(hi.visibility) = VIS_SELF];
  string name    = 2 [(hi.visibility) = VIS_SELF]; // 建议的文件名
}

message ListPluginReq {
  string        agent      = 1;
  hi.Pagination pagination = 2;
}

message ListVersionsReq {
  string        agent      = 1; // agent did
  string        root       = 2; // 主id:列该脚本的所有版本
  hi.Pagination pagination = 3;
}

message ListPluginResp {
  option (hi.audience) = VIS_SELF;
  int32               total = 1 [(hi.visibility) = VIS_SELF];
  repeated PluginView list  = 2 [(hi.visibility) = VIS_SELF];
}

message GetPluginReq {
  string agent = 1; // agent did
  string uuid  = 2; // 插件 id
}

message GetPluginResp {
  option (hi.audience) = VIS_SELF;
  PluginView view = 1 [(hi.visibility) = VIS_SELF];
}

// 删除。二选一:uuid=删这一个版本(**连同脚本文件一并删**);root=删该脚本全部版本。
// ⚠️ 允许**强删正被引用的插件** —— 引用方的 annex 不清理,指向随即失效;
//    调用时该 tool 返错给 LLM,但**不打断整体推理流程**。删前把 ref_count 摆给用户看。
message DeletePluginReq {
  string agent = 1; // agent did
  string uuid  = 2; // 删单个版本
  string root  = 3; // 主id:删该脚本全部版本(与 uuid 二选一)
}

message DeletePluginByAgentsReq {
  repeated string agents = 1;
}

// 插件管理(主体=插件)。商户档:hiai web 与三方商户后台(club)都会调。
// ⚠️ 方法名别用 `Switch`(Dart 保留字,dart 生成器会语法错)。
service Plugin {
  // ── 脚本包存取(hiai bucket,**私有**)──────────────────────────────
  // 脚本是 owner 私产、且是插件市场里的可交易资产,故 bucket 不开匿名读:
  // 拿到 url 也直接下不了,必须经 Download 走服务端凭据。
  // 上传与建插件解耦:先 UploadScript 拿 url,再把 url 放进 CreatePluginReq。
  rpc UploadScript (stream hi.UploadStreamReq) returns (hi.UploadResp) { option (hi.auth) = AUTH_MERCHANT; } // 传脚本 zip(分片)
  rpc DownloadScript (DownloadScriptReq) returns (DownloadScriptResp) { option (hi.auth) = AUTH_MERCHANT; }  // 下脚本 zip;**仅 ORIGINAL 放行**,引用方不给源码
  rpc Create (CreatePluginReq) returns (CreatePluginResp) { option (hi.auth) = AUTH_MERCHANT; }        // 上传脚本版本 + 建 owner annex
  rpc CreateAnnex (CreateAnnexReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 把已有 body 绑到某 agent(市场分享用)
  rpc Edit (EditPluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }       // 只改 annex(body 冻结)
  rpc Get (GetPluginReq) returns (GetPluginResp) { option (hi.auth) = AUTH_MERCHANT; }                 // 查某插件
  rpc List (ListPluginReq) returns (ListPluginResp) { option (hi.auth) = AUTH_MERCHANT; }              // 一级页:列某 agent 的脚本(每 uuid 一行,激活版本)
  rpc ListVersions (ListVersionsReq) returns (ListPluginResp) { option (hi.auth) = AUTH_MERCHANT; }    // 二级页:按主id 列该脚本所有版本
  rpc Delete (DeletePluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }   // 删版本或整个脚本(连同脚本文件)
  rpc DeleteByAgents (DeletePluginByAgentsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 按 agent 批量删
  rpc SetActive (SetActiveReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 选该 agent 的激活版本
  rpc SetEnabled (SetEnabledReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 该 agent 脚本级开关
}

// ── py-docker 执行契约 ──────────────────────────────────────────────────
// AiPlugin 是独立 py-docker 服务,专门安全执行 py 脚本。hiai 只作调用方,本 server 不在 hiai 实现。
message RunReq {
  string          code_archive_url = 1; // 主脚本包 zip(= body.url)
  string          code_params      = 2; // 调用参数(作 argv)
  string          uuid             = 3; // 插件真实 uuid
  repeated string envs             = 4; // 环境变量 key=value
  PluginAnnex     annex            = 5; // {api_key, data} → 以字典全局变量 plugin_annex 注入
}

message RunResp {
  option (hi.audience) = VIS_SELF; // 引用 chat.Content(SELF)
  repeated Content conts = 1 [(hi.visibility) = VIS_SELF];
}

message CleanupReq {
  string code_archive_url = 1;
}

// py-docker 脚本执行(由 py-docker 服务实现,hiai 只作调用方)。
service AiPlugin {
  rpc Run (RunReq) returns (RunResp) { option (hi.auth) = AUTH_NONE; }                            // 跑脚本工程
  rpc Cleanup (CleanupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; }      // 清理脚本工程
}
