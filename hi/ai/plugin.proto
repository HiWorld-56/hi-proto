syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "hi/ai/chat.proto";
import "hi/common.proto";
import "buf/validate/validate.proto";
import "hi/options.proto";

// ── 插件 = py 脚本工程,一种而已 ─────────────────────────────────────────
// 原先还有"网搜(search)/画图(draw)"两类,已**整体砍掉**:那两类完全可以封装进 py 脚本里执行,
// 而且局限性太大(比如不好传入用户数据)。现在 Plugin 就是 py 一种。
//
// 一个插件的组成(定稿):
//   ID          插件 id
//   Version     版本号(用户上传时自填;同插件多版本共存,但只有一个供 function call 调用)
//   主脚本包     zip:main.py(主执行代码,接受参数)+ requirement.txt(依赖清单)
//               —— py-docker 执行前跑 pip install -r requirement.txt(**不再自动推导依赖**)
//   参数文件     xxx.json,功能/参数说明,供 function call 理解;网页上配置后自动生成
//   ExAPIKey    三方(hiclub)上传时自动塞入,让脚本内可调用三方服务
//   ExData      预先上传的数据,脚本调用时可用
// ExAPIKey / ExData 在脚本调用时**以 py 字典结构直接注入执行环境**。
//
// ⚠️ 正因为有 ExAPIKey,hiai 不再需要"运行期回调三方要 apikey"那套机制 —— 原 UserCallback 已删。

// 一个脚本版本。**身份是两层:`uuid`(脚本)+ `version`(版本)**。
// 同一个脚本的多个版本**共享同一个 uuid**,靠 version 区分,只有一个 active。
message PluginItem {
  option (hi.audience) = VIS_SELF; // 插件挂机器人下、按归属管控(uuid 越权已修)→ owner 私产
  string uuid        = 1 [(hi.visibility) = VIS_SELF]; // **脚本 id**:跨版本稳定 —— 同脚本的所有版本共用它
  string agent       = 2 [(hi.visibility) = VIS_SELF]; // 智能体did
  string name        = 3 [(hi.visibility) = VIS_SELF]; // 脚本名字
  string url         = 4 [(hi.visibility) = VIS_SELF]; // 主脚本包(zip)url:内含 main.py + requirement.txt
  string description = 5 [(hi.visibility) = VIS_SELF]; // 脚本描述
  string version     = 6 [(hi.visibility) = VIS_SELF]; // 版本号(用户上传时自填)
  bool   active      = 7 [(hi.visibility) = VIS_SELF]; // **版本级**开关:本版本是否供 function call 调用(同 uuid 下只有一个为 true)
  int64  created_at  = 8 [(hi.visibility) = VIS_SELF];
  bool   enabled     = 9 [(hi.visibility) = VIS_SELF]; // **脚本级**开关:本脚本是否参与推理。与 active 是两个维度:
                          //   active=同一脚本的哪个版本上台;enabled=这个脚本要不要参与推理。
                          //   有 plugin 权限即模块开,装配 function-call 工具时按 active AND enabled 过滤。
}

// 脚本级开关:设定某脚本是否参与推理(与 SetActiveVersion 的"版本级 active"对称)。
// **有 plugin 权限即模块开**,单个脚本用 enabled 自行关掉;不在插件这边碰记忆开关。
// (记忆开关 use_mem 归 AgentConfig,经 Agent.Edit 设置 —— 不开第二条写同一位的路径。)
message SetEnabledReq {
  string uuid    = 1; // 脚本 id
  bool   enabled = 2; // 是否参与推理
}

// 上传一个脚本版本。`uuid` 空 = 新脚本(后台生成 uuid);非空 = **给已有脚本加一个版本**。
// 后台按 (uuid, version) 判断:该版本已存在则**覆盖**,否则**新建**。
message CreatePluginReq {
  string agent = 1; // 智能体did
  string url   = 2 [(buf.validate.field).string = {uri: true}]; // 主脚本包 zip url(内含 main.py + requirement.txt)
  string name  = 3 [(buf.validate.field).string = {
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]*[a-zA-Z0-9]$"
  }]; // 脚本包名字:仅字母数字下划线连字符,首尾须为字母或数字
  string description = 4; // 脚本描述
  string version     = 5 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 版本号,用户自填
  string ex_api_key  = 6; // 三方上传时自动塞入:脚本内调三方服务用
  google.protobuf.Struct ex_data = 7; // 预置数据,调用时注入执行环境
  string uuid        = 8; // **脚本 id**:空=新脚本;非空=给该脚本加版本
}

message CreatePluginResp {
  option (hi.audience) = VIS_SELF; // 我的插件 id
  string uuid = 1 [(hi.visibility) = VIS_SELF]; // 插件id
}

// 一级页:列某 agent 的脚本(每个 uuid 一行,返回其**激活版本**)。
// ⚠️ 按 **uuid** 识别脚本,不是 name —— name 可重复,不能当身份。
message ListPluginReq {
  string        agent      = 1;
  hi.Pagination pagination = 2;
}

// 二级页:列某脚本的**所有版本**(版本管理页)。
message ListVersionsReq {
  string        uuid       = 1; // 脚本 id
  hi.Pagination pagination = 2;
}

message ListPluginResp {
  option (hi.audience) = VIS_SELF; // 列 owner 自己机器人的插件 → SELF
  int32               total = 1 [(hi.visibility) = VIS_SELF];
  repeated PluginItem list  = 2 [(hi.visibility) = VIS_SELF];
}

message DeletePluginReq {
  string uuid    = 1; // 脚本 id
  string version = 2; // 版本;**留空 = 删整个脚本(所有版本)**
}

message DeletePluginByAgentsReq {
  repeated string agents = 1;
}

// 改插件的可变字段:名字/包 url/描述/ExAPIKey/ExData。版本号不可改(改版本=新建一个版本)。
message EditPluginReq {
  string     uuid = 1;
  PluginItem item = 2;
  string     ex_api_key = 3;
  google.protobuf.Struct ex_data = 4;
}

// 选定某脚本的哪个版本供 function call 调用(同脚本多版本共存,只能激活一个)。
// **必须 uuid + version** —— 单靠 uuid 定位不到具体版本。
message SetActiveVersionReq {
  string uuid    = 1; // 脚本 id
  string version = 2; // 要激活的版本
}

message GetPluginReq {
  string uuid    = 1; // 脚本 id
  string version = 2; // 版本;**留空 = 取激活版本**
}

message GetPluginResp {
  option (hi.audience) = VIS_SELF; // PluginItem(SELF)
  PluginItem item = 1 [(hi.visibility) = VIS_SELF];
}

// ⚠️ **参数文件 ≠ ExData,别再合并**(我曾把 GetPythonParams 改名成 GetExData,是错的):
//   - **参数文件(params)**:function call 的**参数 schema**,告诉 LLM 这个脚本怎么调,
//     形如 {"type":"object","properties":{"city":{...}},"required":["city"]};网页上配置后自动生成。
//   - **ExData**:用户**预先上传给脚本用的数据**,运行期以 py 字典注入执行环境。
// 两者完全是两回事。
message GetParamsReq {
  string uuid    = 1; // 脚本 id
  string version = 2; // 版本;留空=激活版本
}

message GetParamsResp {
  option (hi.audience) = VIS_SELF; // 我的插件的参数 schema
  google.protobuf.Struct params = 1 [(hi.visibility) = VIS_SELF]; // function call 的参数 schema
}

// 插件管理(主体=插件)。商户档:**hiai 自己的 web 与三方商户后台都会调**,
// 故 token 与 apikey 都要收,两者解出同一个商户 did。
// ⚠️ 方法名别用 `Switch` —— **switch 是 Dart 的保留字**,dart 生成器会吐出
//    `ResponseFuture<...> switch(...)` 直接语法错误,整个 CI 生成挂掉。
//    (Go/Rust 都没事,所以只测 go 生成发现不了。)
service Plugin {
  rpc Create (CreatePluginReq) returns (CreatePluginResp) { option (hi.auth) = AUTH_MERCHANT; }        // 上传插件版本(存在则覆盖)
  rpc Edit (EditPluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }       // 改插件
  rpc Get (GetPluginReq) returns (GetPluginResp) { option (hi.auth) = AUTH_MERCHANT; }                 // 查某版本(version 空=激活版本)
  rpc List (ListPluginReq) returns (ListPluginResp) { option (hi.auth) = AUTH_MERCHANT; }              // 一级页:列脚本(每 uuid 一行,返回激活版本)
  rpc ListVersions (ListVersionsReq) returns (ListPluginResp) { option (hi.auth) = AUTH_MERCHANT; }    // 二级页:列某脚本的所有版本
  rpc Delete (DeletePluginReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }   // 删版本(version 空=删整个脚本)
  rpc DeleteByAgents (DeletePluginByAgentsReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 按 agent 批量删(原 DeleteByDids,名实对齐 agents)
  rpc SetActiveVersion (SetActiveVersionReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 选定供 function call 调用的版本
  rpc GetParams (GetParamsReq) returns (GetParamsResp) { option (hi.auth) = AUTH_MERCHANT; }           // 取 function call 参数 schema(原 GetPythonParams)
  rpc SetEnabled (SetEnabledReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 脚本级开关:是否参与推理(与 SetActiveVersion 对称;原 SetSwitches 切的是记忆开关,已移到 Agent.Edit)
}

// ── py-docker 执行契约 ──────────────────────────────────────────────────
// AiPlugin 是**独立的 py-docker 服务**,专门用来安全执行 py 脚本。
// hiai 是**调用方**(把脚本工程丢给 py-docker 跑),本 server **不在 hiai 实现**。
//
// 原设计含"外调/脚本"等多种形式,现**统一成脚本一种**:Search / Python(内联代码)已删。
// 依赖不再自动下载,由工程内的 requirement.txt 显式声明。

message RunReq {
  string          code_archive_url = 1; // 主脚本包 zip(main.py + requirement.txt)
  string          code_params      = 2; // 调用参数
  string          uuid             = 3; // 插件id
  repeated string envs             = 4; // 环境变量 key=value
  // ExAPIKey / ExData 以 py 字典结构注入执行环境
  string                 ex_api_key = 5;
  google.protobuf.Struct ex_data    = 6;
}

message RunResp {
  option (hi.audience) = VIS_SELF; // 引用 chat.Content(SELF)→ 脚本执行结果随之 SELF
  repeated Content conts = 1 [(hi.visibility) = VIS_SELF];
}

message CleanupReq {
  string code_archive_url = 1;
}

// py-docker 脚本执行(由 py-docker 服务实现,hiai 只作调用方)。
service AiPlugin {
  rpc Run (RunReq) returns (RunResp) { option (hi.auth) = AUTH_NONE; }                            // 跑脚本工程(原 PythonProject)
  rpc Cleanup (CleanupReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; }      // 清理脚本工程(原 CleanupPythonProject)
}
