syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "hi/common.proto";
import "hi/options.proto";

message GetUserApiKeyReq {
  string user = 1; // 用户Did/智能体Did
}

message GetUserApiKeyResp {
  hi.Entity user    = 1;
  string    api_key = 2;
}

service UserCallback {
  rpc GetUserApiKey (GetUserApiKeyReq) returns (GetUserApiKeyResp) { option (hi.auth) = AUTH_TOKEN; } // 获取用户API Key和基础信息
}
