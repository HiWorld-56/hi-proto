syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "hi/common.proto";
import "google/protobuf/empty.proto";
import "hi/did/auth.proto";
import "hi/options.proto";

service Auth {
  rpc RefreshToken (hi.did.RefreshTokenReq) returns (hi.AuthToken) { option (hi.auth) = AUTH_NONE; } // 不鉴权
  rpc GenerateReqId (hi.did.GenerateReqIdReq) returns (hi.did.LoginQr) { option (hi.auth) = AUTH_NONE; } // 不鉴权;回 reqId 与 hidid 生成的二维码文本
  rpc GetReqStatus (hi.RequestId) returns (hi.did.ReqStatusResp) { option (hi.auth) = AUTH_NONE; }
  // 登出:删该会话的 refresh/access 行。**凭 refresh_token 证明归属**(当前或宽限位那份,
  // 与 hi.did / hi.club 同一判据),不作数一律 Unauthenticated、不回假成功。
  // AUTH_NONE 只是传输层不验 access(登出时它可能已过期),不是不要凭据。
  //
  // 🔴 hi-ai 此前**根本没有登出** —— 会话只能等自己过期(15 天)或被同一台设备的新登录覆盖,
  // 用户主动退出这件事做不到。与 club / hi-did 同形补上。
  rpc Logout (hi.did.RefreshTokenReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; }
}
