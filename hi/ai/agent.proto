syntax = "proto3";

package hi.ai;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/ai";

import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

/////////////////////////////// 智能体 ///////////////////////////////
message Prompt {
  option (hi.audience) = VIS_SELF; // 系统/用户提示词=机器人私有配置,只给 owner 本人
  string system = 1 [(hi.visibility) = VIS_SELF];
  string user   = 2 [(hi.visibility) = VIS_SELF];
}

// 一个 agent 选用的一组模型。原名 Model —— 与模型目录 service Model 同包重名,
// 且它本就不是"一个模型"而是一套选择,故改名 ModelSet。
message ModelSet {
  option (hi.audience) = VIS_SELF; // 本 agent 选用的模型=私有配置(模型「目录」在 model.proto 才是 PUBLIC)
  string llm       = 1 [(hi.visibility) = VIS_SELF];
  string stt       = 2 [(hi.visibility) = VIS_SELF];
  string tts       = 3 [(hi.visibility) = VIS_SELF];
  string embedding = 4 [(hi.visibility) = VIS_SELF];
  string mem_model = 5 [(hi.visibility) = VIS_SELF]; // 记忆模型:与其它模型配置同处,经 Agent.Edit 设置(原 Training.SetMemModel/GetMemModel 已删,别再开第二条写路径)
}

// 智能体配置。
//
// ⚠️ **插件没有总开关**:有 plugin 权限 = 插件模块就是开的;是否生效由每个脚本自己的 enabled 决定
//    (原 use_plugin 已删)。故这里只剩 use_mem 一个总开关 —— 记忆模块待重构,重构前暂留。
message AgentConfig {
  option (hi.audience) = VIS_SELF; // 机器人配置(提示词/模型/记忆开关)=owner 私产
  Prompt         prompt  = 1 [(hi.visibility) = VIS_SELF];
  optional float freedom = 2 [(hi.visibility) = VIS_SELF]; // 控制模型输出的随机性，值越大越随机
  ModelSet       model   = 3 [(hi.visibility) = VIS_SELF];
  optional int32 qa_num  = 4 [(hi.visibility) = VIS_SELF]; // 上下文组数
  optional bool  use_mem = 5 [(hi.visibility) = VIS_SELF]; // 启用记忆（启用训练数据）。optional:Edit 局部更新——不传=不动,避免只改别的字段时把记忆误关。
                              // 启用需 mem 权限(use-side 判);记忆开关的唯一写入口就是 Agent.Edit(原 SetSwitches 已移除)。
}

// 用量/计费数据,只发给资源主人本人。
message TokenUsage {
  option (hi.audience) = VIS_SELF;
  int32 output = 1 [(hi.visibility) = VIS_SELF]; // 模型生成输出时消耗的token数。
  int32 input  = 2 [(hi.visibility) = VIS_SELF]; // 模型输入时消耗的token数
  int32 mem    = 3 [(hi.visibility) = VIS_SELF]; // 训练消耗的token数
}

message AgentInfo {
  option (hi.audience) = VIS_SELF; // 含 config/token 私产 → 整条只发给 owner 本人
  hi.Entity   base       = 1 [(hi.visibility) = VIS_PUBLIC]; // hi.Entity 恒 PUBLIC
  AgentConfig config     = 2 [(hi.visibility) = VIS_SELF];
  string      creator    = 3 [(hi.visibility) = VIS_SELF]; // 归属 did
  string      note       = 4 [(hi.visibility) = VIS_SELF];
  TokenUsage  token      = 5 [(hi.visibility) = VIS_SELF];
  int64       created_at = 6 [(hi.visibility) = VIS_SELF];
  bool        marked     = 7 [(hi.visibility) = VIS_SELF]; // 是否被打了标记(带标记的显示靠前);原 favorited
}

message DefaultConfigResp {
  option (hi.audience) = VIS_SELF; // 复用 AgentConfig(SELF)→整条随之 SELF
  AgentConfig config = 1 [(hi.visibility) = VIS_SELF]; // 全局默认配置(建 agent 用的模板,与具体 agent 无关)
}

message CreateAgentReq {
  hi.Entity base = 1;
}

message CreateAgentResp {
  option (hi.audience) = VIS_SELF; // 含 AgentConfig 私产 → SELF
  hi.Entity   base    = 1 [(hi.visibility) = VIS_PUBLIC]; // hi.Entity 恒 PUBLIC
  AgentConfig config  = 2 [(hi.visibility) = VIS_SELF];
  hi.Entity   creator = 3 [(hi.visibility) = VIS_PUBLIC]; // hi.Entity 恒 PUBLIC
}

message EditAgentReq {
  hi.Entity   base   = 1;
  AgentConfig config = 2;
  string      note   = 3;
}

message ListAgentResp {
  option (hi.audience) = VIS_SELF; // 列 owner 自己的机器人(含 config)→ SELF
  int32              total = 1 [(hi.visibility) = VIS_SELF];
  repeated AgentInfo infos = 2 [(hi.visibility) = VIS_SELF];
}

// Agent 列表入参:dids 空=列调用者自己的;非空=按 did 列。
message ListAgentReq {
  repeated string agents       = 1; // 可选:只看这些 did;空=列自己的
  hi.Pagination   pagination = 2;
}

// 标记列表入参:查的是**调用者**打过标记的,必须有身份。
message ListMarksReq {
  repeated string agents       = 1; // 可选:在我的标记里再按 did 过滤
  hi.Pagination   pagination = 2;
}

message DeleteAgentReq {
  string agent = 1;
}

message GetAgentReq {
  string agent = 1;
}

message GetAgentResp {
  option (hi.audience) = VIS_SELF; // AgentInfo(SELF)
  AgentInfo info = 1 [(hi.visibility) = VIS_SELF];
}

message AgentUsageReq {
  string agent = 1;
}

// 机器人用量。原 FindAgentCountResp —— 它不是"count",而是消息数 + token 三件套。
message AgentUsageResp {
  option (hi.audience) = VIS_SELF;
  int32      message_count = 1 [(hi.visibility) = VIS_SELF];
  TokenUsage token         = 2 [(hi.visibility) = VIS_SELF];
}

message ResetToDefaultReq {
  repeated string agents = 1;
}

// 给机器人打/取消标记。**不是收藏** —— 带标记的机器人在显示时靠前。
message MarkAgentReq {
  string agent    = 1;
  bool   marked = 2; // true=打标记(显示靠前),false=取消(与 AgentInfo.marked 对称)
}

// 智能体(主体=智能体)。商户档:hiai web(token)与商户后台服务(apikey)都会调,
// 两者解出同一个商户 did。
//
// (原 Transfer 已删 —— 它自称"转让 apikey+agent"但只改了 creator,还会顺带把目标非超级用户的
//  agent 模型降级;"把软件机器人转给其他用户"这个概念应在 hiclub 侧实现。)
service Agent {
  rpc Create (CreateAgentReq) returns (CreateAgentResp) { option (hi.auth) = AUTH_MERCHANT; }        // 建智能体
  rpc Edit (EditAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }      // 改智能体
  rpc Delete (DeleteAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }  // 删智能体(连带删文件+训练数据)
  rpc Get (GetAgentReq) returns (GetAgentResp) { option (hi.auth) = AUTH_MERCHANT; }                 // 查单个智能体
  rpc List (ListAgentReq) returns (ListAgentResp) { option (hi.auth) = AUTH_MERCHANT; }              // 列智能体
  rpc Mark (MarkAgentReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; }      // 打/取消标记(显示靠前)
  rpc ListMarks (ListMarksReq) returns (ListAgentResp) { option (hi.auth) = AUTH_MERCHANT; }         // 列我打过标记的
  rpc GetUsage (AgentUsageReq) returns (AgentUsageResp) { option (hi.auth) = AUTH_MERCHANT; }        // 机器人用量(消息数+token)
  rpc GetDefaultConfig (google.protobuf.Empty) returns (DefaultConfigResp) { option (hi.auth) = AUTH_MERCHANT; } // 取全局默认配置(原 DefaultConfig,补动词)
  rpc ResetToDefault (ResetToDefaultReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_MERCHANT; } // 批量重置为默认配置
}
