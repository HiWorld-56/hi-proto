syntax = "proto3";

package hi.source;

option go_package = "github.com/HiWorld-56/hi-proto/go/hi/source";

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "hi/common.proto";
import "hi/options.proto";

message DownloadReq {
  string url = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}];
}

message DownloadResp {
  option (hi.audience) = VIS_PUBLIC; // File.Download 为 AUTH_NONE(免鉴权),按 url 取公开资源内容
  bytes content = 1 [(hi.visibility) = VIS_PUBLIC];
}

message DownloadStreamResp {
  option (hi.audience) = VIS_PUBLIC; // File.DownloadStream 免鉴权 AUTH_NONE,公开资源(同 DownloadResp)
  bytes chunk  = 1 [(hi.visibility) = VIS_PUBLIC]; // 文件内容分片
  int64 sent   = 2 [(hi.visibility) = VIS_PUBLIC]; // 已发送字节数（累计）, 单位：字节
  int64 total  = 3 [(hi.visibility) = VIS_PUBLIC]; // 文件总大小, 单位：字节
  int64 offset = 4 [(hi.visibility) = VIS_PUBLIC]; // 当前块在文件中的起始字节位置
}

message DownloadStreamReq {
  string url    = 1 [(buf.validate.field).string = {pattern: "^\\S+$"}]; // 文件URL
  int64  offset = 2 [(buf.validate.field).int64 = {gte: 0}]; // 起始偏移量（字节），0表示从头开始，支持断点续传
  int64  limit  = 3 [(buf.validate.field).int64 = {gte: 0}]; // 限制下载大小（字节），0表示下载全部
}

// ── bucket 化上传(新)────────────────────────────────────────────────────
// hi-source 的定位:**只做"帮各服务拿着 minio 凭据的搬运工"** —— 不再懂业务。
// 存哪个 bucket、哪个目录由**调用方**决定;hi-source 只负责随机改名 + 落库 + 回 url。
// 故 Put 没有 `type` 那套业务枚举(image/avatar/code…),它已被 bucket+dir 取代。
//
// 分工(定稿):
//   hidid  → avatar/ (用户头像)、logo/ (商户 logo)      公开读,永固
//   hiclub → avatar/ (群头像)、background/ (群背景)      公开读,永固
//   hiai   → plugin/<uuid>/<version>.zip (插件脚本)      **私有**,永固
//   temp   → <YYYY_MM>/ (聊天/AI 媒体)                   公开读,**14 天过期**
//   log    → <app>/<did>/                                私有
//
// ⚠️ 鉴权:AUTH_NONE 是**有意的** —— hi-source 只对内网开放(上传端口不对外),
//    鉴权由各业务模块在转发前完成(它们本就持有用户身份)。
message PutReq {
  string bucket    = 1 [(buf.validate.field).string.pattern="^\\S+$"]; // 目标 bucket
  string dir       = 2; // bucket 内逻辑目录,如 "avatar" / "plugin/<uuid>";空=根
  string name      = 3 [(buf.validate.field).string.min_len = 1]; // 原始文件名(允许空格等,仅用于取扩展名;NAME_RANDOM 只保留扩展名,不带原名)
  bytes  content   = 4 [(buf.validate.field).bytes.min_len = 1];
  bool   thumbnail = 5; // 是否同时生成缩略图(仅图片有效;原先靠 type==image 隐式触发,现改显式)
  NameMode name_mode = 6; // 对象命名方式,默认随机
}

// 对象命名方式。
//
// ⚠️ **红线**:公开 bucket 的用户内容一律用 NAME_RANDOM。那些 bucket 的安全性正是靠
//    「32 位随机名不可猜 + LIST 403 不可枚举」撑起来的 —— 名字一旦可预测,等于门户洞开。
//    非随机模式只给**私有 bucket 的运维类文件**(日志等)用。
enum NameMode {
  NAME_RANDOM    = 0; // <32位随机><扩展名>。默认,用户内容必须用它;不带原名(原名可能含空格/特殊字符)
  NAME_TIMESTAMP = 1; // <原名主干>_<UTC纳秒时间戳><扩展名>。名字可读、天然有序,每次新对象 —— 日志用
  NAME_KEEP      = 2; // 原样用 name。**同一对象反复覆盖,只留最新一份**,会丢历史,慎用
}

message PutResp {
  option (hi.audience) = VIS_PUBLIC;
  string          url       = 1 [(hi.visibility) = VIS_PUBLIC]; // 完整可下载 url(私有 bucket 的 url 需经 Download 取)
  optional string thumb_url = 2 [(hi.visibility) = VIS_PUBLIC];
}

message PutStreamReq {
  oneof data {
    PutMeta meta  = 1; // 元数据,第一个请求包
    bytes   chunk = 2; // 内容分片
  }
}

message PutMeta {
  string bucket    = 1 [(buf.validate.field).string.pattern="^\\S+$"];
  string dir       = 2;
  string name      = 3 [(buf.validate.field).string.min_len = 1]; // 允许空格等,仅用于取扩展名
  int64  size      = 4 [(buf.validate.field).int64 = { gt: 0 }];
  bool   thumbnail = 5;
}

// 删除。**补这个是因为原先根本没有** —— 各业务模块把文件交给 hi-source 之后就再也
// 删不掉了:用户在业务侧删掉记录,对象永远留在桶里。temp 桶有 14 天 lifecycle 兜底,
// 永久桶和私有桶没有,只会一直涨。
//
// ⚠️ 幂等:对象不存在也返回成功 —— 调用方多半是"删库记录顺带删对象",
//    对象早没了不该让整个删除操作失败。
message DeleteReq {
  string url = 1 [(buf.validate.field).string.pattern="^\\S+$"]; // 完整 url,bucket/对象名从中解析
}

service File {
  rpc Put (PutReq) returns (PutResp) { option (hi.auth) = AUTH_NONE; } // bucket 化上传(内网)
  rpc PutStream (stream PutStreamReq) returns (PutResp) { option (hi.auth) = AUTH_NONE; } // bucket 化流式上传(内网)
  rpc Download (DownloadReq) returns (DownloadResp) { option (hi.auth) = AUTH_NONE; } // 文件下载(从 url 解析 bucket,新老 url 通吃)
  rpc DownloadStream (DownloadStreamReq) returns (stream DownloadStreamResp) { option (hi.auth) = AUTH_NONE; } // 流式下载
  rpc Delete (DeleteReq) returns (google.protobuf.Empty) { option (hi.auth) = AUTH_NONE; } // 按 url 删对象(bucket 从 url 解析)
}

service Base {
  rpc ServerVersion (google.protobuf.Empty) returns (hi.ServerVersionResp) { option (hi.auth) = AUTH_NONE; } // 不鉴权:查服务自身版本+环境
}
