type: google.api.Service
config_version: 3

# hi.ai HTTP 路由。**破坏性改动**:随 proto 重构一并对齐新的 service/方法名,
# 不再保留 find_agent / favorite_agent / training_agent 这类词不达意的旧路径。
# 规则:/api/v1/<service_snake>/<method_snake>。
http:
  rules:
# ── 公开 ──
# Auth(扫码登录握手,穿透 did)
  - selector: hi.ai.Auth.GenerateReqId
    post: /api/v1/auth/generate_req_id
    body: "*"
  - selector: hi.ai.Auth.GetReqStatus
    post: /api/v1/auth/get_req_status
    body: "*"
  - selector: hi.ai.Auth.RefreshToken
    post: /api/v1/auth/refresh_token
    body: "*"
# Register(原 InviteCode.Verify)
  - selector: hi.ai.Register.Verify
    post: /api/v1/register/verify
    body: "*"
# Base(版本+环境探测;与 did 一致)
  - selector: hi.ai.Base.ServerVersion
    get: /api/v1/base/server_version

# ── 商户档(apikey 或 token)──
# ApiKey
  - selector: hi.ai.ApiKey.Create
    post: /api/v1/api_key/create
  - selector: hi.ai.ApiKey.Edit
    post: /api/v1/api_key/edit
    body: "*"
  - selector: hi.ai.ApiKey.List
    post: /api/v1/api_key/list
    body: "*"
  - selector: hi.ai.ApiKey.Delete
    post: /api/v1/api_key/delete
    body: "*"
# Agent
  - selector: hi.ai.Agent.Create
    post: /api/v1/agent/create
    body: "*"
  - selector: hi.ai.Agent.Edit
    post: /api/v1/agent/edit
    body: "*"
  - selector: hi.ai.Agent.Delete
    post: /api/v1/agent/delete
    body: "*"
  - selector: hi.ai.Agent.Get
    get: /api/v1/agent/get
  - selector: hi.ai.Agent.List
    post: /api/v1/agent/list
    body: "*"
  - selector: hi.ai.Agent.Mark
    post: /api/v1/agent/mark
    body: "*"
  - selector: hi.ai.Agent.ListMarks
    post: /api/v1/agent/list_marks
    body: "*"
  - selector: hi.ai.Agent.GetUsage
    post: /api/v1/agent/get_usage
    body: "*"
  - selector: hi.ai.Agent.DefaultConfig
    get: /api/v1/agent/default_config
  - selector: hi.ai.Agent.ResetToDefault
    post: /api/v1/agent/reset_to_default
    body: "*"
# Model(模型目录,从 Agent 拆出)
  - selector: hi.ai.Model.ListLlms
    get: /api/v1/model/list_llms
  - selector: hi.ai.Model.ListEmbeddings
    get: /api/v1/model/list_embeddings
  - selector: hi.ai.Model.ListStts
    get: /api/v1/model/list_stts
  - selector: hi.ai.Model.ListTts
    get: /api/v1/model/list_tts
# Chat
  - selector: hi.ai.Chat.NewSession
    get: /api/v1/chat/new_session
  - selector: hi.ai.Chat.Send
    post: /api/v1/chat/send
    body: "*"
  - selector: hi.ai.Chat.Stream
    post: /api/v1/chat/stream
    body: "*"
  - selector: hi.ai.Chat.GetHistory
    post: /api/v1/chat/get_history
    body: "*"
  - selector: hi.ai.Chat.ClearHistory
    post: /api/v1/chat/clear_history
    body: "*"
  - selector: hi.ai.Chat.TextToText
    post: /api/v1/chat/text_to_text
    body: "*"
  - selector: hi.ai.Chat.TextToTextResume
    post: /api/v1/chat/text_to_text_resume
    body: "*"
  - selector: hi.ai.Chat.SpeechToText
    post: /api/v1/chat/speech_to_text
    body: "*"
  - selector: hi.ai.Chat.SpeechToTextResume
    post: /api/v1/chat/speech_to_text_resume
    body: "*"
  - selector: hi.ai.Chat.SpeechToSpeech
    post: /api/v1/chat/speech_to_speech
    body: "*"
  - selector: hi.ai.Chat.SpeechToSpeechResume
    post: /api/v1/chat/speech_to_speech_resume
    body: "*"
# Speech(真 STT/TTS,从 Chat 拆出)
  - selector: hi.ai.Speech.Transcribe
    post: /api/v1/speech/transcribe
    body: "*"
  - selector: hi.ai.Speech.Synthesize
    post: /api/v1/speech/synthesize
    body: "*"
# AgentBench(延迟统计,从 Chat 拆出;两个 Delay 方法合一)
  - selector: hi.ai.AgentBench.List
    post: /api/v1/agent_bench/list
    body: "*"
# Plugin(py 脚本一种;search/draw 已砍)
  - selector: hi.ai.Plugin.Create
    post: /api/v1/plugin/create
    body: "*"
  - selector: hi.ai.Plugin.Edit
    post: /api/v1/plugin/edit
    body: "*"
  - selector: hi.ai.Plugin.Get
    get: /api/v1/plugin/get
  - selector: hi.ai.Plugin.List
    post: /api/v1/plugin/list
    body: "*"
  - selector: hi.ai.Plugin.Delete
    post: /api/v1/plugin/delete
    body: "*"
  - selector: hi.ai.Plugin.DeleteByDids
    post: /api/v1/plugin/delete_by_dids
    body: "*"
  - selector: hi.ai.Plugin.SetActiveVersion
    post: /api/v1/plugin/set_active_version
    body: "*"
  - selector: hi.ai.Plugin.GetExData
    get: /api/v1/plugin/get_ex_data
  - selector: hi.ai.Plugin.Switch
    post: /api/v1/plugin/switch
    body: "*"
# Training
  - selector: hi.ai.Training.Start
    post: /api/v1/training/start
    body: "*"
  - selector: hi.ai.Training.Status
    post: /api/v1/training/status
    body: "*"
  - selector: hi.ai.Training.Clear
    post: /api/v1/training/clear
    body: "*"
  - selector: hi.ai.Training.UploadFile
    post: /api/v1/training/upload_file
    body: "*"
  - selector: hi.ai.Training.ListFiles
    post: /api/v1/training/list_files
    body: "*"
  - selector: hi.ai.Training.GetFile
    post: /api/v1/training/get_file
    body: "*"
  - selector: hi.ai.Training.DeleteFile
    post: /api/v1/training/delete_file
    body: "*"
  - selector: hi.ai.Training.DeleteFiles
    post: /api/v1/training/delete_files
    body: "*"
  - selector: hi.ai.Training.DeleteFilesByAgents
    post: /api/v1/training/delete_files_by_agents
    body: "*"
  - selector: hi.ai.Training.CreateContent
    post: /api/v1/training/create_content
    body: "*"
  - selector: hi.ai.Training.UpdateContent
    post: /api/v1/training/update_content
    body: "*"
  - selector: hi.ai.Training.EditDigest
    post: /api/v1/training/edit_digest
    body: "*"
  - selector: hi.ai.Training.SetMemModel
    post: /api/v1/training/set_mem_model
    body: "*"
  - selector: hi.ai.Training.GetMemModel
    get: /api/v1/training/get_mem_model

# ── 超管档(名单穿透 hidid)──
# Permission(原 UserACL)—— 查(商户档)
  - selector: hi.ai.Permission.Get
    post: /api/v1/permission/get
    body: "*"
# PermissionManage —— 管(超管)
  - selector: hi.ai.PermissionManage.Add
    post: /api/v1/permission_manage/add
    body: "*"
  - selector: hi.ai.PermissionManage.Delete
    post: /api/v1/permission_manage/delete
    body: "*"
  - selector: hi.ai.PermissionManage.Edit
    post: /api/v1/permission_manage/edit
    body: "*"
  - selector: hi.ai.PermissionManage.List
    post: /api/v1/permission_manage/list
    body: "*"
  - selector: hi.ai.PermissionManage.ListTypes
    get: /api/v1/permission_manage/list_types
# Merchant(商户目录,承接原 UserACL.List(type=NORMAL))
  - selector: hi.ai.Merchant.List
    post: /api/v1/merchant/list
    body: "*"
# Setting(服务级全局配置)
  - selector: hi.ai.Setting.Get
    get: /api/v1/setting/get
  - selector: hi.ai.Setting.Edit
    post: /api/v1/setting/edit
    body: "*"
# InviteCode(管理;注册见上面 Register)
  - selector: hi.ai.InviteCode.Create
    post: /api/v1/invite_code/create
  - selector: hi.ai.InviteCode.Edit
    post: /api/v1/invite_code/edit
    body: "*"
  - selector: hi.ai.InviteCode.List
    post: /api/v1/invite_code/list
    body: "*"
  - selector: hi.ai.InviteCode.Delete
    post: /api/v1/invite_code/delete
    body: "*"
