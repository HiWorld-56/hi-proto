type: google.api.Service
config_version: 3

http:
  rules:
# Auth
  - selector: hi.media.Auth.GenerateReqId
    post: /api/v1/auth/generate_req_id
    body: "*"
  - selector: hi.media.Auth.GetReqStatus
    post: /api/v1/auth/get_req_status
    body: "*"
  - selector: hi.media.Auth.RefreshToken
    post: /api/v1/auth/refresh_token
    body: "*"
# Base
  - selector: hi.media.Base.ListSuperAdminUsers
    post: /api/v1/base/list_super_admin_users